/* molduras:fim */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--parede-casa); color: var(--marfim);
         font-family: "Archivo", system-ui, sans-serif; font-size: 16px; line-height: 1.45; }
  h1, h2, p { margin: 0; }
  header { padding: 32px 24px 8px; max-width: 1400px; margin: 0 auto; }
  /* a Jersey 10 em multiplos da grade dela: 56 px da 3 px de CSS por pixel, e 37,333 px da 2 */
  h1 { margin-bottom: 14px; font-family: "Jersey 10", "Archivo", sans-serif; font-size: 56px; font-weight: 400; line-height: 52px;
       color: #FBEFD9; text-shadow: var(--letra-contorno); }
  header p { max-width: 60ch; text-shadow: 0 1.5px 0 var(--contorno); }
  main { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; gap: 32px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
  .t { display: flex; flex-direction: column; padding: 16px; color: var(--tinta);
       border: 8px solid transparent; border-radius: 4px; border-image: var(--mold-caixa);
       background: linear-gradient(#EFE4CB, #EFE4CB) padding-box, var(--veio) border-box, #74391A;
       box-shadow: inset 0 0 0 2px var(--contorno), inset 2px 2px 0 2px rgba(255,255,255,.7), inset -2px -2px 0 2px rgba(42,24,18,.14); }
  .t.sel { outline: 3px solid var(--ambar); outline-offset: 6px; }
  .shot { aspect-ratio: 16 / 10; margin: 2px; background: #16110E; display: block; overflow: hidden;
          box-shadow: 0 0 0 2px var(--contorno), 0 2px 0 2px rgba(20,8,2,.45); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .shot .none { display: grid; place-items: center; height: 100%; color: var(--marfim-2); font-size: 14px; }
  .body { padding: 14px 0 0; display: grid; gap: 6px; flex: 1; }
  .body h2 { font-family: "Jersey 10", "Archivo", sans-serif; font-size: 37.333px; font-weight: 400; line-height: 36px; }
  .dir { color: var(--tinta-2); font-size: 14px; }
  .blurb { font-size: 15px; color: #3f2f24; }
  .autor { justify-self: start; font-size: 13px; font-weight: 600; padding: 2px 8px; background: #E2D3B3; color: var(--tinta-2); }
  .row { display: flex; gap: 14px; margin-top: auto; padding-top: 12px; flex-wrap: wrap; }
  a.btn, button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; cursor: pointer;
                  font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.1; color: var(--tinta); text-decoration: none;
                  border: 0; border-radius: 4px; border-image: var(--mold-objeto); background: var(--escovado), #E2DBCF; }
  a.btn { background: var(--ambar); }
  @media (hover: hover) {
    button:hover { background: var(--escovado), #EEE8DD; }
    a.btn:hover { background: #F7B859; }
  }
  a.btn:active, button:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(42,24,18,.16); border-image: var(--mold-objeto-apertado); }
  a.btn:focus-visible, button:focus-visible, .shot:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }
  .t a.btn:focus-visible, .t button:focus-visible, .t .shot:focus-visible { outline-color: #8F4A0C; }
  #cmp { display: none; position: fixed; inset: 0; background: var(--parede-casa); z-index: 5; flex-direction: column; }
  #cmp.on { display: flex; }
  #cmp .bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--jacaranda); box-shadow: inset 0 -3px 0 var(--contorno); }
  #cmp .bar span { flex: 1; color: var(--marfim-2); }
  #cmp .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
  #cmp iframe { width: 100%; height: 100%; border: 0; border-right: 3px solid var(--contorno); }
  .empty { text-shadow: 0 1.5px 0 var(--contorno); }

<body>
<header>
  <h1>Vitrola: temas</h1>
  <p>As interfaces da Vitrola. Abra uma para usar, ou marque duas e compare lado a lado; todas
     controlam o mesmo áudio.</p>
</header>
<main>
  <div class="grid" id="grid"><p class="empty">Carregando os temas...</p></div>
</main>
<div id="cmp" role="dialog" aria-label="Comparação">
  <div class="bar"><span id="cmpt"></span><button class="ghost" id="close">Fechar comparação</button></div>
  <div class="panes"><iframe id="fa" title="Tema A"></iframe><iframe id="fb" title="Tema B"></iframe></div>
</div>
<script>
const sel = [];
const grid = document.getElementById('grid');
function card(t) {
  const el = document.createElement('article');
  el.className = 't';
  el.innerHTML = `
    <a class="shot" href="${t.url}" aria-label="Abrir ${t.name || t.slug}">
      <img src="${t.url}preview.png" alt="" loading="lazy"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'sem prévia ainda'}))">
    </a>
    <div class="body">
      <h2></h2><div class="autor"></div><div class="dir"></div><div class="blurb"></div>
      <div class="row"><a class="btn" href="${t.url}">Abrir</a>
        <button class="ghost" type="button">Comparar</button></div>
    </div>`;
  el.querySelector('h2').textContent = t.name || t.slug;
  el.querySelector('.dir').textContent = t.direction || '';
  const au = el.querySelector('.autor');
  if (t.autor) au.textContent = `feito pelo ${t.autor}`; else au.remove();
  el.querySelector('.blurb').textContent = t.blurb || '';
  const b = el.querySelector('button');
  b.onclick = () => {
    const i = sel.indexOf(t);
    if (i >= 0) { sel.splice(i, 1); el.classList.remove('sel'); b.textContent = 'Comparar'; return; }
    sel.push(t); el.classList.add('sel'); b.textContent = 'Marcado';
    if (sel.length === 2) openCmp();
  };
  t.el = el; t.btn = b;
  return el;
}
function openCmp() {
  const [a, b] = sel;
  document.getElementById('fa').src = a.url;
  document.getElementById('fb').src = b.url;
  document.getElementById('cmpt').textContent = `${a.name || a.slug} e ${b.name || b.slug}`;
  document.getElementById('cmp').classList.add('on');
}
document.getElementById('close').onclick = () => {
  document.getElementById('cmp').classList.remove('on');
  document.getElementById('fa').src = 'about:blank';
  document.getElementById('fb').src = 'about:blank';
  sel.splice(0).forEach(t => { t.el.classList.remove('sel'); t.btn.textContent = 'Comparar'; });
};
fetch('/api/themes').then(r => r.json()).then(ts => {
  grid.innerHTML = '';
  if (!ts.length) { grid.innerHTML = '<p class="empty">Nenhum tema em themes/ ainda.</p>'; return; }
  // agrupado por autor: quem fez fica visível em cada cartão
  ts.sort((a, b) => (a.autor || '').localeCompare(b.autor || '') || a.slug.localeCompare(b.slug));
  ts.forEach(t => grid.appendChild(card(t)));
}).catch(() => { grid.innerHTML = '<p class="empty">A Vitrola não respondeu. Abra o app no PC, pelo menu Iniciar, e recarregue esta página.</p>'; });
</script>
</body>
</html>

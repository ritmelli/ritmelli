# Python 3.12.10 with the libraries of one requirements file, installed into that interpreter with the versions of the
# instalador/travas.txt (the ones the app ships with) and kept in the Actions cache by the runner OS, the Python version
# and the hash of both requirements files and the travas.txt (not the image version: two image versions run side by
# side for days, and the libraries of one Python build do not change with it). With the travas.txt in the key, a cache
# hit holds the same app libraries a fresh install would get; the ones it leaves out (the yt-dlp, the dev-only ones of
# the requirements-dev.txt) stay at the version of the install that filled the cache. On a hit nothing is installed; on
# a miss the libraries are installed and saved right away, so a test that fails later in the job does not lose them. No virtual environment: on Windows its python.exe is a launcher that starts the real interpreter as a
# child, and the tests that compare the pid of a process they started with the one it reports would see two processes.
name: Python and the libraries
description: Python 3.12.10 and the cached libraries of one requirements file
inputs:
  requirements:
    description: the requirements file (requirements.txt or requirements-dev.txt)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: '3.12.10'
    # where pip puts the libraries and their programs, and the runner OS
    - name: Cache key
      id: key
      shell: pwsh
      run: |
        $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
        $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "image=$env:ImageOS`nsite=$site`nscripts=$scripts" -Encoding utf8
    - uses: actions/cache/restore@v6
      id: libs
      with:
        path: |
          ${{ steps.key.outputs.site }}
          ${{ steps.key.outputs.scripts }}
        key: libs-${{ steps.key.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ inputs.requirements }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'instalador/travas.txt') }}
    - name: Bibliotecas
      if: steps.libs.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS -c instalador/travas.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/cache/save@v6
      if: steps.libs.outputs.cache-hit != 'true'
      with:
        path: |
          ${{ steps.key.outputs.site }}
          ${{ steps.key.outputs.scripts }}
        key: ${{ steps.libs.outputs.cache-primary-key }}

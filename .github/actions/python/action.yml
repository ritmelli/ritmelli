# Python 3.12.10 with the libraries of one requirements file, installed into that interpreter and kept in the Actions
# cache by the runner image, the Python version and the hash of both requirements files. On a hit nothing is
# installed; on a miss the libraries are installed and saved right away, so a test that fails later in the job does
# not lose them. No virtual environment: on Windows its python.exe is a launcher that starts the real interpreter as a
# child, and the tests that compare the pid of a process they started with the one it reports would see two processes.
name: Python and the libraries
description: Python 3.12.10 and the cached libraries of one requirements file
inputs:
  requirements:
    description: the requirements file (requirements.txt or requirements-dev.txt)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: '3.12.10'
    # where pip puts the libraries and their programs, and the runner image they were installed on
    - name: Cache key
      id: key
      shell: pwsh
      run: |
        $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
        $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "image=$env:ImageOS-$env:ImageVersion`nsite=$site`nscripts=$scripts" -Encoding utf8
    - uses: actions/cache/restore@v6
      id: libs
      with:
        path: |
          ${{ steps.key.outputs.site }}
          ${{ steps.key.outputs.scripts }}
        key: libs-${{ steps.key.outputs.image }}-py${{ steps.python.outputs.python-version }}-${{ inputs.requirements }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
    - name: Bibliotecas
      if: steps.libs.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/cache/save@v6
      if: steps.libs.outputs.cache-hit != 'true'
      with:
        path: |
          ${{ steps.key.outputs.site }}
          ${{ steps.key.outputs.scripts }}
        key: ${{ steps.libs.outputs.cache-primary-key }}

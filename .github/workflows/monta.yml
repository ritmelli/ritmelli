# Monta o instalador do Ritmelli numa máquina Windows do GitHub, pelo mesmo instalador/monta.ps1 do build à mão, e testa
# o setup e a atualização parcial numa máquina limpa. Só roda à mão: Actions > "Monta o instalador" > Run workflow, numa
# branch ou tag deste repo. O setup, a parcial, o manifesto do atualizador (ainda sem a assinatura dele), o TERCEIROS e o
# VERSOES saem como artefato da execução, por 7 dias.
#
# Quem publica é a esteira do repo privado ritmelli-server: ela pega o artefato de uma execução daqui, passa no
# VirusTotal, assina o manifesto com a chave do atualizador e cria a release no ritmelli-releases. Aqui não entra
# nenhuma chave.
#
# Assinatura de código (SignPath, ver o README): com o segredo SIGNPATH_API_TOKEN e as variáveis SIGNPATH_* do repo, o
# ritmelli.exe é assinado antes de entrar no setup, e o setup e a parcial antes do manifesto (o manifesto guarda o hash
# deles). Cada assinatura espera a aprovação de um dono na SignPath. Sem o segredo, tudo sai sem assinatura.
name: Monta o instalador

on:
  workflow_dispatch:
    inputs:
      notas:
        description: Notas da versão em português, separadas por | (opcional; aparecem na tela de versão nova)
        required: false
        default: ''
      notas_en:
        description: As mesmas notas em inglês, separadas por | (opcional; a tela em inglês mostra as em português sem elas)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  monta:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      ASSINA: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    outputs:
      versao: ${{ steps.congela.outputs.versao }}
      parcial: ${{ steps.monta.outputs.parcial }}
      anterior: ${{ steps.anterior.outputs.manifesto != '' }}
    steps:
      # a credencial sai do disco logo depois de baixar (persist-credentials): o build instala dezenas de pacotes de
      # terceiros
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # o Python do build à mão
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            instalador/travas.txt
      # os textos da interface nas duas línguas (as chaves, os parâmetros e as letras do pixel art), antes de montar:
      # um arquivo quebrado abriria a tela em inglês, e uma chave a menos, um texto faltando. Só a biblioteca padrão
      - name: Confere os textos
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_i18n.py
      # os dados de uso e os erros (metricas.py): so sai o que a lista do PRIVACIDADE.md diz, e nada sem a escolha de
      # quem usa. Sem rede e so a biblioteca padrao
      - name: Confere os dados de uso
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_metricas.py
      # a troca de nome de Vitrola para Ritmelli (#58): a pasta de dados, o registro (o do usuário), a pasta do app de
      # antes e o cookie do celular. Só a biblioteca padrão
      - name: Confere a troca de nome
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_migra.py
      # o servidor de teste (--mock) nunca grava na pasta de dados de quem usa (#117). Só a biblioteca padrão
      - name: Confere a pasta do teste sem som
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_mock.py
      # as vozes do pedal de troca de voz: o vozes.json, o que o instalador baixa e o pedal que fica de fora sem placa de
      # vídeo ou sem as vozes. Sem rede e só a biblioteca padrão
      - name: Confere as vozes
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_vozes.py
      # o pareamento do celular (#127), a única trava do controle pela rede de casa: o código, as tentativas erradas, a
      # chave e a desconexão. Só a biblioteca padrão (o guard do servidor fica para quem tem as bibliotecas do app)
      - name: Confere o pareamento do celular
        env:
          PYTHONUTF8: '1'
        run: python dev/testa_pareamento.py
      # o Inno Setup do build à mão, na pasta do usuário, que é a primeira onde o monta.ps1 procura (a máquina do
      # GitHub pode trazer outra versão em Program Files)
      - name: Inno Setup 6.7.3
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe -UseBasicParsing
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($h -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "o Inno Setup veio com hash $h" }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o instalador do Inno Setup saiu com $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'o ISCC.exe nao ficou na pasta do usuario' }
      # o manifesto da última versão publicada, de onde a parcial compara (o parcial.py confere a assinatura). Sem
      # nenhuma publicada, só o setup completo
      - name: Manifesto anterior
        id: anterior
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $pasta = Join-Path $env:RUNNER_TEMP 'anterior'
          New-Item -ItemType Directory -Force $pasta | Out-Null
          $base = 'https://github.com/ritmelli/ritmelli-releases/releases/latest/download'
          try {
            foreach ($f in 'manifest.json', 'manifest.json.sig') {
              Invoke-WebRequest "$base/$f" -OutFile (Join-Path $pasta $f) -UseBasicParsing
            }
          } catch {
            "sem versão publicada para comparar ($($_.Exception.Message)): só o setup completo"
            exit 0
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "manifesto=$(Join-Path $pasta 'manifest.json')" -Encoding ascii
      - name: Congela o app
        id: congela
        shell: powershell
        run: |
          instalador\monta.ps1 -SoCongela
          $v = (Select-String -Path versao.py -Pattern '^VERSAO = "(.+)"').Matches[0].Groups[1].Value
          # ascii: no PowerShell 5, o >> grava em UTF-16, e o utf8 dele poe BOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "versao=$v" -Encoding ascii

      # assinatura do ritmelli.exe, antes de ele entrar no setup e na parcial
      - if: env.ASSINA == 'true'
        id: app-sem-assinatura
        uses: actions/upload-artifact@v7
        with:
          name: assinar-app-${{ steps.congela.outputs.versao }}
          path: dist/ritmelli/ritmelli.exe
          retention-days: 1
          if-no-files-found: error
      - if: env.ASSINA == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_APP }}
          github-artifact-id: ${{ steps.app-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado-app
      - if: env.ASSINA == 'true'
        name: Troca pelo ritmelli.exe assinado
        shell: powershell
        run: |
          $assinado = Get-ChildItem assinado-app -Recurse -Filter ritmelli.exe | Select-Object -First 1
          if (-not $assinado) { throw 'a SignPath nao devolveu o ritmelli.exe' }
          Copy-Item $assinado.FullName dist\ritmelli\ritmelli.exe -Force
          $s = Get-AuthenticodeSignature dist\ritmelli\ritmelli.exe
          if ($s.Status -ne 'Valid') { throw "o ritmelli.exe voltou com a assinatura $($s.Status)" }
          "ritmelli.exe assinado por $($s.SignerCertificate.Subject)"

      - name: Monta o setup
        id: monta
        shell: powershell
        env:
          ANTERIOR: ${{ steps.anterior.outputs.manifesto }}
          VERSAO: ${{ steps.congela.outputs.versao }}
        run: |
          if ($env:ANTERIOR) { instalador\monta.ps1 -SemCongelar -Anterior $env:ANTERIOR } else { instalador\monta.ps1 -SemCongelar }
          $parcial = Test-Path "instalador\saida\Ritmelli-$env:VERSAO-parcial.exe"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "parcial=$($parcial.ToString().ToLower())" -Encoding ascii

      # assinatura do setup e da parcial, antes do manifesto
      - if: env.ASSINA == 'true'
        id: setup-sem-assinatura
        uses: actions/upload-artifact@v7
        with:
          name: assinar-setup-${{ steps.congela.outputs.versao }}
          path: instalador/saida/Ritmelli-*.exe
          retention-days: 1
          if-no-files-found: error
      - if: env.ASSINA == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SETUP }}
          github-artifact-id: ${{ steps.setup-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado-setup
      - if: env.ASSINA == 'true'
        name: Troca pelo setup e a parcial assinados
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem instalador\saida -Filter 'Ritmelli-*.exe') {
            $assinado = Get-ChildItem assinado-setup -Recurse -Filter $f.Name | Select-Object -First 1
            if (-not $assinado) { throw "a SignPath nao devolveu o $($f.Name)" }
            Copy-Item $assinado.FullName $f.FullName -Force
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "o $($f.Name) voltou com a assinatura $($s.Status)" }
            "$($f.Name) assinado por $($s.SignerCertificate.Subject)"
          }

      # o manifesto do atualizador, ainda sem a assinatura dele: a lista de arquivos precisa do dist\ritmelli, que só
      # existe aqui. Quem assina é a esteira do ritmelli-server, que tem a chave
      - name: Manifesto
        shell: powershell
        env:
          VERSAO: ${{ steps.congela.outputs.versao }}
          NOTAS: ${{ inputs.notas }}
          NOTAS_EN: ${{ inputs.notas_en }}
        run: |
          $saida = 'instalador\saida'
          $deno = (Get-ChildItem instalador\vendor -Directory -Filter 'deno-*' | Select-Object -First 1).FullName
          $url = "https://github.com/ritmelli/ritmelli-releases/releases/download/v$env:VERSAO/Ritmelli-$env:VERSAO-setup.exe"
          $args_ = @('--setup', "$saida\Ritmelli-$env:VERSAO-setup.exe", '--url', $url, '--app', 'dist\ritmelli',
                     '--bin', 'instalador\ffmpeg\bin', '--bin', $deno, '--saida', $saida)
          # as notas em português e as em inglês, cada uma num arquivo, uma por linha
          foreach ($n in @(@('NOTAS', 'notas', '--notas'), @('NOTAS_EN', 'notas_en', '--notas-en'))) {
            # o campo vazio nem vira variavel no Windows: o GetEnvironmentVariable da nulo, sem o erro que pararia o passo
            $notas = @([Environment]::GetEnvironmentVariable($n[0]) -split '\|' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($notas.Count) {
              $arq = Join-Path $env:RUNNER_TEMP "$($n[1]).txt"
              $notas | Set-Content -Path $arq -Encoding utf8
              $args_ += @($n[2], $arq)
            }
          }
          $parcial = "$saida\Ritmelli-$env:VERSAO-parcial.exe"
          if (Test-Path $parcial) { $args_ += @('--parcial', $parcial, '--parcial-info', "$saida\PARCIAL-$env:VERSAO.json") }
          & "$env:LOCALAPPDATA\ritmelli-build\Scripts\python.exe" instalador\atualizacao\publica.py @args_
          if ($LASTEXITCODE -ne 0) { throw "o publica.py saiu com $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: Ritmelli-${{ steps.congela.outputs.versao }}
          path: instalador/saida/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      # o ritmelli.exe solto, para o VirusTotal da esteira de publicação (no setup ele vai compactado)
      - uses: actions/upload-artifact@v7
        with:
          name: ritmelli-exe-${{ steps.congela.outputs.versao }}
          path: dist/ritmelli/ritmelli.exe
          retention-days: 7
          if-no-files-found: error

  # o setup numa máquina limpa (outra máquina do GitHub: sem Python e sem microfone). Instala em silêncio, como a
  # atualização pelo app, confere o filtro de microfone, abre o Ritmelli, confere a versão que ele responde e desinstala
  testa:
    needs: monta
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Ritmelli-${{ needs.monta.outputs.versao }}
      - name: Instala, abre e desinstala
        shell: powershell
        env:
          VERSAO: ${{ needs.monta.outputs.versao }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-Item "Ritmelli-$env:VERSAO-setup.exe").FullName
          $log = Join-Path $env:RUNNER_TEMP 'instala.log'
          # com prazo, e não com o -Wait: um setup parado numa pergunta (aqui ninguém vê a tela) falha em 10 min com o log
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process $p -Force; Get-Content $log -Tail 40; throw 'o setup não terminou em 10 min' }
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "o setup saiu com $($p.ExitCode)" }
          $app = "$env:ProgramFiles\Ritmelli"
          foreach ($f in 'ritmelli.exe', 'bin\ffmpeg.exe', 'bin\ffprobe.exe', 'bin\deno.exe', 'LICENSE.txt', 'TERCEIROS.txt',
                   '_internal\microfone\voz.dll') {
            if (-not (Test-Path "$app\$f")) { throw "o setup não instalou o $f" }
          }
          # as vozes do pedal de troca de voz (o vozes.json), que o setup baixa do ritmelli-voices antes de instalar
          $vozes = @(Get-ChildItem "$app\vozes" -Recurse -File -Filter *.onnx -ErrorAction SilentlyContinue)
          if ($vozes.Count -lt 3) { Select-String $log -Pattern 'vozes' | Out-String | Write-Host; throw "o setup baixou $($vozes.Count) modelos de voz" }
          "o setup baixou $($vozes.Count) modelos de voz"
          netsh advfirewall firewall show rule name=Ritmelli | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'o setup não criou a regra do firewall' }
          # o filtro de microfone (microfone\microfone.py), pelo "--microfone instala-todos --tarefa" do setup: a micfx.dll
          # na pasta que o audiodg.exe lê e a tarefa \Ritmelli\Microfone, que põe o filtro no microfone que aparece depois.
          # O setup termina bem mesmo se esse passo falhar, e a tarefa nasce antes da cópia da DLL: as duas se conferem.
          # Sem microfone aqui, o filtro posto num microfone fica de fora
          $mic = "$env:ProgramFiles\Ritmelli\microfone"
          function FalhaMic($m) { Select-String $log -Pattern 'Parameters: --microfone' -Context 0, 1 | Out-String | Write-Host; throw $m }
          if (-not (Test-Path "$mic\micfx.dll")) { FalhaMic "o setup não pôs a micfx.dll em $mic" }
          $t = Get-ScheduledTask -TaskPath '\Ritmelli\' -TaskName 'Microfone' -ErrorAction SilentlyContinue
          if (-not $t) { FalhaMic 'o setup não criou a tarefa \Ritmelli\Microfone' }
          # pelo SID: o nome da conta muda com a língua do Windows (SISTEMA no português)
          $conta = try { ([Security.Principal.NTAccount]$t.Principal.UserId).Translate([Security.Principal.SecurityIdentifier]).Value } catch { '' }
          if ($conta -ne 'S-1-5-18') { throw "a tarefa \Ritmelli\Microfone roda como '$($t.Principal.UserId)', e não como SYSTEM" }
          $acao = $t.Actions | Select-Object -First 1
          if ($acao.Execute -ne "$app\ritmelli.exe" -or $acao.Arguments -ne '--microfone instala-todos') {
            throw "a tarefa \Ritmelli\Microfone roda $($acao.Execute) $($acao.Arguments)"
          }
          'a micfx.dll está na pasta do filtro, e a tarefa \Ritmelli\Microfone roda como SYSTEM'
          $vit = Start-Process "$app\ritmelli.exe" -ArgumentList '--no-browser' -PassThru
          $estado = $null
          for ($i = 0; $i -lt 90 -and -not $vit.HasExited -and -not $estado; $i++) {
            try { $estado = Invoke-RestMethod 'http://127.0.0.1:8799/api/state' -TimeoutSec 2 } catch { Start-Sleep 1 }
          }
          $logs = "$env:LOCALAPPDATA\Ritmelli\logs"
          if (-not $estado) {
            Get-Content "$logs\server.log", "$logs\server.err" -ErrorAction SilentlyContinue
            throw 'o Ritmelli não respondeu em 90 s'
          }
          "Ritmelli $($estado.versao) respondeu: status=$($estado.status) erro=$($estado.error)"
          # o voz.dll (o efeito de voz que sai pelo app) carregou: sem ele o motor sobe e diz no log
          if (Select-String -Path "$logs\server.err", "$logs\server.log" -Pattern 'sem o voz.dll' -Quiet -ErrorAction SilentlyContinue) {
            throw 'o Ritmelli instalado não carregou o voz.dll'
          }
          if ($estado.versao -ne $env:VERSAO) { throw "o Ritmelli respondeu a versão $($estado.versao), e não a $env:VERSAO" }
          # a máquina do GitHub não tem placa de vídeo: o pedal de troca de voz fica de fora (o Alienígena fica) e o log diz por quê
          if (-not (Select-String -Path "$logs\server.err", "$logs\server.log" -Pattern 'pedal_voz: no graphics card' -Quiet -ErrorAction SilentlyContinue)) {
            Get-Content "$logs\server.err" -Tail 20 -ErrorAction SilentlyContinue
            throw 'sem placa de vídeo, o Ritmelli não disse no log que deixou o pedal de troca de voz de fora'
          }
          'sem placa de vídeo, o pedal de troca de voz ficou de fora'
          # os dados de uso (metricas.py): o setup em silêncio, sem /metricas, não escolhe por ninguém, e o Ritmelli
          # espera a pessoa decidir no aviso, sem enviar nada (é isso que deixa a esteira fora das métricas)
          if (Get-ItemProperty 'HKLM:\SOFTWARE\Ritmelli' -Name Metricas -ErrorAction SilentlyContinue) {
            throw 'o setup em silêncio gravou a escolha dos dados de uso sem ninguém escolher'
          }
          $met = Invoke-RestMethod 'http://127.0.0.1:8799/api/metricas' -TimeoutSec 5
          if ($met.situacao -ne 'decidir') { throw "os dados de uso sem escolha estão $($met.situacao), e não decidir" }
          'os dados de uso esperam a escolha de quem usa'
          # a janela própria (janela.py): o --no-browser de cima não abre nenhuma; desligado pela API, o Ritmelli abre de
          # novo como pelo atalho, tem de mostrar a janela "Ritmelli", a segunda abertura só traz ela para a frente, e
          # fechar a janela (o X) desliga o servidor
          Invoke-RestMethod 'http://127.0.0.1:8799/api/shutdown' -Method Post -ContentType 'application/json' -Body '{}' | Out-Null
          if (-not $vit.WaitForExit(30000)) { throw 'o Ritmelli não saiu em 30 s depois do Desligar' }
          $vit = Start-Process "$app\ritmelli.exe" -PassThru
          $janela = $false
          for ($i = 0; $i -lt 90 -and -not $vit.HasExited -and -not $janela; $i++) {
            Start-Sleep 1
            $vit.Refresh()
            $janela = $vit.MainWindowTitle -eq 'Ritmelli'
          }
          if (-not $janela) {
            Get-Content "$logs\server.log", "$logs\server.err" -ErrorAction SilentlyContinue
            throw 'o Ritmelli não abriu a janela em 90 s'
          }
          for ($i = 0; $i -lt 30 -and -not $estado2; $i++) {
            try { $estado2 = Invoke-RestMethod 'http://127.0.0.1:8799/api/state' -TimeoutSec 2 } catch { Start-Sleep 1 }
          }
          if (-not $estado2) { throw 'o Ritmelli com a janela não respondeu' }
          $seg = Start-Process "$app\ritmelli.exe" -PassThru
          if (-not $seg.WaitForExit(20000)) { throw 'a segunda abertura não saiu em 20 s (devia só trazer a janela)' }
          if ($vit.HasExited) { throw 'a segunda abertura derrubou a primeira' }
          $vit.CloseMainWindow() | Out-Null
          if (-not $vit.WaitForExit(30000)) { throw 'fechar a janela não desligou o Ritmelli em 30 s' }
          $fora = $true
          try { Invoke-RestMethod 'http://127.0.0.1:8799/api/state' -TimeoutSec 2 | Out-Null; $fora = $false } catch { }
          if (-not $fora) { throw 'a janela fechou e o servidor seguiu respondendo' }
          'a janela abriu, a segunda abertura só trouxe ela para a frente e o X desligou tudo'
          # o /metricas=0 do setup em silêncio grava a escolha (a mesma da caixa da página), e o desinstalador apaga
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/metricas=0', "/LOG=$log" -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process $p -Force; Get-Content $log -Tail 40; throw 'o setup com /metricas=0 não terminou em 10 min' }
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "o setup com /metricas=0 saiu com $($p.ExitCode)" }
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Ritmelli' -Name Metricas -ErrorAction SilentlyContinue).Metricas
          if ($v -ne 0) { throw "o setup com /metricas=0 gravou '$v'" }
          'o /metricas=0 gravou a escolha'
          # o desinstalador fecha o Ritmelli (taskkill) e tira a regra do firewall. Ele se copia para a pasta temporária
          # e roda de lá, então o fim se confere pelo que ele apaga
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 120 -and (Test-Path "$app\ritmelli.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\ritmelli.exe") { throw 'o desinstalador não tirou o ritmelli.exe em 2 min' }
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\vozes"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\vozes") { throw 'o desinstalador deixou as vozes' }
          netsh advfirewall firewall show rule name=Ritmelli | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'o desinstalador deixou a regra do firewall' }
          for ($i = 0; $i -lt 30 -and (Get-ItemProperty 'HKLM:\SOFTWARE\Ritmelli' -Name Metricas -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (Get-ItemProperty 'HKLM:\SOFTWARE\Ritmelli' -Name Metricas -ErrorAction SilentlyContinue) {
            throw 'o desinstalador deixou a escolha dos dados de uso'
          }
          # o "--microfone remove" do desinstalador: sem microfone com o filtro, saem a pasta do filtro (a DLL e o log) e a tarefa
          $tarefaMic = { Get-ScheduledTask -TaskPath '\Ritmelli\' -TaskName 'Microfone' -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 30 -and ((Test-Path $mic) -or (& $tarefaMic)); $i++) { Start-Sleep 1 }
          if (Test-Path $mic) { throw "o desinstalador deixou a pasta $mic" }
          if (& $tarefaMic) { throw 'o desinstalador deixou a tarefa \Ritmelli\Microfone' }
          'o desinstalador tirou a pasta do filtro e a tarefa \Ritmelli\Microfone'
          'instalou, abriu, respondeu e desinstalou'
          # o GitHub sai com o $LASTEXITCODE do fim, e o do netsh sem a regra é 1
          exit 0

  # a atualização automática numa máquina limpa: a tarefa do Windows (SYSTEM) baixa uma versão a mais com o Ritmelli
  # aberto, instala quando ele fecha e o Ritmelli abre de novo sozinho; o desinstalador leva a tarefa
  # (instalador/testa-atualizador.ps1). O Python só assina o manifesto de teste, com uma chave gerada na hora
  testa-atualizador:
    needs: monta
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /instalador/testa-atualizador.ps1
            /instalador/atualizacao/manifesto_de_teste.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: pycryptodomex
        run: python -m pip install pycryptodomex==3.24.2
      - uses: actions/download-artifact@v8
        with:
          name: Ritmelli-${{ needs.monta.outputs.versao }}
          path: saida
      - name: Instala, a tarefa atualiza e o Ritmelli abre de novo
        shell: powershell
        env:
          VERSAO: ${{ needs.monta.outputs.versao }}
        run: instalador\testa-atualizador.ps1 -Setup "saida\Ritmelli-$env:VERSAO-setup.exe" -Manifesto saida\manifest.json

  # a atualização parcial, como no PC de quem tem a última versão publicada: sem o Ritmelli instalado, ela recusa; por cima do
  # setup completo daquela versão, a pasta do app tem de ficar igual à do manifesto novo, arquivo por arquivo, a
  # Ritmelli tem de abrir na versão nova e o desinstalador tem de levar tudo (instalador/testa-parcial.ps1). Sem a
  # parcial (nenhuma versão publicada, ou nada mudou), não roda
  testa-parcial:
    if: needs.monta.outputs.parcial == 'true'
    needs: monta
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: /instalador/testa-parcial.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: Ritmelli-${{ needs.monta.outputs.versao }}
          path: saida
      - name: Instala a anterior, aplica a parcial e confere
        shell: powershell
        env:
          VERSAO: ${{ needs.monta.outputs.versao }}
        run: instalador\testa-parcial.ps1 -Manifesto saida\manifest.json -Parcial "saida\Ritmelli-$env:VERSAO-parcial.exe"

  # o setup novo por cima da última versão publicada, como no PC de quem recebe a atualização: os dados de quem usa, a
  # escolha dos dados de uso e o original de cada microfone têm de vir junto. Por cima de uma versão de antes da troca
  # de nome (#58), confere também a pasta nova, as tarefas, o registro, os atalhos e o firewall
  # (instalador/testa-migracao.ps1). Sem nenhuma versão publicada, não roda
  testa-migracao:
    if: needs.monta.outputs.anterior == 'true'
    needs: monta
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: /instalador/testa-migracao.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: Ritmelli-${{ needs.monta.outputs.versao }}
          path: saida
      - name: Instala a publicada, o setup novo por cima e confere
        shell: powershell
        env:
          VERSAO: ${{ needs.monta.outputs.versao }}
        run: instalador\testa-migracao.ps1 -Setup "saida\Ritmelli-$env:VERSAO-setup.exe" -Versao $env:VERSAO

name: Flake experiment

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  ganho-spread:
    name: testa_ganho spread
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      - name: 50 runs of the mixer cost test
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ganho" | Out-Null
          $fails = 0
          for ($i = 1; $i -le 50; $i++) {
            $env:GANHO_DUMP = "$env:RUNNER_TEMP\ganho\run-$i.json"
            python dev/testa_ganho.py TestaMotor.test_custo_do_misturador 2>&1 | Select-String -Pattern 'media|FAIL|OK|Error' | ForEach-Object { "run $i : $_" }
            if ($LASTEXITCODE -ne 0) { $fails++ }
          }
          "failed runs: $fails of 50"
      - name: Spread
        if: always()
        shell: python
        run: |
          import glob, json, os, statistics as st
          rows = []
          for f in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "ganho", "run-*.json")), key=lambda p: int(p.rsplit("-", 1)[1][:-5])):
              d = json.load(open(f))
              ms = sorted(t * 1000 for t in d["wall"])
              n = len(ms)
              q = lambda p: ms[min(n - 1, int(p * n))]
              rows.append(dict(run=f.rsplit("-", 1)[1][:-5], mean=st.mean(ms), median=st.median(ms), p90=q(.9), p99=q(.99),
                               max=ms[-1], over1=sum(t > 1 for t in ms), cpu=d["cpu"] * 1000 / n, trim=st.mean(ms[: int(n * .9)])))
          print("run   mean  median   p90   p99    max  >1ms  cpu/call  mean90")
          for r in rows:
              print(f"{r['run']:>3} {r['mean']:6.3f} {r['median']:6.3f} {r['p90']:6.3f} {r['p99']:6.3f} {r['max']:6.2f} {r['over1']:5d} {r['cpu']:8.3f} {r['trim']:7.3f}")
          for k in ("mean", "median", "p90", "trim", "cpu"):
              v = [r[k] for r in rows]
              print(f"{k}: min {min(v):.3f} median {st.median(v):.3f} max {max(v):.3f} stdev {st.pstdev(v):.3f} over 0.3: {sum(x >= 0.3 for x in v)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("```\n" + "\n".join(f"{k}: " + ", ".join(f"{r[k]:.3f}" for r in rows) for k in ("mean", "median", "trim", "cpu")) + "\n```\n")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ganho
          path: ${{ runner.temp }}/ganho/

  compara-loop:
    name: compara capture loop ${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      - name: 12 captures
        run: |
          $fails = 0
          for ($i = 1; $i -le 12; $i++) {
            $dir = "$env:RUNNER_TEMP\compara\run-$i"
            $t0 = Get-Date
            python dev/compara.py --ref --pasta $dir > "$dir.log" 2>&1
            $code = $LASTEXITCODE
            $s = [int]((Get-Date) - $t0).TotalSeconds
            "capture $i : exit $code in $s s"
            if ($code -ne 0) { $fails++; Get-Content "$dir.log" | Select-Object -Last 40 } else { Remove-Item -Recurse -Force $dir }
          }
          "failed captures: $fails of 12"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compara-${{ matrix.shard }}
          path: ${{ runner.temp }}/compara/
          if-no-files-found: ignore

  metricas-loop:
    name: usage notice loop ${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      - name: 8 runs of the fitcheck --metricas
        run: |
          $fails = 0
          for ($i = 1; $i -le 8; $i++) {
            $t0 = Get-Date
            $out = python dev/fitcheck.py --metricas 2>&1
            $code = $LASTEXITCODE
            $s = [int]((Get-Date) - $t0).TotalSeconds
            "run $i : exit $code in $s s"
            if ($code -ne 0) { $fails++; $out | Select-String -Pattern '^(FALHA|  )' }
          }
          "failed runs: $fails of 8"

name: Flake experiment

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  mock-stop:
    name: mock stop, fix and mutants
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/instalador/ffmpeg/bin" -Encoding utf8
      - name: The fix, 5 runs, each must pass every check
        if: always()
        run: |
          $bad = 0
          for ($i = 1; $i -le 5; $i++) {
            $out = python dev/test_mock_stop.py 2>&1 | Out-String
            $out
            if ($LASTEXITCODE -ne 0 -or $out -notmatch 'all passed') { $bad++ }
          }
          "fix: $bad of 5 runs did not pass"
          exit $bad
      - name: Mutant without the measurement stop, 3 runs, each must fail only on the held track
        if: always()
        run: |
          (Get-Content -Raw server.py).Replace("        sonoridade.stop_measurements()`r`n", "").Replace("        sonoridade.stop_measurements()`n", "") | Set-Content -NoNewline -Encoding utf8 server.py
          if (Select-String -Path server.py -Pattern 'sonoridade.stop_measurements' -Quiet) { throw 'the mutant did not apply' }
          $bad = 0
          for ($i = 1; $i -le 3; $i++) {
            $out = python dev/test_mock_stop.py 2>&1 | Out-String
            $out
            $ok = $out -match 'ok    phone: the shelf loudness measurement opened the track' -and $out -match 'ok    phone: the server stops by itself' -and $out -match 'FAIL  phone: the moment the stop returns, nothing holds the track'
            if (-not $ok) { $bad++ }
          }
          git checkout -- server.py
          "mutant without stop_measurements: $bad of 3 runs did not fail on the held track"
          exit $bad
      - name: Mutant with the buffered stdin wait, 3 runs, each must fail the HTTP shutdown check
        if: always()
        run: |
          (Get-Content -Raw pastas.py).Replace("while os.read(0, 65536):", "while sys.stdin.buffer.read():") | Set-Content -NoNewline -Encoding utf8 pastas.py
          if (-not (Select-String -Path pastas.py -Pattern 'sys.stdin.buffer.read' -Quiet)) { throw 'the mutant did not apply' }
          $bad = 0
          for ($i = 1; $i -le 3; $i++) {
            $out = python dev/test_mock_stop.py 2>&1 | Out-String
            $out
            if ($out -notmatch 'FAIL  pc: the /api/shutdown with the stdin pipe still open') { $bad++ }
          }
          git checkout -- pastas.py
          "mutant with the buffered wait: $bad of 3 runs did not fail the HTTP shutdown check"
          exit $bad
      - name: The base server, sonoridade, pastas and so_mock, 2 runs
        if: always()
        run: |
          foreach ($f in 'server.py', 'sonoridade.py', 'pastas.py', 'dev/so_mock.py') { git show "origin/main:$f" > $f }
          for ($i = 1; $i -le 2; $i++) { python dev/test_mock_stop.py 2>&1 | Out-String }

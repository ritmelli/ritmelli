name: Flake experiment

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  transporte:
    name: transporte alone, merge and main
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/instalador/ffmpeg/bin" -Encoding utf8
      - name: main alone in a worktree
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/main" origin/main
          git -C "$env:RUNNER_TEMP/main" log --oneline -1
          git log --oneline -1
      - name: transporte scenario, 20 rounds, on the merge
        continue-on-error: true
        run: python dev/experiment_transporte.py . 20
      - name: transporte scenario, 20 rounds, on main alone
        continue-on-error: true
        run: python dev/experiment_transporte.py "$env:RUNNER_TEMP/main" 20
      - name: missing_script, 3 runs, on the merge
        continue-on-error: true
        run: |
          for ($i = 1; $i -le 3; $i++) { python dev/missing_script.py | Select-String -Pattern '^FAIL|transporte'; "merge run $i exit $LASTEXITCODE" }
      - name: missing_script, 3 runs, on main alone
        continue-on-error: true
        working-directory: ${{ runner.temp }}/main
        run: |
          for ($i = 1; $i -le 3; $i++) { python dev/missing_script.py | Select-String -Pattern '^FAIL|transporte'; "main run $i exit $LASTEXITCODE" }

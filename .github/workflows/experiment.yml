name: Flake experiment

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  stop-left:
    name: mock stop, the processes left named, in a loop
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/instalador/ffmpeg/bin" -Encoding utf8
      - name: the phone and PC stop while measuring, 20 rounds each
        continue-on-error: true
        run: python dev/experiment_stop_left.py . 20
      - name: the whole test_mock_stop, 3 runs
        continue-on-error: true
        run: |
          for ($i = 1; $i -le 3; $i++) { python dev/test_mock_stop.py > "$env:RUNNER_TEMP/r.txt" 2>&1; "run $i exit $LASTEXITCODE"; Get-Content "$env:RUNNER_TEMP/r.txt" | Where-Object { $_ -match '^FAIL' } | ForEach-Object { Write-Output $_ } }

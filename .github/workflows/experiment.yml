name: Flake experiment

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  mock-stop:
    name: mock stop, fix and mutants
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/instalador/ffmpeg/bin" -Encoding utf8
      - name: Expectation helper
        shell: python
        run: |
          import os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "expect.py").write_text('''
          import subprocess, sys
          code, summary, fails = int(sys.argv[1]), sys.argv[2], sorted(sys.argv[3:])
          p = subprocess.run([sys.executable, "dev/test_mock_stop.py"], capture_output=True, text=True, encoding="utf-8", errors="replace")
          out = p.stdout + p.stderr
          print(out)
          lines = out.splitlines()
          got = sorted(l[6:].split(":")[0] + ":" + l[6:].split(":")[1][:40] for l in lines if l.startswith("FAIL  "))
          want = sorted(f.split(":")[0] + ":" + f.split(":")[1][:40] for f in fails)
          ok = p.returncode == code and lines and lines[-1] == summary and got == want and "Traceback" not in out
          print(f"expected exit {code}, '{summary}', FAIL {want}; got exit {p.returncode}, '{lines[-1] if lines else ''}', FAIL {got}: {'MATCH' if ok else 'MISMATCH'}")
          sys.exit(0 if ok else 1)
          '''.replace("\n          ", "\n"), encoding="utf-8")
      - name: The fix, 5 runs, each passes every check
        if: always()
        run: |
          $bad = 0
          for ($i = 1; $i -le 5; $i++) { python "$env:RUNNER_TEMP/expect.py" 0 'all passed'; if ($LASTEXITCODE -ne 0) { $bad++ } }
          "fix: $bad of 5 runs did not match"
          exit $bad
      - name: Mutant without the measurement stop, 3 runs, each fails exactly the two stops that leave the ffmpeg running
        if: always()
        run: |
          (Get-Content -Raw server.py).Replace("        sonoridade.stop_measurements(eng.mata)`r`n", "").Replace("        sonoridade.stop_measurements(eng.mata)`n", "") | Set-Content -NoNewline -Encoding utf8 server.py
          if (Select-String -Path server.py -Pattern 'sonoridade.stop_measurements' -Quiet) { throw 'the mutant did not apply' }
          $bad = 0
          for ($i = 1; $i -le 3; $i++) {
            python "$env:RUNNER_TEMP/expect.py" 1 '2 failed' 'phone: the server stops by itself and leaves nothing running' 'pc: the server stops by itself and leaves nothing running'
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          git checkout -- server.py
          "mutant without stop_measurements: $bad of 3 runs did not match"
          exit $bad
      - name: Mutant with the buffered stdin wait, 3 runs, each fails exactly the HTTP shutdown check
        if: always()
        run: |
          (Get-Content -Raw pastas.py).Replace("while os.read(0, 65536):", "while sys.stdin.buffer.read():") | Set-Content -NoNewline -Encoding utf8 pastas.py
          if (-not (Select-String -Path pastas.py -Pattern 'sys.stdin.buffer.read' -Quiet)) { throw 'the mutant did not apply' }
          $bad = 0
          for ($i = 1; $i -le 3; $i++) {
            python "$env:RUNNER_TEMP/expect.py" 1 '1 failed' 'pc: the /api/shutdown with the stdin pipe still open'
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          git checkout -- pastas.py
          "mutant with the buffered wait: $bad of 3 runs did not match"
          exit $bad

  injected-230-loop:
    name: compara with injected failures, in a loop
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg on the PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/instalador/ffmpeg/bin" -Encoding utf8
      - name: 8 rounds of the injected failures, each must give its own diagnosis
        run: |
          $bad = 0
          for ($i = 1; $i -le 8; $i++) {
            $out = python dev/test_compara_not_ready.py 2>&1 | Out-String
            $verdicts = ($out -split "`n" | Where-Object { $_ -match '^(vazio-\S+: the |ok    |FAIL  )' }) -join "`n"
            "round $i : exit $LASTEXITCODE"
            $verdicts
            if ($LASTEXITCODE -ne 0 -or $out -notmatch 'all passed') { $bad++ }
          }
          "injected rounds that did not give the expected diagnoses: $bad of 8"
          exit $bad
      - name: Mutant whose clock starts at Page.navigate, the CDP instrumentation kept; both slow cases must fail
        if: always()
        run: |
          python dev/experiment_clock_mutant.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python dev/experiment_clock_mutant_check.py
          $code = $LASTEXITCODE
          git checkout HEAD -- dev/fitcheck.py
          exit $code
      - name: Mutant that checks the page's origin before the verdict; the run() test must fail
        if: always()
        run: python dev/experiment_run_order_mutant.py

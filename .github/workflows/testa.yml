# Tests each PR on a GitHub Windows machine: the ruff (the pyproject.toml), the tests of the dev/testa_tudo.py and, when
# the PR touches their area, the tests of the microphone filter and the screen (the fitcheck in one job, the compara in
# another). The "Testa o PR" job always runs and only passes with the others: it is the required check of the main.
#
# It also runs on the push to main (the merged tree, which the PR did not test when the main moved after it) and on the
# merge queue (merge_group), when it gets turned on in the repository settings. The push to main also leaves the
# compara capture of the new commit in the cache: it is the reference of the PRs that will have it as their base.
#
# No paths: in the trigger, because a required check that does not run leaves the PR stuck. The path filter lives inside
# each job, by the git diff against the base (the AREAS of the dev/testa_tudo.py), and the job that does not apply
# passes without running.
#
# A PR from outside still needs a maintainer to approve the run (the GitHub default), and its token is read only: the
# summary stays in the run, without the PR comment.
name: Testa

on:
  pull_request:
    # No edited, labeled or unlabeled: a run on the same head, even one whose jobs all skip, is the newest check suite
    # of this workflow on that commit, and the required check is read from the newest suite only, so it hid the
    # "Testa o PR" of the run that tested (the merge queue refused the PR as missing the check). The extracao-tema
    # label and a stacked PR's new base are enforced by the merge_group run, which reads the labels of the PR when it
    # runs and tests the real merge. On the PR, a label takes effect at the next push, a reopen or a full re-run; a new
    # base only at the next push or a reopen (a re-run keeps the merge commit and the base of its old event)
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# one run per PR: a new commit cancels the run of the old one. Every push to main gets a group of its own: each merged
# commit is tested
concurrency:
  group: testa-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  # what the PR, the queue entry or the push is compared to
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  # the ruff, the COMPLETO of the dev/testa_tudo.py (the libraries of the requirements-dev.txt and the ffmpeg of the
  # app), the protected folder on the real disk and the line count of the big files against the base
  testes:
    name: Testes
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
      linhas: ${{ steps.resumo.outputs.linhas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      # the audio-only ffmpeg that goes in the app (the PATH holds for the next steps)
      - name: ffmpeg no PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      # the --output-format github marks each error on its line, in the PR diff
      - name: ruff
        id: ruff
        run: python -m ruff check --output-format github .
      - name: Testes
        id: testes
        if: ${{ !cancelled() && steps.ruff.outcome != 'skipped' }}
        run: python dev/testa_tudo.py --resumo "$env:RUNNER_TEMP\resumo.md"
      # the protected folder on the real disk (the PASSOS of the dev/testa_tudo.py); the in-memory mode is in the STDLIB
      - name: Pasta protegida no disco
        id: disco
        if: ${{ !cancelled() && steps.ruff.outcome != 'skipped' }}
        run: python dev/testa_tudo.py --passo disco
      - name: Linhas
        if: ${{ !cancelled() && env.BASE != '' }}
        continue-on-error: true
        run: python dev/testa_tudo.py --linhas $env:BASE --resumo "$env:RUNNER_TEMP\linhas.md"
      - name: Resumo
        id: resumo
        if: always()
        env:
          RUFF: ${{ steps.ruff.outcome }}
          DISCO: ${{ steps.disco.outcome }}
        run: |
          $l = @("**ruff:** $(if ($env:RUFF -eq 'success') { '✅ limpo' } elseif ($env:RUFF -eq 'failure') { '❌ achou erro (marcado nas linhas do diff)' } else { "não rodou ($env:RUFF)" })", '')
          $l += @("**Pasta protegida no disco** (``testa_pasta_protegida.py --disco``): $(if ($env:DISCO -eq 'success') { '✅' } elseif ($env:DISCO -eq 'failure') { '❌ (ver o passo na execução)' } else { "não rodou ($env:DISCO)" })", '')
          if (Test-Path "$env:RUNNER_TEMP\resumo.md") { $l += Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\resumo.md" }
          $texto = $l -join "`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $texto -Encoding utf8
          $linhas = if (Test-Path "$env:RUNNER_TEMP\linhas.md") { (Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\linhas.md").Trim() } else { '' }
          $fim = "FIM_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "resumo<<$fim`n$texto`n$fim`nlinhas<<$fim`n$linhas`n$fim" -Encoding utf8

  # the filter tests (the MICROFONE of the dev/testa_tudo.py), with the DLLs of the microfone\apo\compila.bat teste and
  # the Inno Setup (the test setup of the silent device, dev/testa_aparelho_mudo.py): only when the PR touches the
  # filter, the engine, the effects or their tests
  microfone:
    name: Filtro do microfone
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # the area filter needs only the standard library: the libraries come after it, when the area applies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - name: O PR mexe no filtro?
        id: areas
        run: python dev/testa_tudo.py --areas $env:BASE
      - uses: ./.github/actions/python
        if: steps.areas.outputs.microfone == 'true'
        with:
          requirements: requirements.txt
      - name: Compila as DLLs de teste
        if: steps.areas.outputs.microfone == 'true'
        shell: cmd
        run: microfone\apo\compila.bat teste
      # o mesmo da monta.yml, na pasta do usuário: o dev/testa_aparelho_mudo.py monta e roda em silêncio um setup que
      # não instala nada, com o instalador/mudos.iss (sem o ISCC, no GitHub, ele reprova em vez de pular)
      - name: Inno Setup 6.7.3
        if: steps.areas.outputs.microfone == 'true'
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe -UseBasicParsing
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($h -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "o Inno Setup veio com hash $h" }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o instalador do Inno Setup saiu com $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'o ISCC.exe nao ficou na pasta do usuario' }
      - name: Testes do filtro
        if: steps.areas.outputs.microfone == 'true'
        run: python dev/testa_tudo.py --microfone --resumo "$env:RUNNER_TEMP\resumo.md"
      - name: Resumo
        id: resumo
        if: always()
        env:
          APLICA: ${{ steps.areas.outputs.microfone }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\resumo.md") { $texto = Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\resumo.md" }
          elseif ($env:APLICA -eq 'false') { $texto = '**Testes do filtro:** não se aplicam (o PR não mexe no filtro)' }
          else { $texto = '**Testes do filtro:** ❌ não chegaram a rodar (ver a execução)' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $texto -Encoding utf8
          $fim = "FIM_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "resumo<<$fim`n$texto`n$fim" -Encoding utf8

  # the screen, part 1 (the --tela of the dev/testa_tudo.py, without --base): the fitcheck in both languages against a
  # --mock with temporary data, and the usage data notice of the theme (the fitcheck --metricas: one --mock
  # --metricas-teste per situation and per button, with the network caught in a trap; it checks when the notice opens,
  # what each button saves and that nothing leaves through the network). Only when the PR touches the theme, what the
  # server injects in it or the tools, and on every PR with the extracao-tema label
  tela:
    name: Tela
    runs-on: windows-2025
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 25
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      # the labels as they are now, not as the event saw them (a re-run, after a label changed, gets the new ones); a
      # merge_group entry carries no PR: it is the one in its ref (pr-<number>-<sha>)
      - name: O PR mexe na tela?
        id: areas
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # the testa_tudo reads the list from the variable: in an argument, PowerShell would mangle the JSON quotes
        run: |
          $n = if ($env:GITHUB_EVENT_NAME -eq 'merge_group') { [regex]::Match($env:GITHUB_REF, '/pr-(\d+)-').Groups[1].Value } else { $env:PR }
          if ($n -or $env:GITHUB_EVENT_NAME -eq 'merge_group') {
            $env:ETIQUETAS = gh pr view $n -R $env:GITHUB_REPOSITORY --json labels --jq '[.labels[].name]'
            if ($LASTEXITCODE -ne 0 -or -not $n) { "::error::the labels of the PR of $env:GITHUB_REF did not come"; exit 1 }
          }
          python dev/testa_tudo.py --areas $env:BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extracao = if ($env:ETIQUETAS -match '"extracao-tema"') { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "extracao=$extracao" -Encoding utf8
      - uses: ./.github/actions/python
        if: steps.areas.outputs.tela == 'true'
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg no PATH
        if: steps.areas.outputs.tela == 'true'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      - name: fitcheck
        id: tela
        if: steps.areas.outputs.tela == 'true'
        run: python dev/testa_tudo.py --tela --pasta "$env:RUNNER_TEMP\tela" --resumo "$env:RUNNER_TEMP\resumo.md"
      # runs even with the fitcheck red, but not without the libraries (its step skipped)
      - name: Aviso dos dados de uso
        id: metricas
        if: ${{ !cancelled() && steps.areas.outputs.tela == 'true' && steps.tela.outcome != 'skipped' }}
        run: python dev/testa_tudo.py --passo metricas
      - name: Logs
        if: always() && steps.tela.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: tela
          path: ${{ runner.temp }}/tela/
          retention-days: 7
          if-no-files-found: ignore
      - name: Resumo
        id: resumo
        if: always()
        env:
          APLICA: ${{ steps.areas.outputs.tela }}
          METRICAS: ${{ steps.metricas.outcome }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\resumo.md") {
            $texto = Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\resumo.md"
            $texto += "`n- $(if ($env:METRICAS -eq 'success') { '✅' } elseif ($env:METRICAS -eq 'failure') { '❌' } else { "não rodou ($env:METRICAS):" }) o aviso dos dados de uso (``fitcheck.py --metricas``)"
          }
          elseif ($env:APLICA -ne 'true' -and $env:APLICA) { $texto = '**Tela:** não se aplica (o PR não mexe na tela e não tem a etiqueta extracao-tema)' }
          else { $texto = '**Tela:** ❌ não chegou a rodar (ver a execução)' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $texto -Encoding utf8
          $fim = "FIM_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "resumo<<$fim`n$texto`n$fim" -Encoding utf8

  # the screen, part 2 (the --compara of the dev/testa_tudo.py): the reference of the base and the comparison of the PR,
  # in the same Chrome. The reference comes from the cache when a run already took it with the same commit, scripts,
  # libraries, Chrome and runner image; if not, from the base in a worktree, and it goes to the cache. A print that
  # changed blocks only with the extracao-tema label; without it, the differences go in the artifact, for review. On the
  # push to main it always runs: the capture of the new commit goes to the cache
  compara:
    name: Compara
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
      mudaram: ${{ steps.compara.outputs.prints_mudaram }}
    permissions:
      contents: read
      pull-requests: read
    env:
      # what the prints are compared to: in a merge_group entry, the tree just before its PR (the first parent of the
      # entry), so the extracao-tema label of that PR blocks only what that PR changed, not what a PR ahead of it in the
      # queue changed. This holds for a queue that merges with a merge commit (how this repo merges) or a squash; with
      # rebase, the first parent would already hold the earlier commits of the same PR
      COMPARA_BASE: ${{ github.event_name == 'merge_group' && format('{0}^1', github.event.merge_group.head_sha) || github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      # (the labels: see the same step of the tela)
      - name: O PR mexe na tela?
        id: areas
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # the testa_tudo reads the list from the variable: in an argument, PowerShell would mangle the JSON quotes
        run: |
          $n = if ($env:GITHUB_EVENT_NAME -eq 'merge_group') { [regex]::Match($env:GITHUB_REF, '/pr-(\d+)-').Groups[1].Value } else { $env:PR }
          if ($n -or $env:GITHUB_EVENT_NAME -eq 'merge_group') {
            $env:ETIQUETAS = gh pr view $n -R $env:GITHUB_REPOSITORY --json labels --jq '[.labels[].name]'
            if ($LASTEXITCODE -ne 0 -or -not $n) { "::error::the labels of the PR of $env:GITHUB_REF did not come"; exit 1 }
          }
          python dev/testa_tudo.py --areas $env:BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extracao = if ($env:ETIQUETAS -match '"extracao-tema"') { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "extracao=$extracao" -Encoding utf8
          $tela = Select-String -Path $env:GITHUB_OUTPUT -Pattern '^tela=true$' -Quiet
          $roda = if ($tela -or $env:GITHUB_EVENT_NAME -eq 'push') { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "roda=$roda" -Encoding utf8
      - uses: ./.github/actions/python
        if: steps.areas.outputs.roda == 'true'
        with:
          requirements: requirements-dev.txt
      - name: ffmpeg no PATH
        if: steps.areas.outputs.roda == 'true'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\instalador\ffmpeg\bin" -Encoding utf8
      # what a capture depends on besides the commit (the same as the CAPTURA of the dev/testa_tudo.py, which checks it
      # again in the folder): the runner image and the Chrome version
      - name: Capture key
        id: chave
        if: steps.areas.outputs.roda == 'true'
        run: |
          $chrome = (Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion
          # the base as a commit sha, the way the push to main saves its capture
          $base = git rev-parse --verify "$env:COMPARA_BASE^{commit}"
          if ($LASTEXITCODE -ne 0) { "::error::the compara base $env:COMPARA_BASE is not a commit here"; exit 1 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "chave=$env:ImageOS-$env:ImageVersion-chrome$chrome`nbase=$base" -Encoding utf8
      - uses: actions/cache/restore@v6
        id: ref
        if: steps.areas.outputs.roda == 'true'
        with:
          path: ${{ runner.temp }}\compara-ref
          key: compara-${{ steps.chave.outputs.base }}-${{ steps.chave.outputs.chave }}-${{ hashFiles('dev/compara.py', 'dev/fitcheck.py', 'dev/so_mock.py', 'requirements.txt', 'requirements-dev.txt') }}
      - name: compara
        id: compara
        if: steps.areas.outputs.roda == 'true'
        env:
          EXTRACAO: ${{ steps.areas.outputs.extracao }}
          BASE_SHA: ${{ steps.chave.outputs.base }}
        run: |
          $mais = @()
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $mais = @('--head-cache', "$env:RUNNER_TEMP\compara-head") }
          python dev/testa_tudo.py --compara --base $env:BASE_SHA --pasta "$env:RUNNER_TEMP\tela" --ref-cache "$env:RUNNER_TEMP\compara-ref" @mais --resumo "$env:RUNNER_TEMP\resumo.md"
          $cod = $LASTEXITCODE
          if ($cod -eq 2) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'mudou=true' -Encoding utf8
            if ($env:EXTRACAO -eq 'true') { '::error::the compara prints changed, and the PR has the extracao-tema label'; exit 1 }
            '::warning::the compara prints changed: the differences are in the compara artifact, for review'
            exit 0
          }
          exit $cod
      - uses: actions/cache/save@v6
        if: always() && steps.compara.outputs.ref_cache == 'true'
        with:
          path: ${{ runner.temp }}\compara-ref
          key: ${{ steps.ref.outputs.cache-primary-key }}
      # the path is part of the cache version: the PRs restore into compara-ref, so the HEAD capture is saved from there
      - name: HEAD capture as a reference
        if: always() && steps.compara.outputs.head_cache == 'true'
        run: |
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\compara-ref" -ErrorAction SilentlyContinue
          Move-Item "$env:RUNNER_TEMP\compara-head" "$env:RUNNER_TEMP\compara-ref"
      - uses: actions/cache/save@v6
        if: always() && steps.compara.outputs.head_cache == 'true'
        with:
          path: ${{ runner.temp }}\compara-ref
          key: compara-${{ github.sha }}-${{ steps.chave.outputs.chave }}-${{ hashFiles('dev/compara.py', 'dev/fitcheck.py', 'dev/so_mock.py', 'requirements.txt', 'requirements-dev.txt') }}
      - name: Prints
        if: always() && (steps.compara.outcome == 'failure' || steps.compara.outputs.mudou == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: compara
          path: ${{ runner.temp }}/tela/
          retention-days: 7
          if-no-files-found: ignore
      - name: Resumo
        id: resumo
        if: always()
        env:
          APLICA: ${{ steps.areas.outputs.roda }}
          MUDOU: ${{ steps.compara.outputs.mudou }}
          EXTRACAO: ${{ steps.areas.outputs.extracao }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\resumo.md") {
            $texto = Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\resumo.md"
            if ($env:MUDOU -eq 'true') { $texto += "`n" + $(if ($env:EXTRACAO -eq 'true') { '❌ com a etiqueta extracao-tema, print que mudou bloqueia' } else { '⚠️ sem a etiqueta extracao-tema, print que mudou não bloqueia: as diferenças estão no artefato `compara`' }) }
          }
          elseif ($env:APLICA -ne 'true' -and $env:APLICA) { $texto = '**Compara:** não se aplica (o PR não mexe na tela e não tem a etiqueta extracao-tema)' }
          else { $texto = '**Compara:** ❌ não chegou a rodar (ver a execução)' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $texto -Encoding utf8
          $fim = "FIM_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "resumo<<$fim`n$texto`n$fim" -Encoding utf8

  # the required check: always runs, joins the summaries and only passes with the other four (the one that does not
  # apply passes without running)
  testa-o-pr:
    name: Testa o PR
    # always(), not !cancelled(): a skipped job counts as green in the required check, and the cancelled run would pass
    if: ${{ always() }}
    needs: [testes, microfone, tela, compara]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Resumo e resultado
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DO_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          S_TESTES: ${{ needs.testes.result }}
          S_MICROFONE: ${{ needs.microfone.result }}
          S_TELA: ${{ needs.tela.result }}
          S_COMPARA: ${{ needs.compara.result }}
          R_TESTES: ${{ needs.testes.outputs.resumo }}
          R_MICROFONE: ${{ needs.microfone.outputs.resumo }}
          R_TELA: ${{ needs.tela.outputs.resumo }}
          R_COMPARA: ${{ needs.compara.outputs.resumo }}
          LINHAS: ${{ needs.testes.outputs.linhas }}
          MUDARAM: ${{ needs.compara.outputs.mudaram }}
        run: |
          estados=("$S_TESTES" "$S_MICROFONE" "$S_TELA" "$S_COMPARA")
          # a cancelled run proved nothing either way: it fails, and leaves the PR comment as the last run that ended wrote it
          for s in "${estados[@]}"; do
            if [ "$s" = cancelled ]; then
              echo "## ⏹️ Testa: execução cancelada (o comentário do PR fica como estava)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          marca() { if [ "$1" = success ]; then echo "✅"; else echo "❌ ($1)"; fi; }
          ok=true
          for s in "${estados[@]}"; do [ "$s" = success ] || ok=false; done
          if $ok; then
            manchete="✅ Testa: tudo passou"
            n=${MUDARAM:-0}
            if [ "$n" -gt 0 ]; then
              manchete="✅ Testa: passou · ⚠️ $n $([ "$n" -eq 1 ] && echo "print mudou" || echo "prints mudaram")"
            fi
            if [ "$ATTEMPT" -gt 1 ]; then manchete="$manchete (na ${ATTEMPT}ª tentativa)"; fi
          else
            manchete="❌ Testa: algo falhou"
          fi
          # how long each job took, against the target of 10 minutes (the jobs that ran; this one is still running)
          tempos=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '[.jobs[]
            | select(.conclusion != null and .conclusion != "skipped" and .started_at != null and .completed_at != null)
            | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $d
            | "\(.name) \($d / 60 | floor) min \($d % 60) s\(if $d > 600 then " ⚠️" else "" end)"] | join(" · ")' \
            || echo "")
          {
            echo "## $manchete"
            echo
            echo "| Testes | Filtro do microfone | Tela | Compara |"
            echo "| --- | --- | --- | --- |"
            echo "| $(marca "$S_TESTES") | $(marca "$S_MICROFONE") | $(marca "$S_TELA") | $(marca "$S_COMPARA") |"
            echo
            printf '%s\n\n' "$R_TESTES" "$R_MICROFONE" "$R_TELA" "$R_COMPARA"
            if [ -n "$tempos" ]; then echo "**Tempo de cada job** (alvo: 10 min): $tempos"; echo; fi
            if [ -n "$LINHAS" ]; then echo "$LINHAS"; echo; fi
            echo "[A execução]($EXECUCAO), no commit \`${HEAD:0:12}\`."
          } > resumo.md
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"
          # one comment per PR, updated on every run. On a fork PR the token is read only; outside a PR there is none
          if [ "$DO_REPO" = true ]; then
            gh pr comment "$PR" -R "$REPO" --body-file resumo.md --edit-last --create-if-none \
              || echo "::warning::the summary comment on the PR did not go out"
          fi
          $ok
      # cancelled before or while this job ran: nothing was published, and the check fails (a job whose steps all
      # skipped would pass)
      - name: Cancelada
        if: ${{ cancelled() }}
        run: |
          echo "## ⏹️ Testa: execução cancelada (o comentário do PR fica como estava)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

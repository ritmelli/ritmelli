# Dados de uso e erros (metricas.py, so no PC): a linha no Microfone e fone e o aviso de quem ainda nao escolheu
metrics.label=Dados de uso e erros
metrics.on=O Ritmelli envia dados anônimos de uso e relatórios de erro.
metrics.off=O Ritmelli não envia dados de uso nem relatórios de erro.
metrics.turnOff=Parar de enviar
metrics.turnOn=Começar a enviar
metrics.policy=Política de privacidade
metrics.text=Para saber o que melhorar, o Ritmelli pode enviar dados anônimos de uso (quantas pessoas o usam, a versão instalada, por quanto tempo a música toca e cada efeito de voz fica ativo), a saúde do som que vai para o jogo (quantas vezes ele falhou e quantas dessas foram numa passagem entre músicas ou num ajuste de andamento, a menor folga e a maior demora do envio, quantas passagens e quantos ajustes de andamento houve e quanto tempo os ajustes levaram, quantas vezes e por quanto tempo o microfone deixou de receber a música, por quanto tempo o efeito de voz rodou no filtro do microfone e a voz veio do microfone de reserva, e a taxa do microfone) e relatórios de erro. O seu nome, a sua conta, as músicas, as buscas e a sua voz nunca são enviados. É possível alterar esta escolha depois em <b>Microfone e fone</b>.
metrics.send=Enviar
metrics.dontSend=Não enviar
metrics.saveFailed=Não foi possível salvar a escolha. {reason}

# Mensagens do servidor: as chaves que o server.py, o engine.py e o atualizacao.py mandam (o formato no API.md); o dev/testa_i18n.py confere que estao todas aqui
server.library.missing=Este disco não está mais na prateleira.
server.library.badTitle=O nome novo tem um caractere que o Ritmelli não consegue gravar. Digite de novo.
server.queue.gone=Este disco já saiu da fila.
server.queue.empty=A fila está vazia: não há próximo disco.
server.queue.noPrevious=Nenhum disco tocou antes deste.
server.queue.playFailed=Não foi possível tocar "{title}" da fila ({reason}).
server.queue.tooLong=O Ritmelli não põe na fila um vídeo de mais de um dia.
server.search.empty=Digite o que deseja buscar ou cole um link do YouTube.
server.search.failed=A busca no YouTube falhou ({reason}). Verifique a conexão com a internet e tente novamente.
server.download.failed=O download falhou ({reason}). Verifique o link ou tente outro vídeo.
server.audio.openFailed=Não foi possível iniciar o áudio ({reason}). Verifique se o microfone e o fone estão conectados. Se o problema continuar, feche e abra o Ritmelli.
server.player.streamStopped=O YouTube parou de enviar o áudio de "{title}" em {time}. Toque a música novamente ou aguarde o fim do download para a prateleira.
server.player.readFailedAt=Não foi possível ler o áudio de "{title}" a partir de {time}. O arquivo pode estar corrompido: exclua o disco e baixe-o novamente.
server.player.readFailed=Não foi possível ler o áudio de "{title}". O arquivo pode estar corrompido: exclua o disco e baixe-o novamente.
server.player.streamRefused=O YouTube não liberou o áudio para tocar imediatamente ({reason}). A música toca assim que o download terminar.
server.effect.unknown=Efeito de voz desconhecido: "{id}".
server.effect.failed=O efeito de voz falhou ({reason}). A voz natural foi restaurada.
server.effect.noVozDll=O arquivo voz.dll do Ritmelli não foi encontrado: os efeitos de voz não funcionam neste microfone, mas a sua voz continua normal no jogo. Reinstale o Ritmelli.
server.effect.refused=Não foi possível ativar o efeito de voz ({reason}).
server.mina.notConfigured=Este efeito não está configurado ({reason}).
server.devices.notFound=O dispositivo "{name}" não foi encontrado. Verifique se ele está conectado.
server.devices.openFailed=O Ritmelli não conseguiu abrir este dispositivo ({reason}) e voltou a usar o anterior. Verifique se o dispositivo escolhido está conectado e se algum programa de gravação ou de edição de áudio assumiu o controle exclusivo dele.
server.devices.micVolumeMissing=Não foi possível encontrar o volume do Windows para o microfone "{name}".
server.devices.fallback.mic=O microfone "{chosen}" não foi encontrado; "{used}" será usado até que ele seja reconectado.
server.devices.fallback.monitor=O fone "{chosen}" não foi encontrado; "{used}" será usado até que ele seja reconectado.
server.devices.fallback.monitorNone=O fone "{chosen}" não foi encontrado; nenhum fone será usado até que ele seja reconectado.
server.devices.fallback.both=O microfone "{mic}" e o fone "{monitor}" não foram encontrados; "{micUsed}" e "{monitorUsed}" serão usados até que eles sejam reconectados.
server.devices.fallback.bothMonitorNone=O microfone "{mic}" e o fone "{monitor}" não foram encontrados; "{micUsed}" será usado, sem fone, até que eles sejam reconectados.
server.devices.silent=O Windows parou de receber som do dispositivo "{name}". Desconecte o cabo USB dele e conecte novamente.
server.mic.outputFailed=Não foi possível enviar o som para o microfone ({reason}). Se a música não voltar a tocar no microfone, feche e abra o Ritmelli.
server.mic.preparing=Preparando o microfone "{name}" para o Ritmelli: o som do computador é interrompido por alguns segundos.
server.mic.notReadyReinstall=O microfone "{name}" não ficou pronto para o Ritmelli, e a música não chega a ele. Tente reinstalar o Ritmelli.
server.mic.noTask=Falta o componente do Ritmelli que prepara os microfones. Reinstale o Ritmelli.
server.mic.taskFailed=Não foi possível preparar o microfone ({reason}). Feche e abra o Ritmelli para tentar novamente.
server.mic.audioSlow=O áudio do Windows não foi restabelecido a tempo. Feche e abra o Ritmelli para tentar novamente.
server.update.nothingToDownload=Não há nova versão para baixar no momento.
server.update.notDownloaded=A nova versão ainda não foi baixada.
server.update.changed=O instalador baixado foi alterado depois da verificação. Baixe-o novamente.
server.update.permissionDenied=A atualização foi adiada porque a permissão do Windows não foi concedida. Para instalá-la, clique novamente em Instalar agora e escolha Sim quando o Windows pedir permissão.
server.update.installerFailed=Não foi possível abrir o instalador (erro {code}). Clique em Instalar agora para tentar novamente.
server.update.rejected=A nova versão não passou na verificação e não foi instalada ({reason}). A versão atual continua funcionando normalmente.
server.update.checkFailed=Não foi possível verificar se há uma nova versão. Uma nova verificação será feita mais tarde.
server.update.downloadStopped=O download da nova versão foi interrompido. Tente novamente.
server.update.autoFailed=A atualização automática foi interrompida ({reason}). Uma nova tentativa será feita mais tarde.
server.pair.required=Este celular não está conectado ao Ritmelli. No computador, clique em Celular e escaneie o QR code.
server.pair.blocked=Código bloqueado após várias tentativas incorretas. No computador, gere um novo código.
server.pair.invalid=Código inválido ou expirado. Cada código vale por {minutes} minutos e pode ser usado uma única vez. Confira o código exibido no computador.
server.phone.alreadyDisconnected=Este celular já estava desconectado.


/* alvo do tamanho do desenho (22/10): o ::after marca a area, mas o Chrome do celular corrige o toque para o
   botao mais perto dentro da area do dedo (no mock, 9 px ao lado do x ainda tirava da fila). O ponto cru do
   pointerdown, que a correcao nao move, tem que cair dentro do ::after; o clique do teclado e o botao sem ::after
   (no computador) seguem como antes */
let ultimoToque = null;
addEventListener('pointerdown', e => { ultimoToque = e.pointerType === 'touch' ? { x: e.clientX, y: e.clientY } : null; }, true);
function noDesenho(b) {
  const s = getComputedStyle(b, '::after');
  if (!ultimoToque || s.content === 'none') return true;
  const r = b.getBoundingClientRect(), k = PALCO.k, x = r.left + k * parseFloat(s.left), y = r.top + k * parseFloat(s.top);
  return ultimoToque.x >= x && ultimoToque.x <= x + k * parseFloat(s.width) && ultimoToque.y >= y && ultimoToque.y <= y + k * parseFloat(s.height);
}
// so o vermelho da chave pega o toque (nao a linha toda) e alterna, como o teclado
$('#b-parecidas').addEventListener('click', e => {
  if (!S.state || (e.detail && !noDesenho($('#b-parecidas .ch')))) return;
  const v = !S.state.auto;
  $('#b-parecidas').setAttribute('aria-checked', v ? 'true' : 'false');
  ajustar('auto', v);
});
for (const sec of document.querySelectorAll('.fila')) {
  sec.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('abre-fila')) { abrirMaleta(!sec.classList.contains('aberta')); return; }
    if (b.classList.contains('limpar-fila')) {
      api('DELETE', '/api/queue').then(() => avisar(I18N.t('queue.cleared'))).catch(err => avisar(err.message, true));
      return;
    }
    const li = b.closest('.item-fila'); if (!li) return;
    const qid = li.dataset.qid;
    if (b.dataset.role === 'tocar-fila') api('POST', '/api/queue/play', { qid }).catch(err => avisar(err.message, true));
    else if (b.dataset.role === 'tirar' && (!e.detail || noDesenho(b))) api('DELETE', `/api/queue/${encodeURIComponent(qid)}`).catch(err => avisar(err.message, true));
    else if (b.dataset.role === 'salvar') {   // (#53) como o da busca: baixa, ou tira da prateleira o que ja chegou
      const x = (temFila() ? S.state.queue : []).find(q => q.qid === qid);
      if (x) salvarDisco(x);
    }
  });
  // teclado: as setas na alca sobem ou descem a entrada um lugar
  sec.addEventListener('keydown', e => {
    const a = e.target.closest('.alca'), deLado = MESA.montada && sec.classList.contains('fila-parede');
    const antes = e.key === 'ArrowUp' || (deLado && e.key === 'ArrowLeft'), depois = e.key === 'ArrowDown' || (deLado && e.key === 'ArrowRight');
    if (!a || (!antes && !depois)) return;
    e.preventDefault();
    const li = a.closest('.item-fila'), i = [...li.parentElement.children].indexOf(li);
    const to = antes ? i - 1 : i + 1;
    if (to < 0 || to >= li.parentElement.children.length) return;
    moverNaFila(li.dataset.qid, to);
  });
  // arrastar pela alca (dedo ou mouse): a entrada segue o ponteiro e troca de lugar com a vizinha
  // quando passa da metade dela (quem muda de lugar no DOM e a vizinha: mover a entrada soltaria
  // a captura do ponteiro); ao soltar, o servidor recebe a posicao nova
  sec.addEventListener('pointerdown', e => {
    const a = e.target.closest('.alca'); if (!a || e.button > 0 || !noDesenho(a)) return;
    const li = a.closest('.item-fila'), ul = li.parentElement;
    const de = [...ul.children].indexOf(li);
    // na mesa os discos da maleta estao lado a lado: o arrasto anda de lado
    const deLado = MESA.montada && sec.classList.contains('fila-parede'), eixo = ev => deLado ? ev.clientX : ev.clientY;
    const tam = x => deLado ? x.offsetWidth : x.offsetHeight;
    let y0 = eixo(e);
    a.setPointerCapture(e.pointerId);
    S.arrastandoFila = true; li.classList.add('arrastando');
    const mover = ev => {
      let dy = eixo(ev) - y0;
      const ant = li.previousElementSibling, prox = li.nextElementSibling;
      if (ant && dy < -tam(ant) / 2) { li.after(ant); y0 -= tam(ant); dy += tam(ant); }
      else if (prox && dy > tam(prox) / 2) { ul.insertBefore(prox, li); y0 += tam(prox); dy -= tam(prox); }
      numerarFila(sec);
      li.style.transform = deLado ? `translateX(${dy}px)` : `translateY(${dy}px)`;
    };
    const soltar = () => {
      a.removeEventListener('pointermove', mover); a.removeEventListener('pointerup', soltar); a.removeEventListener('pointercancel', soltar);
      li.style.transform = ''; li.classList.remove('arrastando');
      S.arrastandoFila = false;
      const para = [...ul.children].indexOf(li);
      if (para !== de) moverNaFila(li.dataset.qid, para);
      else { S.filaSig = null; desenharFila(); }
    };
    a.addEventListener('pointermove', mover); a.addEventListener('pointerup', soltar); a.addEventListener('pointercancel', soltar);
  });
}

$('#resultados').addEventListener('click', e => {

  const li = b.closest('.resultado'); if (!li || !li._r || li._semClique) return;
  if (b.dataset.role === 'tocar') tocarResultado(li._r);
  else if (b.dataset.role === 'salvar') salvarResultado(li._r);
  else if (b.dataset.role === 'mais') { if (menuBotao === b) fecharMenu(true); else { fecharMenu(false); abrirMenu(b, { tipo: 'resultado', r: li._r }); } }
});
/* puxar a linha para a direita poe na fila, como no Spotify: a faixa ambar
   aparece por baixo, o celular vibra quando passa do ponto e a linha volta sozinha ao soltar. So
   no dedo e so com o servidor novo; o pan-y deixa a pagina rolar na vertical */
(() => {
  const ul = $('#resultados'), PONTO = 88;
  let g = null;
  ul.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || !temFila()) return;
    const li = e.target.closest('.resultado');
    if (!li || !li._r || e.target.closest('[data-role="mais"], [data-role="salvar"]')) return;
    g = { li, id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, passou: false };
  });
  ul.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (!g.ativo) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (dx <= 0 || Math.abs(dy) >= Math.abs(dx)) { g = null; return; }   // rolagem, ou para a esquerda
      g.ativo = true; S.puxandoRes = true;
      g.li.classList.remove('voltando'); g.li.classList.add('puxando');
    }
    const x = dx <= PONTO ? Math.max(0, dx) : PONTO + (dx - PONTO) * .3;
    g.li.querySelector('.corpo').style.transform = `translateX(${x}px)`;
    const passou = dx >= PONTO;
    if (passou !== g.passou) {
      g.passou = passou; g.li.classList.toggle('vai', passou);
      if (passou && navigator.vibrate) navigator.vibrate(12);
    }
  });
  function soltar(e, cancelou) {
    if (!g || e.pointerId !== g.id) return;
    const { li, ativo, passou } = g;
    g = null;
    if (!ativo) return;
    S.puxandoRes = false;
    li._semClique = true; setTimeout(() => { li._semClique = false; }, 400);   // o toque que puxou nao toca a linha
    li.classList.remove('puxando'); li.classList.add('voltando');
    li.querySelector('.corpo').style.transform = '';
    setTimeout(() => li.classList.remove('voltando', 'vai'), 260);
    if (passou && !cancelou) executar('fila', { tipo: 'resultado', r: li._r });
    if (S.buscaPendente) { S.buscaPendente = false; desenharBusca(); }
  }
  ul.addEventListener('pointerup', e => soltar(e, false));
  ul.addEventListener('pointercancel', e => soltar(e, true));
})();

function opcoes(sel, lista, atual, emUso) {

  const tem = v => v != null && [...sel.options].some(o => o.value === v);

function preencherDispositivos(r) {

  $('#dcel-semrede').hidden = !!r.url;
  $('#dcel-par').hidden = !r.url;
  $('#dcel-par').classList.toggle('queimado', r.queimado);
  $('#dcel-url').textContent = r.url || '';
  $('#dcel-cod').textContent = r.codigo ? r.codigo.replace(/^(\d{3})(\d{3})$/, '$1 $2') : '';
  const vale = $('#dcel-vale');
  vale.classList.toggle('erro', r.queimado);
  vale.textContent = r.queimado
    ? I18N.t('phone.blocked')
    : I18N.t('phone.valid', { n: Math.max(1, Math.ceil(r.vale_s / 60)) });
  const chaveQR = r.qr ? r.qr.join('') : '';
  if (chaveQR !== celQR) {
    celQR = chaveQR; $('#dcel-qr').innerHTML = r.qr ? desenharQR(r.qr) : '';
    const svg = $('#dcel-qr svg'); if (svg) svg.setAttribute('aria-label', I18N.t('phone.qrLabel'));   // texto fora do innerHTML
  }
  desenharCelulares(r.celulares || []);
  return true;
}
/* o QR em pixels inteiros da tela (com a escala do Windows tambem): modulo borrado a camera le pior */
function desenharQR(linhas) {
  const n = linhas.length, borda = 4, lado = n + 2 * borda;
  const dpr = devicePixelRatio || 1, px = Math.max(3, Math.floor(220 * dpr / lado)) / dpr;
  let d = '';
  linhas.forEach((l, y) => {
    for (let x = 0; x < n;) {
      if (l[x] !== '1') { x++; continue; }
      let f = x; while (f < n && l[f] === '1') f++;
      d += `M${x + borda} ${y + borda}h${f - x}v1h${x - f}z`;
      x = f;
    }
  });
  return `<svg width="${lado * px}" height="${lado * px}" viewBox="0 0 ${lado} ${lado}" shape-rendering="crispEdges" role="img"><rect width="${lado}" height="${lado}" fill="#F4EFE6"/><path fill="#2A1812" d="${d}"/></svg>`;
}
function quando(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  if (d.toDateString() === new Date().toDateString()) return I18N.t('phone.today', { time: d.toLocaleTimeString(I18N.lang, { hour: '2-digit', minute: '2-digit' }) });
  return I18N.t('phone.onDate', { date: d.toLocaleDateString(I18N.lang, { day: '2-digit', month: '2-digit' }) });
}
function desenharCelulares(lista) {
  const ids = lista.map(c => c.id);
  const novo = celIds && lista.find(c => !celIds.includes(c.id));
  if (novo) { const m = $('#dcel-msg'); m.className = 'msg-dlg'; m.textContent = I18N.t('phone.connectedOk', { name: novo.nome }); }
  celIds = ids;
  const ul = $('#dcel-lista'), v = JSON.stringify(lista);
  if (v === celLista) return;   // a cada 2 s: so redesenha quando muda (o foco num Desconectar nao pula)
  celLista = v;
  ul.replaceChildren();
  if (!lista.length) { ul.append(el('li', 'cel-vazio', I18N.t('phone.noDevices'))); return; }
  for (const c of lista) {
    const li = el('li'), quem = el('span', 'cel-quem');
    quem.append(el('span', 'cel-nome', c.nome), el('span', 'cel-quando', I18N.t('phone.since', { when: quando(c.desde), seen: quando(c.visto) })));
    const b = el('button', 'btn', I18N.t('phone.disconnect')); b.type = 'button'; b.dataset.id = c.id;
    b.setAttribute('aria-label', I18N.t('phone.disconnectLabel', { name: c.nome, when: quando(c.desde) }));
    li.append(quem, b);
    ul.append(li);
  }
}
$('#dcel-lista').addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const msg = $('#dcel-msg');
  b.disabled = true;

/* ---------- versao nova (atualizacao.py): so no PC, que e onde o instalador roda. O aviso vem no estado ao vivo, e o
   dialogo pede as notas; baixado e conferido o setup, o Instalar agora roda o instalador, que fecha o Ritmelli e abre de
   novo. Na atualizacao automatica (a.automatica, atualizador.py), quem baixa e a tarefa do Windows, e a versao entra
   sozinha ao fechar: o Instalar agora so adianta isso ---------- */
function desenharAtualizacao() {
  const a = S.state && S.state.atualizacao, b = $('#b-atualizar');
  b.hidden = !(pode('POST /api/atualizacao/baixar') && a && a.nova);
  if (a && a.nova) b.title = I18N.t('update.titleVersion', { version: a.nova });
  if ($('#dlg-atualizar').open && a) pintarAtualizacao(a);
}
function pintarAtualizacao(a) {
  const ok = $('#da-ok'), barra = $('#da-barra'), msg = $('#da-msg');
  barra.hidden = a.estado !== 'baixando';
  barra.style.setProperty('--p', a.progresso || 0);
  barra.setAttribute('aria-valuenow', Math.round((a.progresso || 0) * 100));
  ok.disabled = ['baixando', 'consultando', 'instalando'].includes(a.estado);
  ok.textContent = a.estado === 'pronta' ? I18N.t('update.install') : a.estado === 'baixando' ? I18N.t('update.downloading', { pct: Math.round((a.progresso || 0) * 100) }) : I18N.t('update.download');
  msg.className = 'msg-dlg' + (a.erro ? ' erro' : '');
  msg.textContent = a.erro ? textoMsg(a.erro) : a.estado === 'pronta' ? I18N.t(a.automatica ? 'update.autoReady' : 'update.windowsAsks') : '';
}
async function abrirAtualizacao() {
  let a;
  try { a = await api('GET', '/api/atualizacao'); } catch (e) { avisar(e.message, true); return; }
  if (!a.nova) { avisar(I18N.t('update.none')); return; }
  $('#da-t').textContent = I18N.t('update.titleVersion', { version: a.nova.versao });
  $('#da-p').textContent = I18N.t('update.info', { current: a.versao, mb: Math.max(1, Math.round(a.nova.tamanho / 1048576)) });
  // as notas na lingua da tela; sem elas, as da outra (a versao pode vir so com as em portugues)
  const ns = a.nova.notas, notas = [ns[I18N.lingua], ns.en, ns.pt_BR].find(x => x && x.length) || [];
  const ul = $('#da-notas');
  ul.replaceChildren(...notas.map(n => el('li', null, n)));
  ul.hidden = !notas.length;
  pintarAtualizacao(a);
  $('#dlg-atualizar').showModal();
}
$('#b-atualizar').addEventListener('click', abrirAtualizacao);
$('#da-ok').addEventListener('click', async () => {
  const a = S.state && S.state.atualizacao, msg = $('#da-msg');
  try {
    if (a && a.estado === 'pronta') {
      await api('POST', '/api/atualizacao/instalar');
      S.atualizando = a.nova;
      $('#dlg-atualizar').close();
      mostrarFora();
    } else {
      await api('POST', '/api/atualizacao/baixar');
    }
  } catch (e) { msg.className = 'msg-dlg erro'; msg.textContent = e.message; }
});
/* o instalador fecha o Ritmelli: no lugar do fora do ar, a tela diz que ele volta sozinho */
function mostrarAtualizando(f) {
  $('#fora-tt').textContent = I18N.t('update.updatingTitle');
  $('#fora-p').textContent = I18N.t('update.updatingText', { version: S.atualizando });

/* ---------- o que esta pagina pode: o caps que o servidor manda (no /api/state, no 401 do pareamento e no comeco do
   SSE), e nao o endereco dela. Ate ele chegar, nenhum controle do PC aparece ---------- */
const pode = rota => !!(S.caps && S.caps.rotas && S.caps.rotas.includes(rota));
function definirCaps(c) {
  const metricasAntes = pode('GET /api/metricas');
  S.caps = c && Array.isArray(c.rotas) ? c : null;
  $('#b-cel').hidden = !pode('GET /api/pareamento');
  desenharAtualizacao();
  if (!pode('GET /api/metricas')) $('#dd-met').hidden = true;
  else if (!metricasAntes && $('#dlg-disp').open) lerMetricas();   // o Microfone e fone aberto antes do caps chegar
}

/* ---------- conexao ---------- */
let es = null, foraT = null, reconT = null;
// o transporte.js que nao carregou (o servidor fora quando a pagina abriu): a conexao tenta carregar de novo, uma
// carga por vez e a cada 3 s, e com ele de volta a pagina segue a carga normal
let buscandoTransporte = false;
function carregarTransporte() {
  if (buscandoTransporte) return;
  buscandoTransporte = true;
  const s = document.createElement('script');
  s.src = 'transporte.js';
  s.onload = () => {
    buscandoTransporte = false;
    // carregou sem definir o TRANSPORTE (o portal do Wi-Fi respondendo com uma pagina, o script cortado): o mesmo
    // prazo do erro, sem laco
    if (typeof TRANSPORTE === 'undefined') { s.remove(); reconT = setTimeout(conectar, 3000); return; }
    carregar();
  };
  s.onerror = () => { buscandoTransporte = false; s.remove(); reconT = setTimeout(conectar, 3000); };
  document.head.append(s);
}
function conectar() {
  clearTimeout(reconT);
  if (typeof TRANSPORTE === 'undefined') { carregarTransporte(); return; }
  if (es) es.fechar();
  try { es = TRANSPORTE.eventos('/api/events'); } catch (e) { reconT = setTimeout(conectar, 3000); return; }
  const fonte = es;
  es.ao('open', () => online(true));
  // o primeiro evento: o que esta conexao pode (o papel nao muda nela; a revogacao a encerra)
  es.ao('caps', c => definirCaps(c));
  es.ao('desconectado', () => {
    // o PC desconectou este celular: a tela do codigo, e o caps de antes de parear vem no 401 do /api/state
    pedirPareamento(true);
    api('GET', '/api/state').catch(() => {});
  });
  es.ao('state', st => {
    online(true); S.state = st;
    desenharFaixa(); desenharReceptor(); desenharFila(); if (S.busca) atualizarResultados();
    desenharAtualizacao();
  });
  es.ao('library', lib => { S.lib = ordenarLib(lib); S.libOk = true; desenharPrateleira(); desenharFila(); if (S.busca) atualizarResultados(); });
  es.ao('jobs', jobs => {
    const antes = new Map(S.jobs.map(j => [j.id, j.status]));
    S.jobs = jobs;
    for (const j of S.jobs) if (j.status === 'error' && antes.get(j.id) === 'running') avisar(I18N.t('download.failed', { label: j.label, reason: motivoDownload(detalheMsg(j.error)) }), true);
    desenharPrateleira(); desenharFila(); if (S.busca) atualizarResultados();
  });
  es.ao('tick', t => {
    S.pos = t.pos; S.levels = t.levels || S.levels;
    S.posEm = performance.now(); S.posEmDe = t.pos;   // quando a posicao chegou: o relogio do visor mede o erro ali
    desenharTempo(); agulhasPixel();
  });
  es.aoFalhar(() => {
    if (S.pareando) return;
    online(false);
    if (!fonte.fechada()) return;
    fonte.fechar();
    // recusada de cara: o servidor fora, ou o 401 do celular desconectado no PC (o fluxo de eventos nao diz o status;
    // o /api/state diz, e o api() ja abre o pedido do codigo)
    api('GET', '/api/state').then(() => true, e => e.status !== 401)
      .then(volta => { if (volta && !S.pareando) reconT = setTimeout(conectar, 3000); });
  });
}
/* o aviso de fora do ar so conta o tempo com a pagina na tela (ao desbloquear o celular o aviso
   aparecia por uns 0,8 s): com o celular bloqueado a conexao cai e o prazo vencia escondido. Escondida, a pagina
   nunca arma o aviso; ao voltar, reconecta na hora (a conexao do tempo bloqueado pode estar morta sem ter avisado,
   e a nova traz o estado) e o prazo comeca dali */
function armarFora() {
  clearTimeout(foraT);
  if (document.hidden || S.pareando) return;
  foraT = setTimeout(() => { if (!S.online && !document.hidden) mostrarFora(); }, S.desligado ? 0 : 2500);
}
// (#107) o celular que muda de rede com o cartao aberto (sai dos dados moveis, liga o Wi-Fi): o texto acompanha
const redeMudou = () => { if (!$('#fora').hidden && !S.online && !S.desligado && !S.atualizando) mostrarFora(); };
addEventListener('online', redeMudou); addEventListener('offline', redeMudou);
if (navigator.connection) navigator.connection.addEventListener('change', redeMudou);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(foraT); return; }
  if (S.desligado || S.pareando) return;
  conectar();
  if (!S.online) armarFora();
});
function online(on) {
  if (on === S.online) return;
  S.online = on; agulhasPixel();
  const lamp = $('#lamp'), cx = $('#conexao');
  if (on) {
    S.jaConectou = true; S.desligado = false;
    if (S.atualizando) { location.reload(); return; }   // a versao nova abriu: a pagina passa a ser a dela
    clearTimeout(foraT); $('#fora').hidden = true;
    if (!S.efeitos && S.erroEfeitos) carregarEfeitos();
    lamp.className = 'lampada acesa'; cx.textContent = I18N.t('app.connected');
  } else {
    lamp.className = 'lampada alerta piscando'; cx.textContent = I18N.t('app.reconnecting');
    armarFora();
  }
  cx.classList.toggle('sr', on);   // conectado, a lampada acesa ja diz: o "ligado" fica so para o leitor de tela
}
function mostrarFora() {
  const f = $('#fora');
  fecharMenu(false);
  if (S.atualizando) { mostrarAtualizando(f); return; }
  if (S.desligado) {
    $('#fora-tt').textContent = I18N.t('offline.offTitle');
    I18N.rico($('#fora-p'), 'offline.offText');
  } else if (!(S.caps ? S.caps.papel === 'pc' : typeof TRANSPORTE === 'undefined' || TRANSPORTE.local)) {
    // (#107) no celular, o que mais cai e o caminho ate o computador (o celular nos dados moveis, sem Wi-Fi, numa rede
    // de convidados), e nao o Ritmelli: o cartao diz so o que se sabe, e o que o navegador conta da conexao (sem
    // nenhuma; nos dados moveis, o Chrome do Android pela Network Information API)
    const c = navigator.connection;
    $('#fora-tt').textContent = I18N.t('offline.phone.title');
    $('#fora-p').textContent = I18N.t(navigator.onLine === false ? 'offline.phone.noConnection'
      : c && c.type === 'cellular' ? 'offline.phone.mobileData' : 'offline.phone.text');
  } else {
    $('#fora-tt').textContent = I18N.t(S.jaConectou ? 'offline.stopped' : 'offline.notResponding');
    I18N.rico($('#fora-p'), 'offline.downText', { folder: '%LOCALAPPDATA%\\Ritmelli\\logs' });
  }
  $('#lamp').className = 'lampada'; $('#conexao').textContent = S.desligado ? I18N.t('app.off') : I18N.t('app.offline');
  $('#conexao').classList.remove('sr');
  f.hidden = false;
}

/* ---------- pareamento (no celular): a API responde 401 ate o celular mandar o codigo que o PC mostra. O QR ja
   traz o codigo no link (?parear=), e ai nada se digita ---------- */
let codigoQR = new URLSearchParams(location.search).get('parear');
if (codigoQR) history.replaceState(null, '', location.pathname + location.hash);  // o codigo usado nao fica no historico
function pedirPareamento(desconectado, caps) {
  definirCaps(caps || null);
  if (S.pareando) return;
  S.pareando = true; S.online = false;
  clearTimeout(reconT); clearTimeout(foraT);
  if (es) { es.fechar(); es = null; }
  fecharMenu(false);
  document.querySelectorAll('dialog[open]').forEach(d => d.close());
  $('#fora').hidden = true;
  $('#pa-desc').hidden = !desconectado;
  $('#pa-msg').textContent = '';
  $('#lamp').className = 'lampada'; $('#conexao').textContent = I18N.t('app.noAccess'); $('#conexao').classList.remove('sr');
  $('#tela-parear').hidden = false;
}
async function parear(codigo) {
  const msg = $('#pa-msg');

  catch (e) { msg.className = 'msg-dlg erro'; msg.textContent = e.message; $('#pa-ok').disabled = false; return; }
  $('#pa-ok').disabled = false;

$('#form-parear').addEventListener('submit', e => {

/* ---------- boas-vindas (so no PC): o passo a passo da primeira vez, quando o GET /api/boas-vindas diz. Fechar de
   qualquer jeito marca como vistas, e elas nao voltam. Abertas, conferem os dispositivos a cada 3 s: o microfone
   conectado com elas na tela acende sozinho ---------- */
let boasT = 0, boasPedidas = false;
async function boasVindasSePrecisar() {
  // pelo caps, como o botao Celular; o servidor tambem so diz que sim para o PC
  if (boasPedidas || !pode('POST /api/boas-vindas')) return;
  boasPedidas = true;
  let r;
  try { r = await api('GET', '/api/boas-vindas'); } catch (e) { return; }

  else metricasSePrecisar();   // com as boas-vindas na tela, o aviso dos dados vem quando elas fecham

async function conferirBoasVindas() {
  clearTimeout(boasT);

    const nome = (escolha, ativo) => escolha === 'default' ? I18N.t('welcome.devices.windowsDefault', { name: ativo }) : ativo;
    $('#db-disp-l').className = `lampada ${act.mic ? 'acesa' : 'alerta'}`;

$('#dlg-boas').addEventListener('close', () => {
  clearTimeout(boasT);
  api('POST', '/api/boas-vindas').catch(() => {});

});
$('#db-trocar').addEventListener('click', abrirDispositivos);
// a troca feita no dialogo de dispositivos aparece no passo na hora, sem esperar a proxima conferencia

/* ---------- eventos da interface ---------- */
$('#estante').addEventListener('click', e => {

$('#b-anterior').addEventListener('click', () => cmd('/api/prev'));
$('#b-proxima').addEventListener('click', () => cmd('/api/next'));
$('#b-aleatorio').addEventListener('click', () => { const v = !(S.state && S.state.shuffle); ligarChave($('#b-aleatorio'), v); ajustar('shuffle', v); });
$('#b-repetir').addEventListener('click', () => { const v = !(S.state && S.state.loop); ligarChave($('#b-repetir'), v); ajustar('loop', v); });
function alternarVoz() { const v = !(S.state && S.state.mic_mute); ligarChave($('#b-cortar'), v); ajustar('mic_mute', v); desenharReceptor(); }
$('#b-cortar').addEventListener('click', alternarVoz);

  const q = $('#q').value.trim();

  if (q.length < BUSCA_MIN) return;
  buscaT = setTimeout(() => { if (!jaBuscando(q)) buscar(q); }, BUSCA_PAUSA_MS);
});
// Buscar (o do teclado ou a lupa): busca na hora, sem repetir a que ja saiu; no toque o campo larga
// o foco, e o teclado do celular fecha e deixa ver os resultados
$('#form-busca').addEventListener('submit', e => {
  e.preventDefault(); clearTimeout(buscaT); abrirDisco(false);
  if (toque()) $('#q').blur();
  const q = $('#q').value.trim();
  if (!q || !jaBuscando(q)) buscar(q);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape' && S.busca) { e.preventDefault(); fecharBusca(); } });
$('#b-voltar').addEventListener('click', () => { fecharBusca(); if (!toque()) $('#q').focus(); });
/* celular: tocar em qualquer lugar fora do campo fecha o teclado, como nos
   apps: o aviso de "na fila" ficava escondido atras dele. A seta e o x de dentro do campo seguem
   com o teclado aberto */
document.addEventListener('pointerdown', e => {
  const q = $('#q');
  if (e.pointerType === 'touch' && document.activeElement === q && !e.target.closest('.campo-q')) q.blur();
}, true);
$('#b-sair-busca').addEventListener('click', () => { fecharBusca(); $('#q').value = ''; });
/* (#113) na mesa a busca cai como uma gaveta por cima da mesa: clicar fora dela e fora do campo fecha, como um menu
   suspenso. O clique que fecha so fecha: o pointerdown para aqui (sem o mousedown, o foco, o arrastar de um volume ou de
   um disco da prateleira), e o click, o menu de contexto e, no toque, os eventos de toque que vem dele sao engolidos. O
   menu "..." de um resultado, o aviso (com o desfazer) e os dialogos nao contam como fora. A pagina do PC e o celular
   ficam como estao: la a busca toma o lugar da prateleira, e no celular o voltar ja fecha */
let foraDaBusca = null, foraDaBuscaAte = 0;   // o ponteiro do clique que fechou, e ate quando o que vem dele e engolido
addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  foraDaBusca = null; foraDaBuscaAte = 0;
  if (e.button !== 0 || !MESA.montada || !S.busca || $('#vista-busca').hidden || dialogoAberto()
      || e.target.closest('#vista-busca, #form-busca, #menu, #aviso')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  foraDaBusca = e.pointerId; foraDaBuscaAte = Infinity;   // antes do fecharBusca: os ouvintes do toque ficam ate ele acabar
  fecharMenu(false); $('#q').blur(); fecharBusca();
}, true);
for (const t of ['pointerup', 'pointercancel'])
  addEventListener(t, e => {
    if (e.pointerId !== foraDaBusca) return;
    foraDaBuscaAte = performance.now() + 500;
    setTimeout(vigiarGavetaDaBusca, 600);
  }, true);
const engolindoForaDaBusca = () => foraDaBusca !== null && performance.now() < foraDaBuscaAte;
// so o que vem do ponteiro: o click do teclado (detail 0) e o do codigo (o .click() das chaves do menu) passam
function engolirForaDaBusca(e) {
  if (!engolindoForaDaBusca() || !e.cancelable || !e.isTrusted || (e.type === 'click' && !e.detail)) return;
  e.preventDefault(); e.stopImmediatePropagation();
}
addEventListener('click', engolirForaDaBusca, true);
addEventListener('contextmenu', engolirForaDaBusca, true);
/* no toque o pointerdown parado nao segura o resto: o volume (o input range) anda pelo touchstart e pelo touchmove, e o
   toque ainda vira click. Estes so existem com a gaveta aberta na mesa (o desenharBusca e o montarMesa chamam), e ate o
   fim do toque que a fechou: sem passive, a rolagem pelo toque espera por eles */
function vigiarGavetaDaBusca() {
  const on = !!(MESA.montada && S.busca) || engolindoForaDaBusca();
  for (const t of ['touchstart', 'touchmove', 'touchend'])
    window[on ? 'addEventListener' : 'removeEventListener'](t, engolirForaDaBusca, { capture: true, passive: false });
}
// limpar: no primeiro toque, com ou sem o cursor no campo; o campo fica pronto para a busca nova
// (os resultados de antes ficam ate ela sair, como enquanto digita)
$('#b-limpar-q').addEventListener('click', () => { clearTimeout(buscaT); const q = $('#q'); q.value = ''; q.focus(); });
$('#b-cel').addEventListener('click', abrirCelular);
$('#b-disp').addEventListener('click', abrirDispositivos);
$('#dica-ouvir').addEventListener('click', e => { if (e.target.closest('.ir-disp')) abrirDispositivos(); });
$('#b-desligar').addEventListener('click', desligar);

function campoDeTexto(t) {
  if (!t || !t.closest) return false;
  if (t.closest('textarea, select, [contenteditable="true"]')) return true;
  const i = t.closest('input');
  return !!i && !['range', 'checkbox', 'radio', 'button', 'submit'].includes(i.type);
}
function dialogoAberto() { return !!document.querySelector('dialog[open]') || !$('#fora').hidden || !$('#tela-parear').hidden; }
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('#menu').hidden) { if (e.key === 'Escape') { e.preventDefault(); fecharMenu(true); } return; }
  if (S.palco && e.key === 'Escape' && !dialogoAberto()) { e.preventDefault(); fecharPalco(); return; }
  if (S.disco && !paginaUnica() && e.key === 'Escape' && !dialogoAberto() && !campoDeTexto(e.target)) { e.preventDefault(); abrirDisco(false); return; }
  // (#114) a busca aberta tambem esta por cima: o Esc fecha ela, como no campo, e a musica segue (antes ele chegava ao
  // fim e parava a musica). O foco que estava nos resultados, que somem, vai para o campo, como no voltar
  if (S.busca && e.key === 'Escape' && !dialogoAberto() && !campoDeTexto(e.target)) {
    e.preventDefault();
    const nosResultados = $('#vista-busca').contains(document.activeElement);
    fecharBusca();
    if (nosResultados && !toque()) $('#q').focus();
    return;
  }
  if (dialogoAberto() || campoDeTexto(e.target)) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) alternar(); }
  else if (/^[1-9]$/.test(e.key)) { const it = S.lib[+e.key - 1]; if (it) { e.preventDefault(); tocar(it.id); } }
  else if (e.key === '0') {
    e.preventDefault();
    if (!e.repeat && S.state && S.state.effect !== SEM_EFEITO) escolherEfeito(SEM_EFEITO);
  }
  else if (e.key === 'Escape') { e.preventDefault(); if (S.state && S.state.track) cmd('/api/stop'); }
});
document.addEventListener('keyup', e => {
  if ((e.code === 'Space' || e.key === ' ') && !dialogoAberto() && !campoDeTexto(e.target) && $('#menu').hidden) e.preventDefault();
});

/* ---------- mesa de DJ: os botoes ---------- */
for (const [de, para] of [['#b-anterior', '#ant-d'], ['#b-tocar', '#tocar-d'], ['#b-proxima', '#prox-d'], ['#b-aleatorio', '#m-aleatorio'], ['#b-repetir', '#m-repetir']]) {
  const c = $(de + ' svg').cloneNode(true); c.removeAttribute('id'); $(para).prepend(c);
}
// a deixa: o Tocar e o Proximo de hoje (a fila anda, o que esta no ar sai na hora); o Proxima dela tira da fila
$('#tocar-d').addEventListener('click', () => { if (MESA.deixa) cmd('/api/next'); });
$('#prox-d').addEventListener('click', () => {
  const x = MESA.deixa;
  if (x) api('DELETE', `/api/queue/${encodeURIComponent(x.qid)}`).catch(err => avisar(err.message, true));
});
$('#m-aleatorio').addEventListener('click', () => { $('#b-aleatorio').click(); ligarChave($('#m-aleatorio'), !!(S.state && S.state.shuffle)); });
$('#m-repetir').addEventListener('click', () => { $('#b-repetir').click(); ligarChave($('#m-repetir'), !!(S.state && S.state.loop)); });
$('#m-parecidas').addEventListener('click', () => { if (!S.state) return; const v = !S.state.auto; ligarChave($('#m-parecidas'), v); ajustar('auto', v); });
$('#pads-grade').addEventListener('click', e => {
  const b = e.target.closest('.pad[data-id]');
  if (b && Date.now() - seguradaEm > 900) tocar(b.dataset.id, { por_cima: true });
});
$('#pads-grade').addEventListener('contextmenu', e => {
  const b = e.target.closest('.pad[data-id]'); if (!b) return;
  e.preventDefault(); seguradaEm = Date.now();
  fecharMenu(false); abrirMenu(b, { tipo: 'disco', id: b.dataset.id });
});
for (const [b, lado] of [[$('#prat-esq'), -1], [$('#prat-dir'), 1]]) b.addEventListener('click', () => {
  const ul = $('#estante'), fim = ul.scrollWidth - ul.clientWidth, comp = reduz.matches ? 'auto' : 'smooth';
  if (lado > 0 ? ul.scrollLeft >= fim - 2 : ul.scrollLeft <= 2) ul.scrollTo({ left: lado > 0 ? 0 : fim, behavior: comp });
  else ul.scrollBy({ left: lado * Math.max(120, ul.clientWidth * .8), behavior: comp });
});
$('#estante').addEventListener('scroll', () => requestAnimationFrame(setasPrateleira), { passive: true });
new ResizeObserver(setasPrateleira).observe($('#estante'));
mqUnica.addEventListener('change', montarMesa);
montarMesa();

/* ---------- inicio ---------- */
montarMostradores();
new ResizeObserver(desenharVUs).observe($('.janela'));
$('#mini-cortar').innerHTML = $('#palco-cortar').innerHTML = IC_MIC;
inertPalco();
FADERS.forEach(([fi]) => pintarFader($(fi)));
carregarEfeitos();
if (location.hash === '#efeitos' && !celular()) abrirGaveta(true);
function carregar() {
  const geracao = geracaoPareamento;
  Promise.all([api('GET', '/api/state'), api('GET', '/api/library'), api('GET', '/api/jobs')])
    .then(([st, lib, jobs]) => {
      // o celular desconectado (ou pareado de novo) enquanto esta carga corria: ela nao vale mais
      if (S.pareando || geracao !== geracaoPareamento) return;
      S.state = st; S.pos = st.pos || 0; S.levels = st.levels || S.levels; S.lib = ordenarLib(lib); S.libOk = true; S.jobs = jobs;
      definirCaps(st.caps);
      online(true); desenharFaixa(); desenharReceptor(); desenharPrateleira(); desenharFila();
      boasVindasSePrecisar();
    })
    .catch(e => {
      if (geracao !== geracaoPareamento) return;   // a carga de antes do pareamento de agora: o erro dela nao vale mais
      if (e.status !== 401) { online(false); return; }
      // o codigo do QR so se usa sem pareamento: ja pareado (ou no proprio PC), ele segue valendo para outro celular
      if (codigoQR) { const c = codigoQR; codigoQR = null; parear(c); }
    })
    .finally(() => { if (!S.pareando && geracao === geracaoPareamento) conectar(); });
}
carregar();
</script>

/* cabos dos pedais em pixel como no mock "Cabos B corrigido",
   de quem ligou com pressa so para fazer funcionar num show: entre vizinhos da
   mesma fileira um cabinho em U de plugue angulado (pancake) nas duas pontas; de uma fileira para a de
   baixo o cabo desce pela margem direita, corre no vao e entra na fileira de baixo pela esquerda, cada
   um de um jeito (o vermelho preso por fita crepe; o preto liso; o preto com a sobra enrolada em oito
   com abracadeira e emendado por um acoplador com a fita "SHOW SEXTA"). A entrada sai de um buraco no
   feltro em cima a esquerda e a saida, num cabo branco com a fita "VOZ", entra num buraco embaixo a
   direita, a caminho do FX-12. Celulas de 1 px de CSS (3 de tela no celular de teste) num canvas por cima
   dos pedais, com contorno de 1 celula e a sombra dura 1 celula para baixo e a direita; as fitas
   escritas sao etiquetas no DOM, na letra dos selos de atraso. Refeito so quando a geometria muda */
const CONTORNO_PIX = [10, 8, 7], SOMBRA_PIX = [12, 6, 3, 115];
const PAL_CABO = {   // brilho (o lado da luz, em cima a esquerda), meio-brilho, corpo, sombra
  preto: [[118, 115, 113], [68, 66, 66], [36, 35, 36], [20, 19, 20]],   // mais escuro que o feltro, com o brilho cinza (o branco gritava, 19/10)
  vermelho: [[246, 122, 106], [226, 66, 58], [196, 36, 32], [128, 16, 14]],
  branco: [[255, 253, 248], [242, 237, 228], [222, 215, 203], [168, 161, 148]],
};
const PAL_PECA = {   // luz, meio, escuro
  preto: [[116, 113, 111], [46, 45, 46], [24, 23, 24]],
  niquel: [[236, 236, 232], [166, 166, 164], [100, 100, 98]],
  vermelho: [[244, 112, 98], [206, 44, 40], [132, 18, 16]],
  branco: [[255, 253, 248], [228, 222, 212], [162, 156, 144]],
  crepe: [[242, 228, 176], [226, 205, 140], [178, 152, 94]],   // a fita crepe amarelada do palco, um rolo mais amarelo que o das etiquetas
  cromo: [[242, 242, 242], [150, 152, 156], [74, 76, 80]],      // o corpo do plugue em L do mock, de mais contraste
  borracha: [[118, 120, 124], [66, 68, 72], [36, 37, 40]],    // o alivio escuro dele
};

// sorteio fixo: a mesma bagunca a cada redesenho e em todo aparelho
const sorteCabo = (i, k) => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };

/* B-spline cubica uniforme pelos pontos de controle, com as pontas triplicadas: a curva sai do primeiro
   ponto na direcao do segundo e chega ao ultimo vinda do penultimo, e a curvatura muda aos poucos (os
   cantos viram arcos largos sem quina, curvas graduais). Amostra cerca
   de 1 ponto por celula */
/* os trechos retos dos pontos de controle (em pe ou deitados, mais de 6 celulas) ganham um ponto a 2 celulas de cada
   ponta: com tres pontos em linha a curva passa reta neles, e o cabo da mesa corre na mesma fileira de celulas de canto
   a canto, sem o degrau do brilho que a curva solta deixava */
function retas(P) {
  const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    const [ax, ay] = P[i - 1], [bx, by] = P[i], L = Math.hypot(bx - ax, by - ay);
    if ((ax === bx || ay === by) && L > 6) {
      const ux = (bx - ax) / L, uy = (by - ay) / L;
      out.push([ax + 2 * ux, ay + 2 * uy], [bx - 2 * ux, by - 2 * uy]);
    }
    out.push(P[i]);
  }
  return out;
}
function curvaB(P) {
  const Q = [P[0], P[0], ...P, P[P.length - 1], P[P.length - 1]], out = [];
  for (let i = 0; i + 3 < Q.length; i++) {
    const [a, b, c, d] = Q.slice(i, i + 4), n = Math.max(3, Math.ceil(Math.hypot(c[0] - b[0], c[1] - b[1])));
    for (let s = i ? 1 : 0; s <= n; s++) {
      const u = s / n, u2 = u * u, u3 = u2 * u, w = [(1 - u) ** 3 / 6, (3 * u3 - 6 * u2 + 4) / 6, (-3 * u3 + 3 * u2 + 3 * u + 1) / 6, u3 / 6];
      out.push([0, 1].map(k => w[0] * a[k] + w[1] * b[k] + w[2] * c[k] + w[3] * d[k]));
    }
  }
  return out;
}

/* a tela de celulas: cada peca e um mapa celula -> cor, pintada por cima das anteriores com o contorno
   de 1 celula em volta (menos por cima das pecas coladas nela: o cabo emenda no alivio do plugue sem
   risco); dono guarda quem pintou cada celula, para a sombra cair so no feltro e nos pedais */
function telaPixel(W, H) {
  const px = new Uint8ClampedArray(W * H * 4), dono = new Int16Array(W * H).fill(-1);
  let ids = 0;
  const cel = (x, y) => x >= 0 && y >= 0 && x < W && y < H ? y * W + x : -1;
  const pinta = (i, c, id) => { px[i * 4] = c[0]; px[i * 4 + 1] = c[1]; px[i * 4 + 2] = c[2]; px[i * 4 + 3] = 255; dono[i] = id; };
  return {
    W, H, cel,
    // retangulo com a luz em cima e a esquerda e o escuro embaixo e a direita; cantos = sem as quinas
    caixa(m, x0, y0, w, h, [luz, meio, esc], cantos = true) {
      for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
        const i = cel(x, y), bx = x === x0 || x === x0 + w - 1, by = y === y0 || y === y0 + h - 1;
        if (i >= 0 && !(cantos && bx && by)) m.set(i, y === y0 || x === x0 ? luz : y === y0 + h - 1 || x === x0 + w - 1 ? esc : meio);
      }
      return m;
    },
    // cabo de 6 celulas (traco na linha entre duas) pela distancia com sinal ao traco (+ do lado da luz); r = a meia
    // grossura (na mesa, em celulas de 2 px, o cabo e de 3: r = 1,5, as faixas na mesma proporcao)
    cabo(pts, [brilho, meio, corpo, sombra], m = new Map(), r = 3) {
      const d = new Map();
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1, L = Math.sqrt(L2);
        let nx = -dy / L, ny = dx / L;
        if (nx + ny > 0) { nx = -nx; ny = -ny; }
        for (let y = Math.floor(Math.min(ay, by) - 4); y <= Math.ceil(Math.max(ay, by) + 4); y++)
          for (let x = Math.floor(Math.min(ax, bx) - 4); x <= Math.ceil(Math.max(ax, bx) + 4); x++) {
            const c = cel(x, y);
            if (c < 0) continue;
            const ox = x + .5 - ax, oy = y + .5 - ay, t = Math.max(0, Math.min(1, (ox * dx + oy * dy) / L2));
            const ex = ox - t * dx, ey = oy - t * dy, s = Math.hypot(ex, ey), o = d.get(c);
            if (s <= r && (o === undefined || s < Math.abs(o))) d.set(c, ex * nx + ey * ny >= 0 ? s : -s);
          }
      }
      const k = 3 / r;
      for (const [c, s] of d) m.set(c, s * k >= 2 ? brilho : s * k >= 1 ? meio : s * k >= -1 ? corpo : sombra);
      return m;
    },
    // m.vazias: as celulas que ficam vazias (o feltro aparece), sem o contorno e sem a sombra (a fresta do U da mesa)
    peca(m, coladas = []) {
      const id = ids++, vaz = m.vazias;
      for (const i of m.keys()) {
        const x = i % W;
        for (const v of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W])
          if (v >= 0 && v < W * H && !m.has(v) && dono[v] !== -2 && !coladas.includes(dono[v]) && !vaz?.has(v)) pinta(v, CONTORNO_PIX, id);
      }
      for (const [i, c] of m) pinta(i, c, id);
      if (vaz) for (const v of vaz) if (dono[v] === -1) dono[v] = -3;
      return id;
    },
    // buraco rasgado no feltro: o miolo escuro, a beira de baixo pegando a luz e a de cima na sombra, e
    // fibras soltas; frente = so a metade do lado (ux, uy), repintada por cima da ponta do cabo que entra
    buraco(hx, hy, i, frente) {
      // na mesa a caixa e de tolex: um ilhos de metal de 1 celula (a luz em cima a esquerda, a sombra embaixo a direita),
      // o miolo escuro com a parede de baixo pegando um pouco de luz, sem fibra solta
      const ilhos = document.body.classList.contains('mesa-dj');
      for (let y = hy - 9; y <= hy + 9; y++) for (let x = hx - 9; x <= hx + 9; x++) {
        const c = cel(x, y), ox = x + .5 - hx, oy = y + .5 - hy;
        if (c < 0 || (frente && ox * frente[0] + oy * frente[1] < .8)) continue;
        if (ilhos) {
          // o passa-cabo maior que o cabo (a boca aparece em volta da ponta): o fundo escuro e o labio de 1 celula, claro
          // embaixo e a direita (a parede de dentro que pega a luz de cima a esquerda) e escuro em cima (r03)
          // (r06) o ilhos de niquel de verdade em volta da boca (o labio escuro de 1 celula lia como a ponta cortada do cabo):
          // contorno escuro, anel de metal com a luz em cima a esquerda, a parede de dentro e o fundo escuro
          const r = Math.hypot(ox, oy), R = 7.4, k = (ox + oy) / (r || 1);
          if (r <= R - 3.4) pinta(c, [12, 10, 8], -2);
          else if (r <= R - 2.2) pinta(c, k > -.2 ? [74, 68, 62] : [26, 22, 20], -2);
          else if (r <= R - 1) pinta(c, k < -.35 ? [118, 115, 113] : k > .35 ? [74, 68, 62] : [96, 92, 88], -2);   // (r07) o niquel no tom do chao (o claro lia como um o branco)
          else if (r <= R) pinta(c, [20, 16, 14], -2);
          continue;
        }
        const a = Math.atan2(oy, ox), r = Math.hypot(ox, oy), R = 4.6 + 1.5 * sorteCabo(i, Math.round((a + Math.PI) * 2.2));
        if (r <= R) pinta(c, r <= R - 1.2 ? [4, 3, 3] : [14, 11, 10], -2);
        else if (r <= R + 1.4) pinta(c, oy > -1 ? [158, 144, 126] : [104, 94, 84], -2);
        else if (r <= R + 2.6 && sorteCabo(i, x * 13 + y * 7) < .3) pinta(c, [132, 120, 106], -2);
      }
    },
    // a sombra dura de tudo, 1 celula para baixo e a direita, so no que ficou vazio
    sombra() {
      for (let i = 0; i < W * H; i++) {
        const k = i + W + 1;
        if (dono[i] >= 0 && i % W < W - 1 && k < W * H && dono[k] === -1) px.set(SOMBRA_PIX, k * 4);
      }
    },
    em(cv) {
      cv.width = W; cv.height = H;
      cv.getContext('2d').putImageData(new ImageData(px, W, H), 0, 0);
    },
  };
}

/* plugue angulado (pancake) do cabinho em U, no vao de 12 px entre vizinhos: borda e a primeira coluna
   fora da caixa do pedal (lado 1, a direita dele) ou a ultima (lado -1), y a linha da tomada; a cabeca
   entra 3 colunas no pedal, como no mock, e o cabo sai para baixo. Devolve a peca e a ponta do alivio
   frisado, de onde sai o cabo */
function plugueAng(T, borda, y, lado, pal) {
  const m = new Map(), x0 = Math.min(borda - lado * 3, borda + lado * 4);
  T.caixa(m, x0, y - 6, 8, 12, pal);
  for (let j = -5; j <= 2; j++) m.set(T.cel(x0 + 1, y + j), pal[0]);   // o brilho do lado da luz
  // (r09) a porca do jack na lateral do pedal, saindo de tras da cabeca (os plugues em L das pontas ja tinham): 2 colunas
  // de niquel por 6 linhas na linha da tomada, a de cima clara
  const xn = lado > 0 ? x0 - 2 : x0 + 8;
  for (let j = -3; j <= 2; j++) for (let c = 0; c < 2; c++) {
    const i = T.cel(xn + c, y + j);
    if (i >= 0) m.set(i, j === -3 ? [242, 242, 242] : c === (lado > 0 ? 1 : 0) ? [150, 152, 156] : [112, 114, 118]);
  }
  for (let j = 1; j <= 3; j++) for (let c = 1; c <= 6; c++) {
    const i = T.cel(x0 + c, y + 5 + j);
    if (i >= 0) m.set(i, j % 2 ? pal[1] : pal[2]);
  }
  m.delete(-1);
  return { m, x: x0 + 4, y: y + 8.5 };
}

/* plugue em L das pontas da corrente, como o do mock:
   da tomada para fora o colar de niquel alto, a luva curta, o braco do cotovelo
   e o corpo em pe com a quina de fora arredondada, o alivio frisado e o pescoco de onde sai o cabo
   (para = -1 sobe, 1 desce). O corpo na cor do plugue (o cromado com o alivio de borracha escura), o
   colar e a luva sempre cromados; a luz vem de cima a esquerda dos dois lados. Devolve a peca e a ponta
   do pescoco */
function plugueL(T, borda, y, lado, para, pal) {
  const m = new Map(), ni = PAL_PECA.cromo, alivio = pal === PAL_PECA.cromo ? PAL_PECA.borracha : pal, col = k => borda + lado * k, f = j => y + para * j;
  const faixa = (k0, k1, j0, j1, cor) => {   // colunas k0..k1 da tomada para fora, linhas j0..j1 (para cima quando para = -1)
    const xa = Math.min(col(k0), col(k1)), xb = Math.max(col(k0), col(k1)), ya = Math.min(f(j0), f(j1)), yb = Math.max(f(j0), f(j1));
    for (let yy = ya; yy <= yb; yy++) for (let x = xa; x <= xb; x++) {
      const i = T.cel(x, yy);
      if (i >= 0) m.set(i, cor(x, yy, xa, xb, ya, yb));
    }
  };
  // cilindro em pe (sombra por coluna) e deitado (sombra por linha)
  const mistura = (c1, c2) => c1.map((v, i) => Math.round((v + c2[i]) / 2));
  const empe = ([luz, meio, esc]) => (x, yy, xa, xb) => {   // a faixa de brilho estreita e o lado de la mais escuro, como o cromado do mock
    const u = (x - xa + .5) / (xb - xa + 1);
    return u < .12 ? meio : u < .34 ? luz : u < .62 ? meio : u < .84 ? mistura(meio, esc) : esc;
  };
  const deitado = ([luz, meio, esc]) => (x, yy, xa, xb, ya, yb) => { const v = (yy - ya + .5) / (yb - ya + 1); return v < .3 ? luz : v < .72 ? meio : esc; };
  faixa(0, 2, -6, 6, x => x === Math.min(col(0), col(2)) ? ni[0] : x === Math.max(col(0), col(2)) ? ni[2] : ni[1]);   // o colar
  faixa(3, 5, -2, 2, deitado(ni));                                     // a luva
  faixa(6, 10, -5, 5, deitado(pal));                                   // o braco do cotovelo
  faixa(11, 20, -5, 17, empe(pal));                                    // o corpo
  // a quina de fora do cotovelo arredondada, e as de cima do corpo quebradas
  for (const [k, j] of [[20, -5], [20, -4], [20, -3], [19, -5], [19, -4], [18, -5], [11, 17], [20, 17]]) m.delete(T.cel(col(k), f(j)));
  const frisos = empe(alivio);
  faixa(12, 19, 18, 25, (x, yy, xa, xb, ya, yb) => (yy - f(18)) * para % 2 ? alivio[2] : frisos(x, yy, xa, xb));   // o alivio frisado
  faixa(13, 18, 26, 28, empe(alivio));                                 // o pescoco
  m.delete(-1);
  return { m, x: Math.max(col(15), col(16)), y: f(27.5) };
}

/* fita crepe atravessada no cabo (no lugar da silver tape do mock: a fita amarela e a
   mais usada na pratica): torta (sobe inclina celulas por coluna para a direita, como no mock),
   pontas rasgadas a mao, fosca (sem o vinco brilhante da silver tape) e o volume do cabo marcado */
function fitaCrepe(T, x, y, i, meia = 10, alt = 10, inclina = 0) {
  const m = new Map(), [luz, meio, esc] = PAL_PECA.crepe;
  for (let c = -meia; c <= meia; c++) for (let j = 0; j < alt; j++) {
    if (Math.abs(c) === meia && sorteCabo(i, c * 7 + j) < .45) continue;
    const k = T.cel(x + c, y + j - Math.round((c + meia) * inclina));
    if (k >= 0) m.set(k, j === 0 ? luz : j === alt - 1 ? esc : c === -4 || c === 3 ? [206, 182, 118] : meio);
  }
  return m;
}

/* fita crepe escrita a caneta, enrolada no cabo e torta como no mock (na
   diagonal, como era no mock, e a fita VOZ enrolada no cabo branco, nao sobre ele):
   a manga da volta no cabo, clara do lado da luz e escura do outro como um cilindro, e as duas pontas coladas
   uma na outra saem para a direita numa bandeirinha com o texto, dobradas na beira da manga. A manga tem a
   beira esquerda na do cabo, com o contorno em cima do dele, e a direita 1 celula alem dele, onde a dobra sai
   (a versao uma celula mais larga, encolhida 1 celula para dentro do
   cabo so na esquerda). No canvas, porque girada no DOM ela borrava o
   pixel: a fita sobe inclina celulas por coluna para a direita, e as letras, no traco fino das outras
   etiquetas, sobem com ela mas ficam em pe (a variante B). cx = a coluna do meio do cabo, cy =
   a linha do meio da fita no cabo */
// as letras da fita VOZ nas duas linguas (o VOX do ingles e a fita de voz do estudio, da largura do VOZ); a letra que
// nao esta aqui fica em branco, e o dev/testa_i18n.py confere as duas linguas
const LETRAS_FITA = {   // 5 x 6 celulas, o traco da caneta
  V: ['X...X', 'X...X', 'X...X', '.X.X.', '.X.X.', '..X..'],
  O: ['.XXX.', 'X...X', 'X...X', 'X...X', 'X...X', '.XXX.'],
  Z: ['XXXXX', '...X.', '..X..', '.X...', 'X....', 'XXXXX'],
  X: ['X...X', '.X.X.', '..X..', '..X..', '.X.X.', 'X...X'],
};
function fitaEscrita(T, cx, cy, i, texto, inclina, lado = 1) {
  const m = new Map(), [luz, meio, esc] = PAL_PECA.crepe, caneta = [38, 24, 18], alt = 10, esq = 3, dir = 4, folga = 3;
  const x0 = cx - esq, dobra = esq + dir, larg = dobra + texto.length * 6 - 1 + 2 * folga;   // a manga: do cabo ate 1 alem dele a direita
  const sobe = c => Math.round((c - esq) * inclina), y0 = cy - alt / 2;
  // lado -1: a bandeirinha sai para a esquerda do cabo (na mesa, a beira da pedaleira cortava a da direita); a coluna c
  // da fita fica em xc(c), espelhada no cabo, e o texto segue lido da esquerda para a direita
  const xc = c => lado > 0 ? x0 + c : cx + esq - c;
  for (let c = 0; c < larg; c++) for (let j = 0; j < alt; j++) {
    // (r18) a ponta em rabo de andorinha: um V so, no meio da altura (os tres dentes de 2 linhas da r05 liam como "VOZ:")
    if ((c === larg - 1 && j >= 3 && j <= 6) || (c === larg - 2 && j >= 4 && j <= 5)) continue;
    const k = T.cel(xc(c), Math.round(y0 + j - sobe(c)));
    if (k < 0) continue;
    // a manga: o cilindro com a luz a esquerda e a dobra escura na beira de saida; a bandeirinha: chapada, a beira
    // de cima clara e a de baixo escura
    m.set(k, c < dobra ? (c < 2 ? luz : c === dobra - 1 ? esc : j === 0 ? luz : meio) : j === 0 ? luz : j === alt - 1 ? esc : meio);
  }
  [...texto].forEach((l, n) => {
    // espelhada, a letra n vai na coluna da fita que fica n letras a direita do fim do texto
    // (r18) o texto 1 px para o lado da dobra: com a ponta em V ele fica no meio entre a dobra e o fundo do V
    const c0 = lado > 0 ? dobra + folga - 1 + n * 6 : dobra + folga - 1 + (texto.length - 1 - n) * 6 + 4, s = sobe(c0 + 2 * lado);   // a letra inteira sobe o tanto do meio dela
    (LETRAS_FITA[l] || []).forEach((linha, j) => [...linha].forEach((v, c) => {
      const k = T.cel(xc(c0) + c, Math.round(y0 + 2 + j - s));
      if (v === 'X' && k >= 0) m.set(k, caneta);
    }));
  });
  return m;
}

/* fita isolante preta enrolada no cabo, como o trecho preto do cabo vermelho no mock: fina, quase na grossura do cabo, em voltas de cerca de 16 px com um degrau de meia celula de uma
   sobre a outra e a emenda marcada so por uma celula mais
   escura, e o brilho fino do lado da luz. pts e o trecho da curva que ela cobre */
function fitaIsolante(T, pts) {
  const m = new Map(), brilho = [128, 132, 138], meio = [76, 80, 86], corpo = [50, 53, 58], sombra = [27, 29, 32], emenda = [34, 36, 40];
  const perto = new Map(), acc = [0];
  for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  for (let i = 0; i + 1 < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1, L = Math.sqrt(L2);
    let nx = -dy / L, ny = dx / L;
    if (nx + ny > 0) { nx = -nx; ny = -ny; }
    for (let y = Math.floor(Math.min(ay, by) - 5); y <= Math.ceil(Math.max(ay, by) + 5); y++)
      for (let x = Math.floor(Math.min(ax, bx) - 5); x <= Math.ceil(Math.max(ax, bx) + 5); x++) {
        const c = T.cel(x, y), ox = x + .5 - ax, oy = y + .5 - ay, cru = (ox * dx + oy * dy) / L2;
        if (c < 0 || (i === 0 && cru < 0) || (i === pts.length - 2 && cru > 1)) continue;   // as pontas cortadas retas
        const u = Math.max(0, Math.min(1, cru)), ex = ox - u * dx, ey = oy - u * dy, s = Math.hypot(ex, ey), o = perto.get(c);
        if (s <= 3.4 && (!o || s < Math.abs(o[0]))) perto.set(c, [ex * nx + ey * ny >= 0 ? s : -s, acc[i] + u * L]);
      }
  }
  for (const [c, [s, a]] of perto) {
    const volta = Math.floor(a / 16), raio = volta % 2 ? 3.05 : 3.35, fase = a - volta * 16;
    if (Math.abs(s) > raio) continue;
    m.set(c, fase < 1 && volta && s > -1.6 ? emenda : s > raio - 1.2 && s <= raio - .4 ? brilho : s > 1.4 ? meio : s < -1.6 ? sombra : corpo);
  }
  return m;
}

/* acoplador femea-femea emendando dois cabos: os dois plugues retos e o tubo no meio, em niquel; y e a

}

/* o caminho dos dois primeiros cabos da corrente como no mock B corrigido (o mesmo

/* o plugue dos cabos da mesa (mock de 20/11), em celulas de 2 px: o corpo creme frisado e a porca de niquel no aparelho;
   para = -1, o cabo sai para cima (a porca embaixo, no topo do pedal), 1 para baixo (a porca em cima, no pe do aparelho),
   2 para a direita e -2 para a esquerda (num lado do aparelho). col e lin: a celula da porca colada no aparelho, col no
   meio do plugue (lin no meio, deitado). Devolve a peca e a ponta de onde sai o cabo */
const PAL_PLUGUE = [[246, 234, 204], [216, 196, 152], [158, 134, 92]];
function plugueMesa(T, col, lin, para) {
  const m = new Map(), ni = PAL_PECA.niquel, [luz, meio, esc] = PAL_PLUGUE;
  if (Math.abs(para) === 1) {
    const ny = para < 0 ? lin - 1 : lin, cy0 = para < 0 ? lin - 6 : lin + 2;
    T.caixa(m, col - 3, ny, 7, 2, ni, false);
    for (let j = 0; j < 5; j++) for (let i = -2; i <= 2; i++) {
      const k = T.cel(col + i, cy0 + j);

    }

    return { m, x: col + .5, y: para < 0 ? cy0 : cy0 + 4.5 };
  }
  const nx = para > 0 ? col : col - 1, cx0 = para > 0 ? col + 2 : col - 6;
  T.caixa(m, nx, lin - 3, 2, 7, ni, false);
  for (let i = 0; i < 5; i++) for (let j = -2; j <= 2; j++) {
    const k = T.cel(cx0 + i, lin + j);
    if (k >= 0) m.set(k, j === -2 ? luz : j === 2 ? esc : (i % 2 ? esc : j === -1 ? luz : meio));
  }

/* a porca de niquel de uma tomada de pedal, a mesma no plugue em L das pontas e nas cabecas do U: 2 colunas por 8
   linhas, a luz em cima e na coluna da esquerda, a sombra embaixo e na da direita; x: a coluna da esquerda; y: a linha
   de cima. E o pino de metal que sai dela (1 coluna por 4 linhas, das linhas 2 a 5 da porca, mais escuro, para a porca
   se destacar do corpo do plugue) na coluna px */
function porcaPedal(put, x, y, px) {
  const ni = PAL_PECA.niquel;
  for (let j = 0; j < 8; j++) {
    put(x, y + j, j < 6 ? ni[0] : ni[1]);
    put(x + 1, y + j, j === 0 ? ni[0] : j < 6 ? ni[1] : ni[2]);
  }
  for (let j = 2; j < 6; j++) put(px, y + j, j === 2 ? ni[1] : ni[2]);
}
/* o cabinho em U entre dois pedais vizinhos, o da versao antiga redesenhado a mao na grade de 2 px: em cima do vao, os
   dois plugues lado a lado, cada um com a mesma porca e o mesmo pino do plugue em L das pontas (a porca por cima da
   lateral do seu pedal, o pino na beira dele) e a cabeca de plastico preto no vao, a luz em cima e na beira da esquerda;
   embaixo de cada um o alivio frisado e uma perna de cabo de 3 celulas (brilho, meio e corpo, a luz do lado esquerdo,
   como nos cabos longos), as duas separadas pelo contorno e por uma fresta de feltro, e a curva redonda embaixo, com o
   brilho em cima do fundo. O vao tem 4 celulas: as pernas passam 2 celulas por cima da lateral de cada pedal e a porca
   3, na altura dela (abaixo do icone, longe do nome, do LED e do footswitch). xe: a ultima coluna do pedal da esquerda;
   xd: a primeira do da direita; y: a linha de cima das cabecas (a porca comeca uma acima); L: o comprimento das pernas.
   A fresta vai em m.vazias (sem contorno nem sombra) */
function uMesa(T, xe, xd, y, L = 9) {
  const m = new Map(), [luz, , esc] = PAL_PECA.preto, bo = PAL_PECA.borracha, [cb, cm, ck, cs] = PAL_CABO.preto;
  const put = (x, yy, c) => { const i = T.cel(x, yy); if (i >= 0) m.set(i, c); };
  const b = xe - 1, i = xd + 1;   // de b a i: as pernas, de fora a fora
  // as porcas e os pinos, e as cabecas de plastico no vao (2 colunas cada, 6 linhas)
  porcaPedal(put, xe - 2, y - 1, xe); porcaPedal(put, xd + 1, y - 1, xd);
  for (const a of [xe + 1, xd - 2]) for (let j = 0; j < 6; j++) {
    put(a, y + j, j === 5 ? esc : luz); put(a + 1, y + j, j === 0 ? luz : esc);
  }
  // as pernas: a da esquerda de b a xe + 1, a da direita de xd - 1 a i; entre elas o contorno da da esquerda e a fresta
  const pernas = [b, xd - 1], fresta = xd - 2, y0 = y + 9, y1 = y0 + L;   // o alivio nas linhas 7 e 8, as pernas de y0 a y1 - 1
  for (const p of pernas) {
    for (let k = 0; k < 3; k++) { put(p + k, y + 7, k ? bo[1] : bo[0]); put(p + k, y + 8, bo[2]); }
    for (let j = y0; j < y1; j++) { put(p, j, cb); put(p + 1, j, cm); put(p + 2, j, ck); }
  }
  m.vazias = new Set();
  for (let j = y + 8; j < y1 - 1; j++) { const k = T.cel(fresta, j); if (k >= 0) m.vazias.add(k); }
  // a curva de baixo: a primeira linha fecha a fresta (o brilho em cima do fundo), a segunda vai de xe a xd, a terceira so
  // no meio; as quinas de fora ficam no contorno e a curva sai redonda
  for (let x = b; x <= i; x++) put(x, y1, x === b ? cb : x === b + 1 ? cm : x === i ? ck : x >= xe + 2 && x <= xd - 1 ? cb : cm);
  for (let x = xe; x <= xd; x++) put(x, y1 + 1, x === xd ? ck : cm);
  for (let x = xe + 1; x <= xd - 1; x++) put(x, y1 + 2, x === xd - 1 ? cs : ck);
  return m;
}
/* o plugue em L das pontas do painel (a primeira e a ultima tomada de cada fileira de pedais; no receiver todas as
   entradas usam o plugueMesa), o da versao antiga redesenhado a mao na grade de 2 px, na proporcao de la medida pelo
   pedal (o corpo e o alivio com cerca de 1/5 da altura do pedal): a porca de niquel com a coluna de dentro na beira do
   pedal, o pino, e o corpo cromado em L, o braco deitado na altura da tomada e o corpo em pe saindo de lado (6 colunas
   por 15 linhas, a quina de fora redonda, o brilho em pe perto da beira da esquerda), e o alivio frisado de borracha
   onde o cabo sai, para baixo (para = 1) ou para cima (-1). A mesma peca nas quatro pontas: no lado direito espelhada, e
   para cima virada de ponta-cabeca em volta da tomada; a luz fica sempre em cima e a esquerda. e: a coluna da beira do
   pedal do lado da tomada; lado: 1 a direita dele, -1 a esquerda; y: a linha de cima das cabecas do U (a porca comeca
   uma acima). Devolve a peca e a ponta de onde sai o cabo */
function plugueLMesa(T, e, y, lado, para) {
  const m = new Map(), cr = PAL_PECA.cromo, bo = PAL_PECA.borracha, cl = cr[0].map((v, k) => Math.round((v + cr[1][k]) / 2));
  const put = (x, yy, c) => { const i = T.cel(x, yy); if (i >= 0) m.set(i, c); };
  const c = k => e + lado * k, lin = j => para > 0 ? y + j : 2 * y + 5 - (y + j);   // j: a linha com o cabo para baixo
  const col = (k0, k1) => [Math.min(c(k0), c(k1)), Math.max(c(k0), c(k1))];
  // a porca (a coluna de dentro na beira do pedal) e o pino
  porcaPedal(put, Math.min(c(0), c(1)), y - 1, c(2));
  // o corpo cromado: o braco (c(3) e c(4), linhas 0 a 5) e o corpo em pe (c(5) a c(10), linhas 0 a 14), sem a quina de
  // fora do lado da tomada; a luz em cima e na beira da esquerda, o brilho em pe na segunda coluna do corpo, a sombra
  // embaixo e na beira da direita
  const cromo = new Set(), pos = (x, j) => x + ',' + j, quina = new Set([pos(10, 0), pos(9, 0), pos(10, 1)]);
  for (let j = 0; j < 15; j++) for (let k = 3; k <= 10; k++)
    if ((k >= 5 || j < 6) && !quina.has(pos(k, j))) cromo.add(pos(c(k), lin(j)));
  const [b0, b1] = col(5, 10);
  for (const s of cromo) {
    const [x, j] = s.split(',').map(Number), tem = (dx, dj) => cromo.has(pos(x + dx, j + dj));
    const corpo = x >= b0 && x <= b1;
    put(x, j, !tem(0, -1) || !tem(-1, 0) ? cr[0] : !tem(1, 0) || !tem(0, 1) ? cr[2] : corpo && x === b0 + 1 ? cr[0] : corpo && x === b0 + 2 ? cl : cr[1]);
  }
  // o alivio frisado, 7 linhas de 4 colunas (c(6) a c(9)): faixas escuras e claras alternadas
  const [f0, f1] = col(6, 9);
  for (let j = 15; j < 22; j++) for (let x = f0; x <= f1; x++) put(x, lin(j), j % 2 ? bo[2] : x === f0 ? bo[0] : bo[1]);
  return { m, x: (f0 + f1 + 1) / 2, y: para > 0 ? y + 22 : y - 16 };
}
/* fita crepe atravessada no cabo, prendendo ele no feltro: uma tira curta perpendicular a ele, meio torta (desliza
   inclina celulas por linha), as pontas rasgadas na mao, a borda de cima clara e a de baixo escura, a beira da esquerda
   na luz e a da direita na sombra, e o volume do cabo marcado no meio (a tira sobe por cima dele e pega a luz, e desce
   de volta ao feltro logo abaixo, na sombra). x, y: o meio da tira (em cima do cabo); comp: o comprimento atravessado,
   larg: a largura */
function fitaAtravessada(T, x, y, i, comp = 10, larg = 5, inclina = .2) {
  const m = new Map(), [luz, meio, esc] = PAL_PECA.crepe, dobra = [206, 182, 118];
  const rasga = (j, c) => (j === 0 || j === comp - 1) && (c === 0 || c === larg - 1 || sorteCabo(i, c * 5 + j) < .3);
  for (let j = 0; j < comp; j++) for (let c = 0; c < larg; c++) {
    if (rasga(j, c)) continue;   // as pontas rasgadas
    const k = T.cel(Math.round(x - larg / 2 + c + (j - (comp - 1) / 2) * inclina), Math.round(y - comp / 2 + j));
    if (k < 0) continue;
    const d = j + .5 - comp / 2, noCabo = Math.abs(d) < 1.6, desce = d >= 1.6 && d < 2.6;
    const ponta = j === 0 || (j === 1 && rasga(0, c)), pe = j === comp - 1 || (j === comp - 2 && rasga(comp - 1, c));
    m.set(k, ponta ? luz : pe ? esc : c === larg - 1 ? (noCabo ? meio : dobra) : noCabo || c === 0 ? luz : desce ? dobra : meio);
  }
  return m;
}
/* o pe do feltro das pedaleiras da mesa, em px do palco: 20 px abaixo do pedal mais alto das duas (a sombra dele, o
   feltro liso e o bisel), ou 16 com o Troca de voz, que desce 18 alem dos outros (revisao da r09: os comuns ficam com os
   34 de feltro embaixo de antes, e a altura do feltro nao muda); o mesmo nas duas, e nunca acima de 2 px do pe da
   gaveta. O desenhaGav (o feltro) e o cabosMesa (o pe da faixa de feltro em que o cabo longo ondula) usam o mesmo */
function fundoDoFeltro(gav) {
  const t0 = document.querySelector('.palco .banco .tecla[data-ef]');
  let alto = 0;
  for (const t of document.querySelectorAll('.palco .banco .tecla[data-ef]')) alto = Math.max(alto, t.offsetHeight);
  const G = rectP(gav);
  const margem = document.querySelector('.palco .banco .tecla[data-ef="pistavoz"]') ? 16 : 20;
  return Math.max(G.bottom - 2, t0 && alto ? rectP(t0).top + alto + margem : 0);
}
/* os cabos das pedaleiras da mesa, de quem ligou tudo as pressas num bar, quinze minutos antes do show. Cada painel e um
   laco que sai do receiver e volta para ele, com o sinal da direita para a esquerda, como nos pedais de verdade: a
   tomada de entrada no lado direito de cada pedal e a de saida no esquerdo, a 1/3 da altura (logo abaixo do icone).
   Entre vizinhos, o cabinho curto em U da versao antiga, descendo no vao; nas pontas, plugues em L. Na esquerda o mixer
   manda pelo lado esquerdo dele para a Catedral (curto, pela quina do painel) e o Radio devolve ate o lado esquerdo do
   mixer; na direita o Robo devolve por cima da parede de dentro, pelo vao e por baixo dos Sons rapidos ate o lado direito
   do mixer, e o mixer manda ate o Alto-falante. O cabo longo de cada painel (o do Radio e o do Alto-falante) sai da
   tomada da ponta numa barriga para fora, pendurado na beira de fora por cima da madeira, volta para o feltro e corre
   jogado em ondas largas na faixa de feltro embaixo dos pedais ate sair pela beira de dentro, preso com fita crepe
   atravessada. Nada passa por cima do nome, do LED, do footswitch ou do visor */
function cabosMesa(banco, cv) {
  banco.querySelectorAll('.fita-escrita').forEach(x => x.remove());
  const esq = banco.id === 'banco', gav = banco.closest('.gaveta'), recep = $('.palco .receptor'), pads = $('#pads');
  const peds = [...banco.querySelectorAll('.teclas > .tecla')].filter(p => p.offsetWidth);
  if (!peds.length || !recep || !pads || !pads.offsetWidth) { cv.width = 0; cv._geo = ''; return; }
  const G = rectP(gav), B = rectP(banco), M = rectP(recep), P = rectP(pads), R = peds.map(p => rectP(p)), J = jacksMesa(), F = fundoDoFeltro(gav);
  const par = v => Math.round(v / 2) * 2;

  const x0 = par(esq ? G.left - 20 : M.right - 4), x1 = par(esq ? M.left + 6 : G.right + 20), y0 = par(G.top - 12), y1 = PALCO_H;
  const geo = ['mesa-c7', x0, x1, y0, G.left, G.right, G.top, B.left, B.top, M.left, M.right, M.bottom, P.right, P.bottom, F,
    ...Object.values(J), ...R.flatMap(r => [r.left, r.top, r.width])].map(v => typeof v === 'number' ? Math.round(v) : v).join(',');
  if (cv._geo === geo) return;

  const n = R.length, yj = cy(R[0].top) + 40;   // a linha das tomadas
  const liga = (ctrl, ...plugues) => {
    const pts = curvaB(ctrl), c = T.peca(T.cabo(pts, PAL_CABO.preto, new Map(), 1.5));
    for (const p of plugues) T.peca(p.m, [c]);

  // nao encosta nele) ate 5,5 acima do pe do feltro. Na faixa estreita (a de 20 px, sem o Troca de voz, e a de 16 embaixo
  // dele) o cabo (12 px com o contorno e a sombra) nao tem onde ondular: a crista encosta no pe do pedal e o vale passa da
  // beira da frente, o cabo jogado meio para fora do painel; embaixo do Troca de voz ele passa reto no meio da faixa (as
  // ondas pulam ele)
  const xp0 = cx(R[0].left), xp1 = cx(R[n - 1].right);
  const pe = x => Math.max(cy(R[0].bottom), ...R.filter(r => x >= cx(r.left) - 3 && x <= cx(r.right) + 3).map(r => cy(r.bottom)));
  const estreita = x => cy(F) - pe(x) <= 10;
  const teto = x => pe(x) + (estreita(x) ? 3 : 3.5);
  const fundo = x => Math.max(teto(x), cy(F) + (estreita(x) ? 1 : -5.5)), meio = x => (teto(x) + fundo(x)) / 2;
  // as ondas largas e irregulares, de xa para xb: meia onda de 20 a 38 celulas, cada crista com dois pontos (a curva chega
  // perto dela), a de cima rente aos pedais e a de baixo perto do pe do feltro (na faixa larga sem encostar em nenhum dos
  // dois); alto: a primeira crista e a de cima. Embaixo do pedal que desce mais (o Troca de voz) o cabo passa reto no meio
  // da faixa, com dois pontos de cada lado da beira dele (a curva so sobe depois dela). Devolve os pontos da esquerda para
  // a direita
  const ondas = (xa, xb, i, alto) => {
    const s = Math.sign(xb - xa), pts = [], base = Math.min(...R.map(r => cy(r.bottom)));
    const fundos = R.filter(r => cy(r.bottom) > base).map(r => [cx(r.left) - 7, cx(r.right) + 7, (cy(r.bottom) + cy(F)) / 2 + .5])
      .filter(([l, r]) => l > Math.min(xa, xb) && r < Math.max(xa, xb));
    for (let j = 0, x = xa; ; j++, alto = !alto) {

    // pela beira de dentro, no meio da faixa, corre em ondas embaixo dos pedais (a primeira, a de cima, embaixo do

function medirCabosPedais() {

}
function medirCabosBanco(banco) {

  if (!banco || !banco.offsetParent) { if (banco && banco.id === 'banco-dir') limpa(); return; }

  // DJ tem os dela, no cabosMesa)
  const gav = celular() ? banco.closest('.gaveta') : banco, listas = banco.querySelectorAll('.teclas');
  if (!listas.length) { limpa(); return; }
  let cv = banco.querySelector(':scope > .cabos-pedais');
  if (!cv) {
    cv = document.createElement('canvas');
    if (banco.id === 'banco') cv.id = 'cabos-pedais';
    cv.className = 'cabos-pedais';

  }
  if (cv.parentNode !== banco) { cv._geo = ''; banco.append(cv); }

  // a grade das celulas comeca na borda da gaveta, em px inteiros do banco (os pedais caem em px inteiros dela)
  const gr = rectP(gav), br = rectP(banco);
  const xOff = Math.round(br.left - gr.left), W = Math.round(gr.width), H = Math.ceil(br.height);
  // o canvas passa da beira do feltro ate perto da beira do palco, para a fita VOZ sair por cima da parede;
  // W segue a largura do feltro, a beira de tudo o mais

  for (const t of listas) {
    const rot = t.previousElementSibling;
    t.querySelectorAll(':scope > .tecla').forEach((p, i) => {
      const r = rectP(p), l = linhas[linhas.length - 1];
      if (l && Math.abs(l.rs[0].top - r.top) < 1) l.rs.push(r);
      else linhas.push({ rs: [r], rot: i === 0 ? rot : null });

  }
  const filas = linhas.map(({ rs, rot }) => {
    const topoP = Math.min(...rs.map(r => r.top));
    return {
      cx: rs.map(r => [X(r.left), X(r.right)]), y: Y(rs[0].top) + 51, topoP: Y(topoP),
      topo: Y(Math.min(topoP, rot ? rectP(rot).top : Infinity)), pe: Y(Math.max(...rs.map(r => r.bottom))),
    };

    let e = banco.querySelector(`.fita-escrita[data-k="${k}"]`);
    if (!e) {

      e.className = 'fita-escrita';
      e.dataset.k = k;
      e.setAttribute('aria-hidden', 'true');
      e.textContent = texto;

    vivas.add(e);

  const noX = (pts, x, f = () => true) => pts.filter(f).reduce((m, p) => Math.abs(p[0] - x) < Math.abs(m[0] - x) ? p : m);

      const b = plugueAng(T, q.cx[k + 1][0] - 1, q.y, -1, PAL_PECA.preto);

    const cor = jeito === 0 ? PAL_CABO.vermelho : PAL_CABO.preto;

       Entre fileiras do mesmo grupo o feltro livre nao cabe o cabo, e as fileiras nao se afastam
       (20/10): o cabo corre colado no pe dos pedais de cima, por cima da sombra deles, e as tomadas

    /* o vao em pontos de controle da curvaB: a quina de cada canto puxa a curva sem ser tocada, e o arco
       sai largo; no vao o cabo pesa um pouco no meio */
    const vao = [[pa.x + 1, yv], [ra - 40, yv + 1], [(ra + lb) / 2 + (r(3) - .5) * 30, yv + (aperto ? 1 : 3)], [lb + 30, yv + 1], [lb - 16, yv]];
    // na margem esquerda desce um pouco por fora do plugue e entra nele num S pequeno, como no mock
    const desce = [[lb - 19.5, yv + (pb.y - yv) * .35], [pb.x, pb.y - (pb.y - yv) * .35], [pb.x, pb.y]];
    if (jeito === 2) {
      // a sobra enrolada em oito na margem direita, com a abracadeira na cintura
      const xr = Math.round((ra + 3 + W) / 2), y1 = a.y + 50, y2 = y1 + 18, roda = (cy, de) => {

      const pts = liga([[xr + 6.5, y2 + 6.5], [xr + 8.5, y2 + 14], [xr + 6, yv - 16], [xr + 3, yv + 1], ...vao.slice(1), ...desce], cor, pb);
      T.peca(T.cabo(roda(y1, -2.4), cor));

      const xa = Math.round((pa.x + pb.x) / 2 + 14);

/* visor LCD: texto em 14 segmentos com as casas que cabem, todas com o fantasma; o que nao cabe

   a letra base ou espaco, como era */
const LCD_PASSO_MS = 330, LCD_PAUSA_MS = 1500, LCD_VAO = 3, LCD_CASA_EM = 0.815;   // largura de cada casa na DSEG
function lcdTexto(t) {
  return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
    .replace(/[^A-Z0-9'\-\/?]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function lcd14(el) {
  const l = { txt: '', n: 0, i: 0, t: 0 };
  function desenhar(reinicia) {
    clearTimeout(l.t);
    if (!el.clientWidth) return;   // escondido (o visor do outro tamanho de tela): volta pelo ResizeObserver
    const fs = parseFloat(getComputedStyle(el).fontSize) || 16;
    const n = Math.max(1, Math.floor((el.clientWidth + 1) / (fs * LCD_CASA_EM)));
    if (n !== l.n) { l.n = n; el.dataset.f = '~'.repeat(n); reinicia = true; }
    const s = l.txt.replace(/ /g, '!');   // na DSEG o ! e a casa em branco
    if (s.length <= n || reduz.matches) { el.textContent = s.length > n ? s.slice(0, n) : s.padEnd(n, '!'); return; }
    if (reinicia) l.i = 0;
    const fita = s + '!'.repeat(LCD_VAO);
    el.textContent = (fita + fita).slice(l.i, l.i + n);
    l.t = setTimeout(() => { l.i = (l.i + 1) % fita.length; desenhar(false); }, l.i === 0 ? LCD_PAUSA_MS : LCD_PASSO_MS);
  }
  new ResizeObserver(() => desenhar(false)).observe(el);
  if (document.fonts) document.fonts.ready.then(() => desenhar(true));

}

   fios so se pintavam quando a medida mudava, e a agulha so quando andava, entao o VU parado voltava sem escala e

function desenharPrateleira() {
  const ul = $('#estante');
  const ativo = document.activeElement;
  const foco = ativo && ul.contains(ativo) ? { li: ativo.closest('li'), role: ativo.dataset.role } : null;
  const focoChave = foco && foco.li ? (foco.li.dataset.id || 'job:' + foco.li.dataset.job) : null;

  const queridos = [];
  S.lib.forEach((it, i) => {
    const k = 'i:' + it.id;
    let li = nos.get(k);
    if (!li || li._chave !== chaveItem(it, i)) {
      const novo = liDisco(it, i);
      if (li) li.replaceWith(novo);   // troca no lugar: o no velho nao fica pendurado na estante
      li = novo; nos.set(k, li);
    }
    queridos.push([k, li]);
  });
  for (const j of jobsVisiveis()) {
    const k = 'j:' + j.id;
    let li = nos.get(k);
    if (!li) { li = liJob(j); nos.set(k, li); } else atualizarJob(li, j);
    queridos.push([k, li]);
  }
  const vivos = new Set(queridos.map(q => q[0]));
  for (const [k, li] of nos) if (!vivos.has(k)) { li.remove(); nos.delete(k); }
  const vazio = ul.querySelector('.vazio');
  if (queridos.length) { if (vazio) vazio.remove(); }
  else if (!vazio) {
    const v = el('li', 'vazio');
    v.append(el('strong', null, I18N.t('shelf.empty')), document.createTextNode(I18N.t('shelf.emptyHint')));
    ul.append(v);
  }
  queridos.forEach(([, li], i) => { if (ul.children[i] !== li) ul.insertBefore(li, ul.children[i] || null); });
  // celular: 9 capas por pagina, lidas em fileiras de 3 (so o celular usa a posicao)
  queridos.forEach(([, li], i) => {
    mudar(li, '--c', String(Math.floor(i / 9) * 3 + i % 3 + 1)); mudar(li, '--r', String(Math.floor(i % 9 / 3) + 1));
    li.classList.toggle('pagina', i % 9 === 0);
  });
  const desejados = new Set(queridos.map(q => q[1]));
  [...ul.children].forEach(c => { if (!desejados.has(c) && !c.classList.contains('vazio')) c.remove(); });

  if (foco && !ul.contains(ativo)) {
    const alvo = focoChave && [...ul.children].find(x => (x.dataset.id || 'job:' + x.dataset.job) === focoChave);
    const b = alvo && (alvo.querySelector(`[data-role="${foco.role}"]`) || alvo.querySelector('button'));
    if (b) b.focus();
  }
  const n = S.lib.length;
  $('#conta').textContent = I18N.tp('shelf.count', n);
  if (S.state && !S.state.track) {
    $('#canal-faixa').textContent = dicaPrato();
    $('#mini-sub').textContent = dicaMini(); rotularMini();
  }
  marcarPrateleira();
  desenharRapidos();
  desenharContinuar();
  desenharPontos(queridos.length);
}

/* prateleira: as mais escutadas primeiro e as novas por ultimo (18/10; a escuta o
   servidor conta em `plays`). A ordem se faz quando a pagina abre: disco novo entra no fim, e
   ouvir um disco nao o tira do lugar com a pagina aberta (nada pula debaixo do dedo) */
const lugarLib = new Map();
function ordenarLib(lib) {
  if (!lugarLib.size) {
    [...lib].sort((a, b) => (b.plays || 0) - (a.plays || 0) || String(a.added || '').localeCompare(String(b.added || '')))
      .forEach((it, i) => lugarLib.set(it.id, i));
  }
  for (const it of lib) if (!lugarLib.has(it.id)) lugarLib.set(it.id, lugarLib.size);
  return [...lib].sort((a, b) => lugarLib.get(a.id) - lugarLib.get(b.id));
}

/* pontos da pagina da prateleira (celular), como no Jukebox digital do YouTube Music */
function desenharPontos(n) {
  const box = $('#pontos'), paginas = Math.ceil(n / 9);
  box.hidden = paginas < 2;
  if (box.childElementCount !== paginas) box.replaceChildren(...Array.from({ length: paginas }, () => el('span')));
  marcarPonto();
}
function marcarPonto() {
  const ul = $('#estante'), box = $('#pontos');
  if (box.hidden || !box.childElementCount) return;
  const i = Math.round(ul.scrollLeft / Math.max(1, ul.scrollWidth / box.childElementCount));
  [...box.children].forEach((p, k) => p.classList.toggle('aqui', k === i));
}

/* continuar ouvindo: os discos que pararam no meio, do jeito que estao na prateleira */
function desenharContinuar() {
  const its = S.lib.filter(it => (it.last_pos || 0) > 5 && it.duration - it.last_pos > 10).slice(0, 12);
  const ul = $('#cartoes');
  $('#continuar').hidden = !its.length;
  const chave = its.map(it => `${it.id}|${Math.round(it.last_pos)}|${it.title}`).join('/');
  if (ul._chave === chave) return;
  ul._chave = chave;
  ul.replaceChildren(...its.map(it => {
    const li = el('li', 'cartao'); li.dataset.id = it.id;
    const b = el('button', 'cartao-b'); b.type = 'button';
    b.setAttribute('aria-label', I18N.t('shelf.resumeFromItem', { time: fmt(it.last_pos), title: it.title }));
    const capa = el('span', 'cartao-capa'); capa.append(arte(it, false));
    const pr = el('span', 'cartao-prog'); pr.style.setProperty('--p', (it.last_pos / it.duration).toFixed(3));
    capa.append(pr);
    b.append(capa, el('span', 'cartao-tit', it.title), el('span', 'cartao-sub', I18N.t('shelf.resumeFrom', { time: fmt(it.last_pos) })));
    li.append(b);
    return li;
  }));
}

/* sons rapidos: os de ate 15 s, que o servidor toca por cima da musica, e os discos postos pelo
   menu de segurar (25/10), que tocam por cima inteiros, ate 2 min (RAPIDO_MAX_S do motor); a lampada acende
   enquanto o som esta tocando */
const CURTO_S = 15, RAPIDO_MAX_S = 120;
const curto = it => !!it.duration && it.duration <= CURTO_S;
function desenharRapidos() {
  const curtos = S.lib.filter(it => curto(it) || it.rapido);
  const chips = $('#chips');
  $('#rapidos').hidden = !curtos.length;
  $('#conta-rap').textContent = I18N.tp('pads.count', curtos.length);
  const chave = curtos.map(it => it.id + '|' + it.title).join('/');
  if (chips._chave !== chave) {
    chips._chave = chave;
    chips.replaceChildren(...curtos.map(it => {
      const b = el('button', 'compacto'); b.type = 'button'; b.dataset.id = it.id;
      b.setAttribute('aria-label', I18N.t('pads.playOver', { title: it.title }));
      // compacto de 7 polegadas: selo de papel na cor do som, como as capas geradas
      const [bg, fg] = PALETAS[hash(it.id || it.title) % PALETAS.length];
      const sete = el('span', 'sete'), gira = el('span', 'sete-gira'), rot = el('span', 'sete-rot');
      rot.style.setProperty('--bg', bg); rot.style.setProperty('--fg', fg);
      gira.append(rot); sete.append(gira); sete.setAttribute('aria-hidden', 'true');
      b.append(sete, el('span', 'lampada'), el('span', 't', it.title), el('span', 'd', fmt(Math.min(it.duration || 0, it.rapido ? RAPIDO_MAX_S : CURTO_S))));
      return b;
    }));
  }
  const tocando = new Set(((S.state && S.state.por_cima) || []).map(x => x.id));
  chips.querySelectorAll('.compacto').forEach(b => {
    const on = tocando.has(b.dataset.id);
    mudar(b.querySelector('.lampada'), 'class', 'lampada' + (on ? ' acesa' : ''));
    mudar(b, 'class', 'compacto' + (on ? ' tocando' : ''));
  });
  desenharPads(curtos);
}

function marcarPrateleira() {
  const tr = S.state && S.state.track;
  document.querySelectorAll('#estante .disco-item[data-id]').forEach(li => {
    li.classList.toggle('no-prato', !!tr && li.dataset.id === tr.id);
  });
}

/* ---------- comandos ---------- */
async function tocar(id, extra) {
  try { await api('POST', '/api/play', { id, ...(extra || {}) }); return true; }
  catch (e) { avisar(e.message, true); return false; }
}
async function cmd(path, okTxt) {
  try { await api('POST', path); if (okTxt) avisar(okTxt); }
  catch (e) { avisar(e.message, true); }
}
function alternar() {
  const s = S.state;
  // sons por cima com o disco parado (ou sem disco): o Pausar so cala os sons, o disco fica como esta
  const tocando = s && s.track && (s.status === 'playing' || s.status === 'buffering');
  if (s && s.por_cima && s.por_cima.length && !tocando) { cmd('/api/pause'); return; }
  if (!s || !s.track) {
    avisar(!S.lib.length ? I18N.t('shelf.emptyToast')
      : celular() ? I18N.t('deck.pickFirstPhone')
      : I18N.t('deck.pickFirstPc'));
    return;
  }
  if (s.status === 'ended') cmd('/api/resume');
  else cmd('/api/toggle');
}

const enviando = {}, ultimoEnvio = {};
function ajustar(k, v) {
  S.segurando[k] = Date.now();
  if (S.state) S.state[k] = v;
  clearTimeout(enviando[k]);
  const manda = () => {
    ultimoEnvio[k] = Date.now();
    api('POST', '/api/settings', { [k]: v }).catch(e => avisar(e.message, true));
  };
  if (Date.now() - (ultimoEnvio[k] || 0) > 110) manda(); else enviando[k] = setTimeout(manda, 110);
}

/* ---------- busca ---------- */
function ehLink(q) { return /^https?:\/\//i.test(q) || /(youtu\.be\/|youtube\.com\/)/i.test(q); }
function idDoLink(q) { const m = q.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }

async function buscar(q) {
  q = q.trim();
  if (!q) { $('#q').focus(); return; }
  abrirGaveta(false);   // os resultados aparecem na parede, onde a gaveta estava
  if (!celular() && !MESA.montada) abrirMaleta(false);   // a maleta aberta na prateleira nao entra na frente deles (na mesa a busca cai por cima de tudo)
  const seq = ++S.buscaSeq;
  if (ehLink(q)) {
    S.busca = { q, link: true, itens: [{ link: q, youtube_id: idDoLink(q) }], carregando: false, erro: null };
    $('#rolo-busca').scrollTop = 0;
    desenharBusca(); mostrarResultados(); return;
  }
  // buscando enquanto digita: os resultados da busca anterior ficam ate os novos chegarem
  S.busca = { q, link: false, itens: S.busca && !S.busca.link ? S.busca.itens : [], carregando: true, erro: null };
  $('#rolo-busca').scrollTop = 0;
  desenharBusca();
  mostrarResultados();
  try {
    const r = await api('GET', `/api/search?q=${encodeURIComponent(q)}&n=${POR_LEVA}`);
    if (seq !== S.buscaSeq || !S.busca) return;
    S.busca.itens = Array.isArray(r) ? r : [];
    S.busca.pedidos = POR_LEVA; S.busca.fim = !S.busca.itens.length;
  } catch (e) {
    if (seq !== S.buscaSeq || !S.busca) return;
    S.busca.erro = e.message; S.busca.semResposta = e.status === 0; S.busca.erroMsg = e.msg;
  }
  S.busca.carregando = false;
  desenharBusca();
  talvezMais();
}

/* carregar mais: chegando no fim da lista, pede a leva seguinte; o que ja
   esta na lista nao se repete. Servidor antigo devolve a primeira leva de novo: nada novo, fim */
const POR_LEVA = 20;
async function maisResultados() {
  const b = S.busca;
  if (!b || b.link || b.carregando || b.mais || b.fim || b.erro || !b.itens.length) return;
  b.mais = true; b.erroMais = null; desenharMais();
  try {
    const r = await api('GET', `/api/search?q=${encodeURIComponent(b.q)}&n=${POR_LEVA}&start=${b.pedidos || POR_LEVA}`);
    if (S.busca !== b) return;
    // o YouTube reordena as paginas a cada busca: a leva seguinte repete parte do que ja veio.
    // Acaba quando ele nao tem mais nada, em 200, ou depois de duas levas sem nada novo
    const lista = Array.isArray(r) ? r : [];
    const vistos = new Set(b.itens.map(x => x.youtube_id));
    const novos = lista.filter(x => x.youtube_id && !vistos.has(x.youtube_id));
    b.pedidos = (b.pedidos || POR_LEVA) + POR_LEVA;
    b.secas = novos.length ? 0 : (b.secas || 0) + 1;
    if (novos.length) b.itens = b.itens.concat(novos);
    if (!lista.length || b.secas >= 2 || b.pedidos >= 200) b.fim = true;
  } catch (e) {
    if (S.busca !== b) return;
    b.erroMais = e.message;
  }
  b.mais = false;
  desenharBusca();
  if (!b.erroMais) talvezMais();
}
/* o fim da lista ainda esta perto da tela depois da leva (lista curta, tela alta): pede mais */
function talvezMais() {
  const p = $('#mais-res');
  if (!S.busca || $('#vista-busca').hidden) return;
  const r = p.getBoundingClientRect(), c = $('#rolo-busca').getBoundingClientRect();
  const fundo = celular() ? innerHeight + 600 : Math.min(innerHeight, c.bottom) + 200;
  if (r.top < fundo) maisResultados();
}
function desenharMais() {
  const p = $('#mais-res'), b = S.busca;
  p.replaceChildren();
  if (!b || b.link || b.carregando || b.erro || !b.itens.length) return;
  if (b.mais) p.append(el('span', 'lampada acesa piscando'), document.createTextNode(I18N.t('search.loadingMore')));
  else if (b.erroMais) p.textContent = I18N.t('search.moreFailed');
  else if (b.fim) p.textContent = I18N.t('search.end');
}
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) maisResultados(); }, { rootMargin: '0px 0px 600px 0px' })
  .observe($('#mais-res'));

/* no celular a busca entra na historia, como o palco: o voltar do Android fecha os resultados
   em vez de sair da pagina (review) */
let buscaNaHistoria = false;
function mostrarResultados() {
  if (matchMedia('(max-width: 899.98px)').matches) {
    // os resultados vem logo abaixo do campo: o topo mostra os dois, com a seta de voltar
    scrollTo({ top: 0, behavior: reduz.matches ? 'auto' : 'smooth' });
    if (!buscaNaHistoria) { history.pushState({ busca: true, vida: VIDA }, ''); buscaNaHistoria = true; }
  }
}
/* o motivo do download que falhou, pelo detalhe tecnico (o do yt-dlp, em ingles) */
function motivoDownload(t) {
  t = String(t || '');
  if (/unavailable|private/i.test(t)) return I18N.t('download.reason.unavailable');
  if (/429|too many/i.test(t)) return I18N.t('download.reason.rateLimit');
  if (/getaddrinfo|network|timed out|connection|resolve/i.test(t)) return I18N.t('download.reason.network');
  // o "not a bot" tambem diz "sign in", mas e o YouTube desconfiando dos pedidos, nao o video: vem antes
  if (/not a bot/i.test(t)) return I18N.t('download.reason.bot');
  if (/confirm your age|age[- ]restricted|inappropriate/i.test(t)) return I18N.t('download.reason.age');
  if (/sign in|members[- ]only|login/i.test(t)) return I18N.t('download.reason.login');
  return I18N.t('download.reason.generic');
}
function fecharBusca() {
  S.busca = null; S.buscaSeq++;
  desenharBusca();
  // fechou pelo botao ou tocando um resultado: tira a entrada, senao o voltar seguinte nao faria
  // nada; com o palco por cima (download que terminou tocando) o popstate pula ela depois
  if (buscaNaHistoria && !palcoNaHistoria) { buscaNaHistoria = false; history.back(); }
}
function naPrateleira(yid) { return yid ? S.lib.find(x => x.youtube_id === yid) : null; }
function jobDe(alvo) {
  if (!alvo) return null;
  // o servidor novo diz o alvo de cada download (inclusive os que a fila comecou); o antigo, so o mapa daqui
  return S.jobs.find(j => (S.jobAlvo[j.id] === alvo || j.alvo === alvo) && (j.status === 'running' || j.status === 'error'));
}
/* (#53) o salvar na prateleira do disco no prato e das linhas do A seguir: no que nao esta na prateleira (o do
   Automatico, que so toca pelo stream, e o da busca ou da fila ainda baixando, ou que falhou) e, com o visto que tira de
   novo, como na busca, no que chegou nela enquanto a pagina o mostrava. O que ja estava na prateleira fica sem: a fila
   inteira com o visto so repetiria o que ela e.
   O disco e o que o servidor baixa: o id do YouTube ou o link colado (de outro site, sem id do YouTube). O link que
   chegou se acha pelo item que o download dele trouxe: o servidor tira o download terminado da lista em 20 s, e a pagina
   guarda o que cada um trouxe (S.chegou) */
const alvoDisco = x => (x && (x.youtube_id || x.url || x.alvo)) || null;
function lembrarChegadas() {
  for (const j of S.jobs) {   // na ordem do servidor: o download mais novo do mesmo disco (baixado de novo) vale
    const a = S.jobAlvo[j.id] || j.alvo;
    if (j.status !== 'done' || !j.item_id || !a) continue;
    S.chegou.set(a, j.item_id);
    // o disco do prato passa para o item da prateleira quando o arquivo chega (o id dele, do YouTube ou do site): o
    // visto segue nele
    if (S.vistoFora.has(a)) S.vistoFora.add(j.item_id);
  }
}
function discoNaPrateleira(x) {
  const a = alvoDisco(x), id = a && S.chegou.get(a);
  return naPrateleira(x && x.youtube_id) || (id && S.lib.find(it => it.id === id)) || null;
}
function mostraSalvar(x) {
  const a = alvoDisco(x);
  if (!a) return false;
  // so com a prateleira ja carregada: antes dela, todo disco parece fora (e ficaria com o visto ao chegar a lista)
  if (!discoNaPrateleira(x)) { if (S.libOk) S.vistoFora.add(a); return true; }
  return !!x.auto || S.vistoFora.has(a);
}
// o estado do salvar do disco (o do estadoSalvar, com o link colado e o que chegou pelo download dele)
const estadoDisco = x => discoNaPrateleira(x) ? ['salvo', 0] : estadoSalvar(x.youtube_id, x.url || x.alvo);
// o clique: como o da busca, e o que chegou sai da prateleira pelo item que o download trouxe
function salvarDisco(x) {
  const r = { youtube_id: x.youtube_id, link: x.youtube_id ? undefined : (x.url || x.alvo), title: x.title, channel: x.channel,
              thumb: x.thumb, duration: x.duration };
  const ja = discoNaPrateleira(x);
  if (ja) tirarDaPrateleira(ja, r); else salvarResultado(r);
}
/* servidor com fila e stream (o 8799 antigo nao tem ate reiniciar): sem ele, nada de fila na tela */
const temFila = () => !!(S.state && Array.isArray(S.state.queue));

function desenharBusca() {
  const vb = $('#vista-busca'), vp = $('#vista-prateleira');
  const b = S.busca;
  vb.hidden = !b; vp.hidden = !!b;
  document.body.classList.toggle('com-busca', !!b);   // a seta de voltar dentro do campo, no celular
  vigiarGavetaDaBusca();   // (#113) o toque fora da gaveta, na mesa
  if (!b) return;
  medirBusca();   // na mesa a busca cai debaixo do campo
  $('#titulo-busca').textContent = b.link ? I18N.t('search.pastedLink') : I18N.t('search.resultsFor', { query: b.q });
  $('#titulo-busca').title = $('#titulo-busca').textContent;
  const av = $('#aviso-busca'); av.className = 'aviso-busca'; av.replaceChildren();
  if (b.carregando) av.append(el('span', 'lampada acesa piscando'), document.createTextNode(I18N.t('search.searching')));
  else if (b.erro) {
    av.classList.add('erro');
    // pelo tipo, e nao pelo texto: sem resposta e o status 0 do api(), a busca do YouTube e a chave da mensagem, e o
    // limite e o motivo tecnico dela (o do yt-dlp, em ingles). O YouTube que demorou ("o YouTube não respondeu a
    // tempo") e erro do YouTube, e nao do Ritmelli fora do ar
    const fora = b.semResposta;
    const doYoutube = !!b.erroMsg && b.erroMsg.key === 'server.search.failed';
    const limite = /429|too many/i.test(detalheMsg(b.erroMsg));
    // o espaco depois do negrito fica dentro dele, como sempre foi
    if (fora) {
      av.append(el('strong', null, I18N.t('search.error.offline') + ' '), document.createTextNode(I18N.t('search.error.offlineHint')));
    } else if (doYoutube || limite) {
      const dica = I18N.t(limite ? 'search.error.rateLimitHint' : 'search.error.youtubeHint');
      av.append(el('strong', null, I18N.t('search.error.youtube') + ' '), document.createTextNode(dica));
      av.append(el('small', 'detalhe', I18N.t('search.error.detail', { detail: detalheMsg(b.erroMsg) })));
    } else {
      // outra recusa do servidor, ja traduzida pelo api() (ex.: a server.search.empty)
      av.append(el('strong', null, b.erro));
    }
  } else if (!b.link && !b.itens.length) av.textContent = I18N.t('search.noResults');
  else av.textContent = b.link ? I18N.t('search.linkHint') : '';
  av.hidden = !av.textContent;

  // a lista so se monta quando chegam resultados novos; o resto (anel, ✓, tocando) muda no lugar,
  // senao o progresso do download (15 vezes por segundo) trocaria a linha embaixo do dedo
  desenharMais();
  const ul = $('#resultados');
  if (ul._itens !== b.itens) {
    if (S.puxandoRes) { S.buscaPendente = true; return; }
    // a leva seguinte entra no fim, sem remontar o que ja esta na tela
    const antes = ul._itens, mais = antes && antes.length < b.itens.length && antes.every((x, i) => b.itens[i] === x);
    ul._itens = b.itens;
    if (mais) ul.append(...b.itens.slice(antes.length).map(liResultado));
    else ul.replaceChildren(...b.itens.map(liResultado));
  }
  atualizarResultados();
}

const tituloRes = r => r.link || r.title || I18N.t('shelf.untitled');
function liResultado(r) {
  const li = el('li', 'resultado'); li._r = r;
  const yid = r.youtube_id;
  const fundo = el('span', 'fundo-fila'); fundo.innerHTML = IC.fila; fundo.setAttribute('aria-hidden', 'true');
  const corpo = el('div', 'corpo');
  const linha = el('button', 'linha'); linha.type = 'button'; linha.dataset.role = 'tocar';
  const mini = el('span', 'miniatura');
  if (r.link) {
    if (yid) mini.append(arte({ thumb: `https://i.ytimg.com/vi/${yid}/mqdefault.jpg`, id: yid, title: r.link }, false));
    else mini.append(capaGerada({ id: r.link, title: 'link' }, false));
  } else {
    mini.append(arte({ thumb: r.thumb, id: yid, title: r.title }, false));
    if (r.duration) mini.append(el('span', 'dur-m', fmt(r.duration)));
  }
  const txt = el('span', 'txt');
  txt.append(el('span', 'tit', tituloRes(r)), el('span', 'sub'));
  linha.append(mini, txt);
  const mais = el('button', 'acao-res'); mais.type = 'button'; mais.dataset.role = 'mais';
  mais.setAttribute('aria-label', I18N.t('search.result.moreOptions', { title: tituloRes(r) })); mais.setAttribute('aria-haspopup', 'menu'); mais.setAttribute('aria-expanded', 'false');
  mais.innerHTML = svgMais();
  const salvar = el('button', 'acao-res salvar'); salvar.type = 'button'; salvar.dataset.role = 'salvar';
  corpo.append(linha, mais, salvar);
  li.append(fundo, corpo);
  return li;
}
/* estado de cada linha: tocando agora, ⊕ livre, anel baixando, ✓ na prateleira ou erro */
function atualizarResultados() {
  const tr = S.state && S.state.track, st = S.state && S.state.status;
  for (const li of $('#resultados').children) {
    const r = li._r; if (!r) continue;
    const yid = r.youtube_id, t = tituloRes(r);
    const [est, pr] = estadoSalvar(yid, r.link);
    const tocando = !!tr && !!yid && tr.youtube_id === yid && st !== 'ended';
    const sig = [est, pr, tocando && st].join('|');
    if (li._sig === sig) continue;
    li._sig = sig;
    li.classList.toggle('no-prato', tocando);
    // uma linha so: a lampada quando esta no prato, o canal (ou o erro) e, no celular, a duracao;
    // o progresso do download fica no anel do ⊕
    const sub = li.querySelector('.sub'); sub.replaceChildren();
    if (tocando) sub.append(el('span', 'lampada acesa' + (st === 'buffering' ? ' piscando' : '')));
    sub.append(est === 'erro' ? el('span', 'canal erro-t', I18N.t('search.result.downloadFailed'))
      : el('span', 'canal', r.link ? I18N.t('search.pastedLink') : (r.channel || I18N.t('deck.noChannel'))));
    if (r.duration) sub.append(el('span', 'dur-s', `· ${fmt(r.duration)}`));
    li.querySelector('.linha').setAttribute('aria-label', I18N.t(tocando ? 'search.result.playOnPlatter' : 'search.result.play', { title: t }));
    pintarSalvar(li.querySelector('.salvar'), est, pr, t);
  }
}
/* o ⊕ de salvar na prateleira, o da busca e o da parecida no prato: livre, baixando (pr %), salvo ou erro */
function estadoSalvar(yid, link) {
  const jb = jobDe(yid) || (link && jobDe(link));
  const est = naPrateleira(yid) ? 'salvo' : jb && jb.status === 'running' ? 'baixando' : jb && jb.status === 'error' ? 'erro' : 'livre';
  return [est, jb ? Math.round((jb.progress || 0) * 100) : 0];
}
function pintarSalvar(s, est, pr, t) {
  const pixel = s.classList.contains('pixel');   // o da parecida no prato, desenhado pelo dev/pecas.py
  s.className = `acao-res salvar ${pixel ? 'pixel ' : ''}${est}`;
  s.setAttribute('aria-label', est === 'salvo' ? I18N.t('search.result.saved', { title: t })
    : est === 'baixando' ? I18N.t('search.result.downloading', { pct: pr, title: t })
    : I18N.t(est === 'erro' ? 'search.result.retry' : 'search.result.save', { title: t }));
  if (pixel) {   // baixando, o aro acende celula a celula no sentido do relogio (os rect ja vem nessa ordem)
    const aro = s.querySelectorAll('.sv-aro rect'), k = est === 'baixando' ? Math.round(aro.length * pr / 100) : 0;
    aro.forEach((r, i) => r.classList.toggle('on', i < k));
  }
  s.style.setProperty('--pr', pr + '%');
  if (!pixel) s.innerHTML = est === 'salvo' ? IC.salvo : est === 'baixando' ? '<span class="anel" aria-hidden="true"></span>' : IC.salvar;
}

const corpoDe = r => r.link ? { url: r.link } : { youtube_id: r.youtube_id, title: r.title, channel: r.channel, thumb: r.thumb, duration: r.duration };
/* tocar na linha: da prateleira se ja esta la; senao o servidor toca pelo stream na hora e baixa
   por tras (o antigo, sem stream, toca quando o download chega). A busca fica aberta, como no Spotify */
function tocarResultado(r) {
  const ja = naPrateleira(r.youtube_id);
  if (ja) tocar(ja.id);
  else baixar({ ...corpoDe(r), play: true }, r.link || r.youtube_id);
}
function salvarResultado(r) {
  const ja = naPrateleira(r.youtube_id);
  if (ja) { tirarDaPrateleira(ja, r); return; }
  const jb = jobDe(r.youtube_id) || jobDe(r.link);
  if (jb && jb.status === 'running') { avisar(I18N.t('download.already')); return; }
  baixar({ ...corpoDe(r), play: false }, r.link || r.youtube_id);
}

/* o ✓ da busca tira da prateleira, como no YouTube Music: sai na hora, com
   Desfazer no aviso (baixa de novo). Tocando agora, tambem sem perguntar: o disco segue no prato e o
   servidor apaga o arquivo quando ele sair */
async function tirarDaPrateleira(it, r) {
  try {
    await api('DELETE', `/api/library/${encodeURIComponent(it.id)}`);
    avisar(I18N.t('download.removed'), false, { rotulo: I18N.t('app.undo'), fn: () => baixar({ ...corpoDe(r), play: false }, r.link || r.youtube_id) });
  } catch (e) { avisar(e.message, true); }
}

async function baixar(corpo, alvo) {
  try {
    const r = await api('POST', '/api/library', corpo);
    if (r.job) {
      S.jobAlvo[r.job.id] = alvo; S.jobCorpo[r.job.id] = corpo;
      if (!S.jobs.some(j => j.id === r.job.id)) S.jobs = S.jobs.concat(r.job);
      if (!corpo.play) avisar(I18N.t('download.started'));
      else if (!r.streaming) avisar(I18N.t('download.startedPlay'));
    } else if (r.item && !corpo.play) avisar(I18N.t('download.alreadySaved'));
    if (S.busca) desenharBusca();
    desenharPrateleira();
  } catch (e) { avisar(e.message, true); }
}

function executar(acao, ctx) {
  if (ctx.tipo === 'disco') {

    else if (acao === 'rapido' || acao === 'semRapido') marcarRapido(it, acao === 'rapido');
    else if (acao === 'apagar') apagar(it);
    else if (acao === 'seguir' || acao === 'fila') enfileirar({ id: it.id }, acao === 'seguir', it.title, null);
    else if (acao === 'youtube') abrirYoutube(it.youtube_id);

/* celular: puxar as opcoes para baixo fecha (longe o bastante ou num puxao rapido); perto, voltam */
(() => {
  const m = $('#menu');
  const noTopo = () => m.classList.toggle('no-topo', m.scrollTop <= 0);
  m.addEventListener('scroll', noTopo, { passive: true });
  let g = null, arrastouEm = 0;
  m.addEventListener('pointerdown', e => {
    noTopo();
    if (e.pointerType !== 'touch' || !m.classList.contains('folha') || m.scrollTop > 0) return;
    g = { id: e.pointerId, y0: e.clientY, x0: e.clientX, d: 0, v: 0, yAnt: e.clientY, tAnt: e.timeStamp, ativo: false };
  });
  m.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    const d = e.clientY - g.y0, dx = e.clientX - g.x0;
    if (!g.ativo) {
      if (Math.abs(d) < 6 && Math.abs(dx) < 6) return;   // ainda nao da para saber o gesto
      if (d <= 0 || Math.abs(dx) > Math.abs(d)) { g = null; return; }
      g.ativo = true; m.classList.add('puxando');
    }
    if (e.timeStamp > g.tAnt) { g.v = (e.clientY - g.yAnt) / (e.timeStamp - g.tAnt); g.yAnt = e.clientY; g.tAnt = e.timeStamp; }
    g.d = Math.max(0, d);
    m.style.transform = `translateY(${g.d}px)`;
  });
  const soltar = e => {
    if (!g || e.pointerId !== g.id) return;
    const { ativo, d, v } = g;
    g = null;
    if (!ativo) return;
    arrastouEm = Date.now();
    m.classList.remove('puxando');
    if (d > Math.min(120, m.offsetHeight * .3) || (d > 30 && v > .5)) {
      m.style.transform = 'translateY(100%)';   // desce o resto e fecha
      setTimeout(() => { fecharMenu(false); m.style.transform = ''; }, 190);
    } else m.style.transform = '';
  };
  m.addEventListener('pointerup', soltar);
  m.addEventListener('pointercancel', soltar);
  // como no palco: a puxada rapida sem o touchmove cancelado vira fling e engole o primeiro toque depois
  m.addEventListener('touchmove', e => { if (g && g.ativo && e.cancelable) e.preventDefault(); }, { passive: false });
  // soltar depois de puxar nao aperta a opcao que estava embaixo do dedo
  m.addEventListener('click', e => { if (Date.now() - arrastouEm < 400) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();

/* o que nao esta na prateleira ja comeca a baixar quando entra na fila; na vez dele toca do arquivo,
   ou pelo stream se o download ainda nao chegou */
async function enfileirar(corpo, seguir, titulo, alvo) {
  try {
    const r = await api('POST', '/api/queue', { ...corpo, next: seguir });
    if (r.job) {
      if (alvo) S.jobAlvo[r.job.id] = alvo;
      if (!S.jobs.some(j => j.id === r.job.id)) S.jobs = S.jobs.concat(r.job);
    }
    // com nada no prato o servidor ja toca o que entrou
    if (r.playing) avisar(I18N.t('queue.playing', { title: titulo }));
    else avisar(I18N.t(seguir ? 'queue.playsNext' : 'queue.added', { title: titulo }), false, { rotulo: I18N.t('app.open'), fn: abrirFila });
    if (S.busca) atualizarResultados();
  } catch (e) { avisar(e.message, true); }
}

function estadoEntrada(x) {

  const j = x.job && S.jobs.find(jb => jb.id === x.job);

/* a capa do disco da maleta: o disco e a capa quadrada da largura dele (300 px de tela, 900 no celular de teste), entao a
   miniatura vem da maior que o YouTube tiver (a mqdefault da fila tem 320 px e a capa quadrada dela 180: borrava), e
   sem as faixas que o YouTube poe em volta (com elas a capa quadrada saia
   esticada): as Art Tracks (o video e so a capa do album) vem com uma faixa de uma cor de cada lado, e a sddefault e a
   hqdefault ainda com as pretas em cima e embaixo. Uma copia pequena com CORS (o i.ytimg.com manda) mede as faixas, o
   object-view-box corta nelas, e o tema mostra o quadrado do meio */
const CAPAS = new Map();   // id do video -> { src, corte }, ou as imagens esperando a medida
function capaInteira(img) {
  const m = /^https:\/\/i\.ytimg\.com\/vi\/([^/]+)\//.exec(img.src);
  if (!m) return;
  const id = m[1], ja = CAPAS.get(id);
  if (ja && !Array.isArray(ja)) return aplicaCapa(img, ja);
  if (ja) return void ja.push(img);
  const espera = [img];
  CAPAS.set(id, espera);
  const tenta = ([q, ...resto]) => {
    const p = new Image();
    p.crossOrigin = 'anonymous'; p.referrerPolicy = 'no-referrer';
    p.onload = () => {
      if (p.naturalWidth <= 120 && resto.length) return tenta(resto);   // o cinza do YouTube no lugar da que nao existe
      let corte = '';
      try { corte = medeFaixas(p); } catch { /* sem CORS a copia nao se le: fica sem cortar */ }
      const capa = { src: p.src, corte };
      CAPAS.set(id, capa);
      for (const i of espera) aplicaCapa(i, capa);
    };
    p.onerror = () => { if (resto.length) tenta(resto); else CAPAS.set(id, { src: '', corte: '' }); };
    p.src = `https://i.ytimg.com/vi/${id}/${q}.jpg`;
  };
  tenta(['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault']);
}
function aplicaCapa(img, capa) {
  if (capa.src && img.src !== capa.src) {
    img.crossOrigin = 'anonymous';   // a mesma copia da medida, sem baixar de novo
    img.src = capa.src;
  }
  img.style.objectViewBox = capa.corte;
}
function medeFaixas(p) {
  const w = 160, h = Math.round(w * p.naturalHeight / p.naturalWidth), c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(p, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, ponto = (x, y) => (y * w + x) * 4;
  // faixa e a linha (ou a coluna) inteira da cor do meio da beira daquele lado, com a folga do JPEG
  const igual = (i, ref) => Math.abs(d[i] - d[ref]) + Math.abs(d[i + 1] - d[ref + 1]) + Math.abs(d[i + 2] - d[ref + 2]) <= 36;
  const linha = (y, ref) => { for (let x = 0; x < w; x += 2) if (!igual(ponto(x, y), ref)) return false; return true; };
  let t = 0, b = 0;
  while (t < h / 2 && linha(t, ponto(w >> 1, 0))) t++;
  while (b < h / 2 && linha(h - 1 - b, ponto(w >> 1, h - 1))) b++;
  if (t < h * .04) t = 0;
  if (b < h * .04) b = 0;
  if (t + b > h * .8) t = b = 0;
  const meio = (t + h - b) >> 1;
  const coluna = (x, ref) => { for (let y = t; y < h - b; y += 2) if (!igual(ponto(x, y), ref)) return false; return true; };
  let e = 0, r = 0;
  while (e < w / 2 && coluna(e, ponto(0, meio))) e++;
  while (r < w / 2 && coluna(w - 1 - r, ponto(w - 1, meio))) r++;
  if (e < w * .06 || r < w * .06 || e + r > w * .8) e = r = 0;
  const pc = (n, de) => n ? `${((n + 1) / de * 100).toFixed(2)}%` : '0';
  return t || b || e || r ? `inset(${pc(t, h)} ${pc(r, w)} ${pc(b, h)} ${pc(e, w)})` : '';
}
/* na maleta do celular cada disco segue a parede da caixa na altura dele: o lugar em --i e o total em --n */

/* na etiqueta da maleta o nome da musica vai em cima e o artista embaixo (23/10, a variante B
   entre tres mocks): o titulo do YouTube "Artista - Musica" se parte no " - " (com o canal do lado direito, e "Musica -
   Artista", como no funk), sem o "(Official Video)" e parecidos; sem " - ", o artista e o canal, sem o " - Topic" */
const TITULO_LIXO = /\s*[\(\[](official( music)? video|official audio|audio|video ?clip|clipe oficial|lyric video|lyrics?|letra|visualizer|videoclipe|v[ií]deo oficial)[\)\]]/ig;
function partirTitulo(x) {
  const norm = v => (v || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
  const canal = (x.channel || '').replace(/ - Topic$/, '');
  // (07/11, pedido do dono) o disco que o servidor achou no YouTube Music traz o nome da musica e o artista de la
  if (x.ytm_titulo) return { musica: x.ytm_titulo, artista: x.ytm_artista || canal };
  let musica = (x.title || I18N.t('shelf.untitled')).replace(TITULO_LIXO, '').trim(), artista = canal;
  const i = musica.indexOf(' - ');
  if (i > 0) {
    let a = musica.slice(0, i).trim(), m = musica.slice(i + 3).trim();
    if (norm(canal) && norm(m).includes(norm(canal)) && !norm(a).includes(norm(canal))) [a, m] = [m, a];
    musica = m; artista = a;
  }
  return { musica: musica || x.title, artista };
}

/* servidor com o Automatico (o 8799 antigo nao tem ate reiniciar): sem ele, a chave some */
const temAuto = () => !!(S.state && 'auto' in S.state);
/* o salvar do disco no prato, na linha do canal (o mostraSalvar: a parecida do Automatico, que sem ele toca so pelo
   stream e nao fica, e o que ainda baixa ou acabou de chegar); o ✓ tira de novo, como na busca */
function desenharAuto() {
  const tr = S.state && S.state.track, b = $('#b-guardar');

  if (b.hidden) return;

}

});
function desenharFila() {
  lembrarChegadas();   // (#53) antes do salvar do prato e da fila: o que os downloads trouxeram
  desenharAuto();  // a linha do prato muda com o disco, os downloads e a prateleira, como a fila
  desenharMesa();  // a deixa e a primeira da fila
  const fila = temFila() ? S.state.queue : [];
  const auto = temAuto(), ligado = auto && S.state.auto;
  const fim = $('#b-parecidas');
  fim.hidden = !auto;
  fim.setAttribute('aria-checked', ligado ? 'true' : 'false');

  // (#53) e o salvar de cada uma: a parecida salva pelo ⊕ baixa num download que nao e o da entrada
  const sig = (S.state ? '' : 'sem-estado|') + fila.map(x => [x.qid, x.title, estadoEntrada(x), mostraSalvar(x) && estadoDisco(x).join(':')].join('/')).join('|');
  if (sig === S.filaSig || S.arrastandoFila) return;
  S.filaSig = sig;
  // (07/11, pedido do dono) so com o estado na mao: no F5, antes dele chegar, a fila parecia vazia e o aviso aparecia no
  // meio da maleta ainda esticada (a prateleira sem discos), por cima de onde a prateleira fica
  $('#fila-vazia').hidden = !!fila.length || !S.state;
  // o foco (teclado) volta para o mesmo botao da mesma entrada depois de remontar
  const ativo = document.activeElement, li = ativo && ativo.closest && ativo.closest('.item-fila');
  const foco = li ? { qid: li.dataset.qid, role: ativo.dataset.role, lista: li.parentElement } : null;
  for (const sec of document.querySelectorAll('.fila')) {
    // o A seguir so aparece com fila: a chave do Tocar parecidas mora embaixo dos botoes do toca-discos
    // na mesa a maleta fica aberta mesmo vazia, com o aviso dentro
    sec.hidden = !fila.length && !(MESA.montada && sec.classList.contains('fila-parede'));
    sec.querySelector('.conta').textContent = !fila.length ? '' : I18N.tp('queue.count', fila.length);
    const limpar = sec.querySelector('.limpar-fila');   // so a do computador tem
    if (limpar) limpar.hidden = !fila.length;
    sec.querySelector('.lista-fila').replaceChildren(...fila.map(liFila));

  if (foco) {
    const alvo = [...foco.lista.children].find(x => x.dataset.qid === foco.qid);

}
async function moverNaFila(qid, to) {

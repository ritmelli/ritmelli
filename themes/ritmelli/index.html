<!-- i18n -->
<script>
/* I18N: os textos da interface na lingua de quem usa (o plano esta no I18N.md do ritmelli-server). Os textos moram em
   i18n/i18n_<lingua>.properties, e o servidor (i18n.py) poe no lugar do comentario i18n acima os da lingua escolhida e
   os do ingles, a reserva para chave que falte. Na marcacao: data-i18n="chave" (o texto) e data-i18n-title,
   data-i18n-aria-label e data-i18n-placeholder (os atributos), aplicados no comeco do script principal. No JS:
   I18N.t('chave', { param }) e, com plural, I18N.tp('chave', n) (as chaves chave.one e chave.other). O nome curto t
   nao serve: ele ja e variavel local em mais de cem funcoes daqui. O texto com negrito ou codigo dentro da frase
   (<b>...</b>, <code>...</code>) vai pelo data-i18n ou pelo I18N.rico(elemento, 'chave', { param }); na marcacao, o
   filho com data-i18n-lugar="nome" entra no {nome} da frase (a URL do celular, que o JS preenche depois) */
const I18N = (() => {
  const d = window.I18N_DADOS || { lingua: 'pt_BR', textos: {}, reserva: {} };
  const lang = d.lingua.replace('_', '-');
  const tem = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const existe = k => tem(d.textos, k) || tem(d.reserva, k);
  const avisadas = new Set();
  function bruto(chave) {
    if (tem(d.textos, chave)) return d.textos[chave];
    if (tem(d.reserva, chave)) return d.reserva[chave];
    // a chave que falta nas duas linguas aparece na tela como a propria chave: o erro fica a vista
    if (!avisadas.has(chave)) { avisadas.add(chave); console.warn(`i18n: missing key "${chave}"`); }
    return chave;
  }
  function t(chave, params) {
    const s = bruto(chave);
    return params ? s.replace(/\{(\w+)\}/g, (m, k) => (tem(params, k) ? String(params[k]) : m)) : s;
  }
  // o singular so para 1, nas duas linguas que temos: o Intl.PluralRules poe o 0 no singular em portugues, e o Ritmelli
  // sempre escreveu "0 discos". Uma lingua com outras regras pede o plural.select aqui
  function tp(chave, n, params) {
    const k = `${chave}.${n === 1 ? 'one' : 'other'}`;
    return t(existe(k) ? k : `${chave}.other`, { n: n.toLocaleString(lang), ...params });
  }
  // numero com as casas e a virgula (ou o ponto) da lingua
  const num = (v, casas) => v.toLocaleString(lang, { minimumFractionDigits: casas, maximumFractionDigits: casas });
  // so <b> e <code> viram elemento, e sempre com textContent: nada dos arquivos passa por innerHTML. Um param que e
  // um elemento (Node) entra inteiro no lugar do {param}
  function rico(e, chave, params = {}) {
    const troca = s => s.replace(/\{(\w+)\}/g, (m, k) => (tem(params, k) && !(params[k] instanceof Node) ? String(params[k]) : m));
    e.replaceChildren(...bruto(chave).split(/(<(?:b|code)>[\s\S]*?<\/(?:b|code)>|\{\w+\})/).filter(Boolean).map(p => {
      const tag = p.match(/^<(b|code)>([\s\S]*)<\/\1>$/);
      if (tag) { const x = document.createElement(tag[1]); x.textContent = troca(tag[2]); return x; }
      const k = (p.match(/^\{(\w+)\}$/) || [])[1];
      return k && tem(params, k) && params[k] instanceof Node ? params[k] : document.createTextNode(troca(p));
    }));
  }
  const ATRIBUTOS = ['title', 'aria-label', 'placeholder'];
  function aplica(raiz = document) {
    for (const e of raiz.querySelectorAll('[data-i18n]')) {
      const lugares = {};
      for (const f of e.querySelectorAll('[data-i18n-lugar]')) lugares[f.dataset.i18nLugar] = f;
      rico(e, e.dataset.i18n, lugares);
    }
    for (const a of ATRIBUTOS) {
      for (const e of raiz.querySelectorAll(`[data-i18n-${a}]`)) e.setAttribute(a, t(e.getAttribute(`data-i18n-${a}`)));
    }
  }
  document.documentElement.lang = lang;
  // o texto da lingua de reserva (o ingles): a reserva do que tem um desenho por palavra (os botoes do Locutor)
  const reserva = k => (tem(d.reserva, k) ? d.reserva[k] : undefined);
  return { lingua: d.lingua, lang, tem: existe, t, tp, num, rico, aplica, reserva };
})();
</script>

<script>
'use strict';
// os textos da marcacao na lingua de quem usa (o I18N, no <head>), antes de qualquer coisa ler ou medir a tela; a
// pagina so aparece depois, e aparece mesmo se der erro aqui
try { I18N.aplica(); } finally { document.documentElement.classList.add('i18n-ok'); }
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduz = matchMedia('(prefers-reduced-motion: reduce)');
/* o palco da mesa (pedido dele, 06/11): a mesa monta sempre num tamanho fixo, PALCO_W x PALCO_H (a proporcao do mock
   B), e a pagina escala tudo para caber na janela, centrado; o que a janela tem de outra proporcao vira faixa de parede.
   Quando da, a escala cai num numero inteiro de pixels da tela por celula de 2 px (no notebook dele, 3x3), para o
   pixel art ficar nitido e sem costura (o ajustarPalco diz quanto pode passar ou perder). O getBoundingClientRect vem escalado; o rectP devolve a
   caixa no tamanho do palco, com a origem no canto dele */
const PALCO_W = 1920, PALCO_H = 1026, PALCO_PE = 14, PALCO = { k: 1, w: 0, h: 0, x: 0, y: 0 };
// PALCO_PE: a madeira embaixo do pe do feltro (a barra de cima tem 15 no palco; o mock ~22 em 1080). So no encaixe e
// no centramento: a caixa do palco (layout, --palco-h, fonte, cabos com y1 = PALCO_H) segue com PALCO_H
function ajustarPalco() {
  const st = document.documentElement.style;
  if (!document.body.classList.contains('mesa-dj')) {
    PALCO.k = 1; PALCO.x = PALCO.y = 0;
    for (const p of ['--palco-k', '--palco-w', '--palco-h', '--palco-x', '--palco-y']) st.removeProperty(p);
    return;
  }
  const W = innerWidth, H = innerHeight, d = devicePixelRatio || 1, enc = Math.min(W / PALCO_W, H / PALCO_H);
  const encPe = Math.min(W / PALCO_W, H / (PALCO_H + PALCO_PE));
  // a celula num numero inteiro de pixels da tela: o inteiro de cima, se o palco passa no maximo 1,2% da janela (corta
  // so a folga da beira; a janela do notebook dele tem 768 de altura, e 0,7485 punha 2 costuras na onda, pedido dele);
  // senao o de baixo, perdendo no maximo 10% do tamanho; senao o encaixe exato. O de baixo e o encaixe contam a folga
  // do pe (PALCO_PE): na janela maximizada a pedaleira colava no pe da janela (revisao da r12)
  const x2 = 2 * enc * d, cima = Math.ceil(x2 - 1e-6), x2p = 2 * encPe * d, baixo = Math.floor(x2p + 1e-6);
  const k = cima >= 1 && cima / x2 <= 1.012 ? cima / (2 * d) : baixo >= 1 && baixo / x2p >= .9 ? baixo / (2 * d) : encPe;
  // centrado, com a origem num pixel inteiro da tela; (r16) 1 celula para a esquerda: a sombra de 2 celulas das pecas
  // cai a direita e a madeira visivel da beira direita ficava 3 css menor que a da esquerda (a madeira anda junto)
  const px_ = v => Math.round(v * d) / d;
  const pe = Math.max(0, Math.min(PALCO_PE, H / k - PALCO_H));
  PALCO.k = k; PALCO.w = PALCO_W; PALCO.h = PALCO_H; PALCO.x = px_((W - PALCO_W * k) / 2 - 2 * k); PALCO.y = px_((H - (PALCO_H + pe) * k) / 2);
  st.setProperty('--palco-k', String(k)); st.setProperty('--palco-w', PALCO_W + 'px'); st.setProperty('--palco-h', PALCO_H + 'px');
  st.setProperty('--palco-x', PALCO.x + 'px'); st.setProperty('--palco-y', PALCO.y + 'px');
}
addEventListener('resize', ajustarPalco);
function rectP(e) {
  const r = e.getBoundingClientRect(), k = PALCO.k;
  if (k === 1 && !PALCO.x && !PALCO.y) return r;
  const left = (r.left - PALCO.x) / k, top = (r.top - PALCO.y) / k, width = r.width / k, height = r.height / k;
  return { left, top, width, height, right: left + width, bottom: top + height, x: left, y: top };
}
// a largura do palco (ou da janela, sem a mesa), para prender o que abre por cima dentro dele
const larguraPalco = () => PALCO.k === 1 ? innerWidth : PALCO.w;

const S = {
  state: null, lib: [], jobs: [], pos: 0, levels: { mic: 0, track: 0, out: 0 },
  online: null, jaConectou: false, desligado: false,
  pareando: false,        // celular sem pareamento: o #tela-parear pede o codigo do PC
  caps: null,             // o que esta pagina pode, pelo servidor ({papel, rotas}); null ate ele dizer
  atualizando: null,      // a versao que o instalador esta pondo: a pagina recarrega quando o Ritmelli voltar
  busca: null,            // null = prateleira; {q, link, itens, carregando, erro}
  buscaSeq: 0,
  jobAlvo: {},            // id do job -> youtube_id
  jobCorpo: {},           // id do job -> corpo do POST, para tentar de novo
  vistoFora: new Set(),   // (#53) os discos (id do YouTube ou link) que o prato ou a fila mostrou fora da prateleira
  libOk: false,           // (#53) a prateleira ja chegou do servidor
  chegou: new Map(),      // (#53) o que cada download desta pagina trouxe: alvo -> id do item na prateleira
  segurando: {},          // slider sendo mexido: chave -> instante
  arrastandoSeek: false,
  rotuloId: undefined,
  efeitos: null,          // lista de /api/effects, na ordem de exibicao
  erroEfeitos: null,
  gaveta: false,          // gaveta de efeitos aberta (so conta no computador)
  palco: false,           // toca-discos aberto por cima da prateleira (so no celular)
};
const SEM_EFEITO = 'nenhum';
/* a mesa de DJ (computador largo): lado = onde esta o deck no ar ('a' na esquerda, 'b' na direita); o deck da deixa
   fica com a proxima da fila; antes = o disco que saiu na ultima troca de lado (ele segue no deck dele enquanto soa
   na passagem); bpm = o andamento medido de cada disco que passou pela fila */
const MESA = { montada: null, lado: 'a', idAr: null, trAr: null, antes: null, deixa: null, bpm: new Map(), trocaT: 0 };

const SITUACAO = { idle: I18N.t('deck.status.idle'), buffering: I18N.t('deck.status.buffering'), playing: I18N.t('deck.status.playing'),
                   paused: I18N.t('deck.status.paused'), ended: I18N.t('deck.status.ended') };
function semCaminho(t) { return String(t || '').replace(/[A-Za-z]:\\(?:[^\\\s]+\\)+([^\\\s]+)/g, '$1'); }
/* a mensagem do servidor ({key, params, text}, o formato no API.md) na lingua de quem usa: a chave pelos arquivos do
   tema, com os params (o param que e outra mensagem tambem se traduz); sem a chave, ou com uma que o tema nao tem, o
   texto em ingles dela. O caminho do Windows sai: o nome do arquivo basta */
function textoMsg(m) {
  if (!m) return '';
  if (typeof m === 'string') return semCaminho(m);
  if (!m.key || !I18N.tem(m.key)) return semCaminho(m.text);
  const p = {};
  for (const [k, v] of Object.entries(m.params || {})) p[k] = v && typeof v === 'object' ? textoMsg(v) : typeof v === 'string' ? semCaminho(v) : v;
  return I18N.t(m.key, p);
}
/* o detalhe tecnico de uma mensagem (o motivo do yt-dlp, na busca e no download), para a letra pequena */
function detalheMsg(m) {
  const r = m && m.params && m.params.reason;
  return r ? textoMsg(r) : '';
}
function fmt(s) {
  if (s == null || !isFinite(s)) return '0:00';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`;
}

// sobe a cada pareamento aceito: o 401 de um pedido feito antes dele (que chega atrasado) nao volta a tela do codigo
let geracaoPareamento = 0;
async function api(method, path, data) {
  const geracao = geracaoPareamento;
  let r;
  try {
    r = await TRANSPORTE.pedir(method, path, data);
  } catch (e) {
    // status 0: nenhuma resposta (a busca testa o status, e nao o texto)
    const x = new Error(I18N.t('error.noResponse')); x.status = 0;
    throw x;
  }
  const j = r.json;
  if (!r.ok || (j && j.ok === false)) {
    // o 401 do pareamento traz o caps de antes de parear: a tela do codigo, sem os controles do PC
    if (r.status === 401 && j && j.parear && geracao === geracaoPareamento) pedirPareamento(j.desconectado, j.caps);
    // a mensagem do servidor ja traduzida; ela mesma segue no erro, para quem decide pelo tipo (a busca)
    const m = j && j.error;
    const e = new Error(m ? textoMsg(m) : I18N.t('error.generic', { status: r.status }));
    e.status = r.status; e.msg = m || null;
    throw e;
  }
  return j;
}

/* ---------- capas ---------- */
const PALETAS = [
  ['#F3A73C', '#2A1812', '#23382E'],
  ['#23382E', '#EEE3CF', '#F3A73C'],
  ['#5E1C25', '#EEE3CF', '#F3A73C'],
  ['#CFC7B8', '#2A1812', '#5E1C25'],
  ['#1E4A52', '#EEE3CF', '#F3A73C'],
];
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function capaGerada(it, curta) {
  const h = hash(it.id || it.title);
  const [bg, fg, dot] = PALETAS[h % PALETAS.length];
  const d = el('div', 'capa-gerada');
  d.style.setProperty('--bg', bg); d.style.setProperty('--fg', fg); d.style.setProperty('--dot', dot);
  const titulo = (it.title || I18N.t('shelf.untitled')).trim();
  if (!curta) {
    // bolas no alto da capa: uma cheia grande, um aro e uma pequena, em posicoes que variam por som
    const g = 28 + (h >> 4) % 10;
    const gx = 50 + (h >> 8) % (92 - 50 - g + 1), gy = 8 + (h >> 12) % 8;
    const b1 = el('span', 'bola'); b1.style.cssText = `width:${g}cqw;height:${g}cqw;left:${gx}cqw;top:${gy}cqw`;
    // o aro cruza a bola cheia, como um disco saindo da capa
    const a = Math.round(g * .82);
    const ax = gx - a * .55, ay = gy + g * .38;
    const b2 = el('span', 'bola aro'); b2.style.cssText = `width:${a}cqw;height:${a}cqw;left:${ax}cqw;top:${ay}cqw`;
    d.append(b1, b2);
  }
  d.append(el('span', 't', curta ? titulo.charAt(0).toUpperCase() : titulo));
  return d;
}
function arte(it, curta) {
  if (!it.thumb) return capaGerada(it, curta);
  const img = new Image();
  img.alt = ''; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.src = it.thumb;
  img.addEventListener('error', () => img.replaceWith(capaGerada(it, curta)), { once: true });
  return img;
}

/* ---------- braco: o angulo segue o raio do sulco ---------- */
// o prato e 4% menor que o lugar dele, em volta do mesmo centro (a moldura grossa do toca-discos, 19/10): o sulco tambem.
// (#50) A agulha e a ponta da cabeca, e nao um ponto no eixo do tubo: no dev/pecas.py a cabeca (8,8 cqw) dobra 24 graus
// a 53,5 cqw do pivo, entao a ponta fica a 61,6 cqw dele (L) e 3,3 graus a frente do tubo (desvio). Com o ponto no eixo,
// a 62 cqw, a agulha comecava a faixa em 84% do raio, para dentro do disco
const CABECA = { dobra: 53.5, comp: 8.8, ang: 24 * Math.PI / 180 };
const G = { cx: 40, cy: 40, R: (36 - 2.6) * .96, px: 88, py: 12,
            L: Math.hypot(CABECA.comp * Math.sin(CABECA.ang), CABECA.dobra + CABECA.comp * Math.cos(CABECA.ang)),
            desvio: Math.atan2(CABECA.comp * Math.sin(CABECA.ang), CABECA.dobra + CABECA.comp * Math.cos(CABECA.ang)) };
// onde a ponta esta no disco com o braco no angulo th (radianos), em fracao do raio
const pontaNoDisco = th => Math.hypot(G.px - G.L * Math.sin(th + G.desvio) - G.cx, G.py + G.L * Math.cos(th + G.desvio) - G.cy) / G.R;
// (#50) a faixa comeca com a agulha na borda, onde ela entra num disco de verdade (a ponta a 95% do raio: com a largura
// da cabeca, rente a borda)
const BRACO_INICIO = 0.95;
// o ponto no eixo do tubo, a 62 cqw do pivo: a conta do sulco ate o #50. O fim do curso segue nela
const EIXO_L = 62;
const eixoNoDisco = th => Math.hypot(G.px - EIXO_L * Math.sin(th) - G.cx, G.py + EIXO_L * Math.cos(th) - G.cy) / G.R;
// (07/11, pedido do dono) o fim do curso na ultima ranhura: o angulo em que o ponto no eixo fica a 50% do raio (com 41% a
// cabeca do braco parava em cima do selo). (#50) O mesmo angulo de antes, pela mesma busca: so o comeco mudou
function anguloDoEixo(f) {
  const alvo = G.R * f;
  let a = 10, b = 70;
  for (let i = 0; i < 26; i++) {
    const m = (a + b) / 2, r = m * Math.PI / 180;
    if (Math.hypot(G.px - EIXO_L * Math.sin(r) - G.cx, G.py + EIXO_L * Math.cos(r) - G.cy) > alvo) a = m; else b = m;
  }
  return (a + b) / 2;
}
const BRACO_FIM_ANG = anguloDoEixo(0.50);
const BRACO_FIM = pontaNoDisco(BRACO_FIM_ANG * Math.PI / 180);   // a ponta, no fim, a uns 40% do raio
function anguloPara(p) {
  if (p >= 1) return BRACO_FIM_ANG;
  const alvo = BRACO_INICIO - p * (BRACO_INICIO - BRACO_FIM);
  // ate 55 graus a ponta so entra no disco (ela passa mais perto do centro a uns 57 e sai de novo)
  let a = 10, b = 55;
  for (let i = 0; i < 26; i++) {
    const m = (a + b) / 2;
    if (pontaNoDisco(m * Math.PI / 180) > alvo) a = m; else b = m;
  }
  return (a + b) / 2;
}
const BRACO_INICIO_ANG = anguloPara(0);
// o desenho do braco para o angulo (as ANGULOS do dev/pecas.py): o descanso e seis no curso do disco, de 28 a 48 graus,
// de 4 em 4, e o tema gira no maximo 2 graus em cima do desenho. O de 28 (#50) e o do comeco da faixa, a uns 27 graus
const desenhoDoBraco = ang => ang < 15 ? 'repouso' : ang < 30 ? 'inicio' : ang < 34 ? 'a' : ang < 38 ? 'b' : ang < 42 ? 'c' : ang < 46 ? 'd' : 'e';
function posAtual() { return S.pos; }
function moverBraco() {
  const s = S.state;
  // o braco de pixel descansa reto: a 3 graus o degrau do tubo vira dente solto (o descanso anda junto)
  let ang = 0;
  if (s && s.track && s.status !== 'ended' && s.status !== 'idle') {
    const dur = s.duration || s.track.duration;
    const p = dur ? clamp(posAtual() / dur, 0, 1) : 0;
    ang = anguloPara(p);
  }
  mudar($('#braco'), '--ang', ang.toFixed(1) + 'deg');
  desenhoBraco(ang);
}
/* o braco e um desenho em pixel ja inclinado (dev/pecas.py), um por faixa de angulo (o desenhoDoBraco()). Na troca de
   faixa o braco esta andando (o tema gira em 1 s): o desenho novo espera ele cobrir uns 45% do caminho, para nenhum dos
   dois girar longe do seu angulo */
let faixaBraco = null, trocaBraco = 0;
function desenhoBraco(ang) {
  const f = desenhoDoBraco(ang);
  if (f === faixaBraco) return;
  const imediato = faixaBraco === null || matchMedia('(prefers-reduced-motion: reduce)').matches;
  faixaBraco = f;
  clearTimeout(trocaBraco);
  if (imediato) $('#braco').dataset.desenho = f;
  else trocaBraco = setTimeout(() => { $('#braco').dataset.desenho = f; }, 200);
}

/* ---------- prato e faixa ---------- */
const IC_TOCAR = '<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>';
const IC_PAUSAR = '<rect x="6" y="5" width="4.2" height="14" rx="1" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1" fill="currentColor"/>';
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>';
const IC_MIC = MIC_SVG + '</svg>';
const IC_MIC_CORTADO = MIC_SVG + '<path d="M4 4l16 16" stroke-width="2.2"/></svg>';

function desenharFaixa() {
  const s = S.state; if (!s) return;
  const tr = s.track, st = s.status;
  document.body.dataset.status = st;
  $('#prato').classList.toggle('com-disco', !!tr);
  const id = tr ? tr.id + '|' + (tr.thumb || '') : null;
  if (id !== S.rotuloId) {
    S.rotuloId = id;
    $('#rotulo').replaceChildren(tr ? arte(tr, true) : '');
    $('#mini-rotulo').replaceChildren(tr ? arte(tr, true) : '');
  }
  porTitulo(tr ? tr.title : I18N.t('deck.noDisc'), !!tr);
  $('#canal-faixa').textContent = tr ? (tr.channel || I18N.t('deck.noChannel')) : dicaPrato();
  // com error o leitor para e o servidor marca ended: nao e "chegou ao fim"
  $('#situacao').textContent = s.error && st !== 'playing' ? I18N.t('deck.status.error') : (SITUACAO[st] || st);
  const lf = $('#lamp-faixa');
  lf.className = 'lampada' + (s.error && st !== 'playing' ? ' alerta' : st === 'playing' ? ' acesa' : st === 'buffering' ? ' acesa piscando' : '');

  const dur = s.duration || (tr && tr.duration) || 0;
  const sk = $('#seek');
  sk.disabled = !tr || !dur;
  sk.max = dur || 0;
  $('#t-dur').textContent = fmt(dur);

  // som rapido tocando por cima: o botao e Pausar mesmo sem disco no prato ou com ele parado, e cala os sons
  // (sem disco no prato o pausar ficava apagado e nao dava para parar o som rapido)
  const sobre = !!(s.por_cima && s.por_cima.length);
  document.body.toggleAttribute('data-sobre', sobre);   // o pixel do pausar no celular sai do CSS
  let rot = I18N.t('deck.play'), ic = IC_TOCAR;
  if (st === 'playing' || st === 'buffering' || sobre) { rot = I18N.t('deck.pause'); ic = IC_PAUSAR; }
  else if (st === 'paused') rot = I18N.t('deck.resume');
  else if (st === 'ended') rot = I18N.t('deck.playAgain');
  // o botao grande do transporte e o da barra de baixo do celular fazem o mesmo
  for (const [b, i] of [['#b-tocar', '#ic-tocar'], ['#mini-tocar', '#ic-mini']]) {
    $(b).disabled = !tr && !sobre; $(b).setAttribute('aria-label', rot); $(b).title = b === '#b-tocar' ? I18N.t('deck.withSpaceKey', { action: rot }) : rot; $(i).innerHTML = ic;
  }
  $('#mini-tit').textContent = tr ? tr.title : I18N.t('deck.noDisc');
  $('#mini-sub').textContent = !tr ? dicaMini()
    : s.error && st !== 'playing' ? I18N.t('deck.status.error') : (tr.channel || I18N.t('deck.noChannel'));
  rotularMini();
  desenharRapidos();

  // Anterior, Proxima e Aleatorio precisam do servidor que guarda historico e embaralha
  const transp = 'shuffle' in s;
  for (const b of ['#b-aleatorio', '#b-anterior', '#b-proxima']) $(b).classList.toggle('ausente', !transp);
  ligarChave($('#b-aleatorio'), transp && s.shuffle);
  $('#b-anterior').disabled = !transp || (!tr && !s.history);
  // fila vazia: o Proxima fica apagado e nao responde, como no YouTube Music
  $('#b-proxima').disabled = !transp || !(s.queue && s.queue.length);
  // a barra de baixo do computador tem os mesmos pulos
  for (const [m, b] of [['#mini-ant', '#b-anterior'], ['#mini-prox', '#b-proxima']]) { $(m).disabled = $(b).disabled; $(m).classList.toggle('ausente', !transp); }
  ligarChave($('#b-repetir'), s.loop);

  const ef = $('#erro-faixa');
  if (s.error) {
    $('#erro-faixa-txt').textContent = textoMsg(s.error);
    ef.hidden = false;
  } else ef.hidden = true;

  marcarPrateleira();
  desenharTempo();
  desenharMesa();
}

/* titulo do disco numa linha: se nao cabe, uma copia vem atras e o par desliza para a esquerda
   sem parar, com uma pausa no comeco de cada volta, como no YouTube Music */
const LETREIRO_PX_S = 36, LETREIRO_PAUSA_S = 2, LETREIRO_VAO = 48;
function porTitulo(txt, comDisco) {
  const h = $('#titulo-faixa');
  if (h._txt === txt) return;
  h._txt = txt;
  h.title = comDisco ? txt : '';
  const l = el('span', 'letreiro'); l.append(el('span', null, txt));
  h.replaceChildren(l);
  medirTitulo();
}
function medirTitulo() {
  const h = $('#titulo-faixa'), l = h.firstElementChild; if (!l) return;
  if (l._anim) { l._anim.cancel(); l._anim = null; }
  while (l.children.length > 1) l.lastChild.remove();
  h.classList.remove('rolando');
  if (reduz.matches || h.scrollWidth - h.clientWidth <= 1) return;
  const copia = l.firstElementChild.cloneNode(true); copia.setAttribute('aria-hidden', 'true');
  l.append(copia);
  h.classList.add('rolando');
  const passo = l.firstElementChild.offsetWidth + LETREIRO_VAO;
  const anda = passo / LETREIRO_PX_S, total = anda + LETREIRO_PAUSA_S;
  l._anim = l.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(0)', offset: LETREIRO_PAUSA_S / total },
    { transform: `translateX(${-passo}px)` }], { duration: total * 1000, iterations: Infinity, easing: 'linear' });
}
let medindoTitulo = 0;
new ResizeObserver(() => { cancelAnimationFrame(medindoTitulo); medindoTitulo = requestAnimationFrame(medirTitulo); }).observe($('#titulo-faixa'));
reduz.addEventListener('change', medirTitulo);
if (document.fonts) document.fonts.ready.then(medirTitulo);

/* texto sob "Nenhum disco no prato": com a prateleira vazia, aponta a busca */
function dicaPrato() {
  return S.lib.length ? I18N.t('deck.hint') : I18N.t('deck.hintEmpty');
}
/* o mesmo na barra de baixo, curto: com a prateleira vazia nao ha capa para tocar */
function dicaMini() { return S.lib.length ? I18N.t('deck.hintMini') : I18N.t('deck.hintMiniEmpty'); }
function rotularMini() {
  const rot = S.disco ? I18N.t('nav.backToShelf') : I18N.t('nav.openDeck');
  $('#mini-abrir').setAttribute('aria-label', `${rot}: ${$('#mini-tit').textContent}, ${$('#mini-sub').textContent}`);
  $('#mini-abrir').setAttribute('aria-expanded', S.disco || S.palco ? 'true' : 'false');
}

function desenharTempo() {
  const s = S.state; if (!s) return;
  const dur = s.duration || (s.track && s.track.duration) || 0;
  const sk = $('#seek');
  if (!S.arrastandoSeek) {
    const p = s.track ? clamp(S.pos, 0, dur || 0) : 0;
    sk.value = p;
    // so escreve o que mudou: o tick chega 15 vezes por segundo e cada escrita repinta
    mudar($('#t-pos'), 'textContent', fmt(p));
    mudar(sk, '--p', dur ? (p / dur * 100).toFixed(1) + '%' : '0%');
    mudar(sk, '--f', dur ? (p / dur).toFixed(4) : '0');   // a fracao: o ambar ate o centro do cursor de pixel
    mudar(sk, 'aria-valuetext', I18N.t('deck.timeOf', { pos: fmt(p), total: fmt(dur) }));
    mudar($('#mini-prog'), '--prog', dur ? (p / dur).toFixed(3) : '0');
    mudar($('#mini-tempo'), 'textContent', `${fmt(p)} / ${fmt(dur)}`);
  }

}
const escritos = new WeakMap();
function mudar(el, chave, v) {
  let m = escritos.get(el); if (!m) escritos.set(el, m = {});
  if (m[chave] === v) return;
  m[chave] = v;
  if (chave === 'textContent') el.textContent = v;
  else if (chave.startsWith('--')) el.style.setProperty(chave, v);
  else el.setAttribute(chave, v);
}

function ligarChave(b, on) {

  const l = b.querySelector('.lampada');
  if (l) l.className = 'lampada' + (on ? (b.id === 'b-cortar' ? ' alerta' : ' acesa') : '');

/* ---------- visor de DJ (computador): a onda do disco no prato correndo com o ponto de toque fixo no meio, a grade de
   batidas onde o motor mediu e, na passagem, a proxima entrando na metade de baixo em ciano, no mesmo tempo (os formatos
   no Engine.onda e no Engine.snapshot do servidor). Uma celula de 2 px por coluna da onda (40 ms): o visor mostra uns 7 s.
   Cada coluna e (grave, medio, agudo), empilhados do meio para fora como no Rekordbox (o agudo claro por dentro, o grave
   escuro por fora), e o que ja tocou sai mais apagado. Na passagem a tela se divide no trecho em que as duas soam: em
   cima o que sai, embaixo a que entra, cada uma no volume e no grave do plano (a troca de grave aparece), e com as
   batidas das duas na mesma coluna quando a passagem e no tempo; fora desse trecho a onda volta a ser uma so. Quando o
   que saiu some da tela, a que entrou passa do ciano para o ambar: virou o disco do prato.
   Desenho por quadro so com o disco tocando e o visor na tela (no celular, nem o temporizador roda); parado, so quando
   algo muda. A posicao anda pelo relogio da pagina entre um tick e outro e se corrige devagar em cada um, para a onda
   correr lisa. Com movimento reduzido a onda fica parada e o ponto de toque anda por ela, virando a pagina na beira ---------- */
const VDJ_CEL = 2, VDJ_PASSO = 1 / 30;   // 30 colunas por segundo, o VISOR_PASSO do engine (07/11)
const VDJ_AMP = Float32Array.from({ length: 256 }, (_, b) => b ? Math.pow(10, (b / 255 * 60 - 60) / 20) : 0);   // o byte e dB de -60 a 0
const vdjRgb = (r, g, b) => (255 << 24 | b << 16 | g << 8 | r) >>> 0;
const vdjMistura = (a, b, f) => a.map((x, i) => Math.round(x + (b[i] - x) * f));
const VDJ_FUNDO = [11, 8, 7];
// cada disco em tres tons (grave, medio, agudo): o do prato no ambar do tema, o que entra em ciano
const VDJ_AMBAR = [[168, 84, 22], [243, 167, 60], [255, 228, 170]], VDJ_CIANO = [[24, 104, 134], [58, 194, 222], [204, 246, 255]];
const VDJ_EIXO = vdjRgb(46, 34, 25), VDJ_JUNTAS = vdjRgb(16, 24, 26), VDJ_AGULHA = vdjRgb(255, 246, 228);
const VDJ_BATIDA = [255, 236, 204], VDJ_BATIDA_C = [210, 250, 255];
const vdjPc = matchMedia('(min-width: 900px)');
const V = { ondas: new Map(), base: null, ultPos: null, arrasto: null, ancora: null, img: null, px: null, raf: 0, sujo: true,
            chave: '', mapa: null, cor: new Map(), idVisto: null, posTroca: null, tTroca: 0 };

/* as cores de um disco em pixel pronto: os tres tons a frente do ponto de toque (vem) e atras dele (foi: mais escuros, e o
   agudo no ambar em vez do claro, que apagado ficava cinza), no volume dele na passagem em 8 degraus (o que sai vai
   escurecendo e a que entra acendendo: a onda segue inteira, para a que entra aparecer desde a primeira batida) */
function vdjPaleta(base, g = 1) {
  const n = Math.round(clamp(g, 0, 1) * 8), k = base.join('|') + '|' + n, f = .45 + .55 * n / 8;
  let p = V.cor.get(k);
  if (!p) {
    const luz = c => vdjMistura(VDJ_FUNDO, c, f);
    const foi = [vdjMistura(base[0], VDJ_FUNDO, .45), vdjMistura(base[1], VDJ_FUNDO, .5), vdjMistura(base[1], VDJ_FUNDO, .28)];
    V.cor.set(k, p = { vem: base.map(c => vdjRgb(...luz(c))), foi: foi.map(c => vdjRgb(...luz(c))) });
  }
  return p;
}
/* a posicao da proxima no tempo dela, u s de saida depois do t0 (sem o ini): a velocidade vb pelo sob, a volta em meio
   cosseno pela rampa, e 1 depois; antes do t0, o silencio que ela leva na frente anda a 1 */
function vdjFi(p, u) {
  if (u <= 0) return u;
  if (u <= p.sob) return p.vb * u;
  const r = u - p.sob, R = p.rampa;
  if (r <= R) return p.vb * p.sob + r + p.k * (r / 2 + R / (2 * Math.PI) * Math.sin(Math.PI * r / R));
  return p.vb * p.sob + R + p.k * R / 2 + (r - R);
}
function vdjFiInv(p, y) {
  if (y <= 0) return y;
  let a = 0, b = y / .9 + 1;
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (vdjFi(p, m) < y) a = m; else b = m; }
  return (a + b) / 2;
}
function vdjVel(p, u) {
  if (u <= 0) return 1;
  if (u <= p.sob) return p.vb;
  const r = u - p.sob;
  return r <= p.rampa ? 1 + p.k * (1 + Math.cos(Math.PI * r / p.rampa)) / 2 : 1;
}

/* a onda do disco id, pedida ao servidor uma vez (a incompleta, de novo a cada 2 s ou quando o estado avisa que uma
   ficou pronta); null enquanto nao chega */
function vdjOnda(id) {
  if (!id) return null;
  let w = V.ondas.get(id);
  const agora = performance.now(), versao = S.state && S.state.visor ? S.state.visor.ondas : 0;
  if (!w) {
    w = { id, cols: null, n: 0, passo: VDJ_PASSO, completa: false, quando: -1e9, versao: null, buscando: false };
    V.ondas.set(id, w);
    for (const k of V.ondas.keys()) { if (V.ondas.size <= 8) break; if (k !== id) V.ondas.delete(k); }
  }
  if (!w.buscando && !w.completa && (w.versao !== versao || agora - w.quando > 2000)) vdjBusca(w, versao);
  return w.cols ? w : null;
}
async function vdjBusca(w, versao) {
  w.buscando = true; w.versao = versao;
  try {
    const r = await TRANSPORTE.pedir('GET', '/api/onda/' + encodeURIComponent(w.id));
    if (r.ok) {
      const j = r.json, bin = atob(j.onda), cols = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) cols[i] = bin.charCodeAt(i);
      // a altura de cada byte: a amplitude pelo nivel forte do disco (o maior das tres faixas em 95% das colunas),
      // um pouco comprimida, para o disco baixo e o alto encherem o visor igual
      const hist = new Uint32Array(256);
      for (let i = 0; i < j.n; i++) hist[Math.max(cols[3 * i], cols[3 * i + 1], cols[3 * i + 2])]++;
      let b = 255;
      for (let soma = 0; b > 0 && soma < j.n * .05; b--) soma += hist[b];
      const ref = Math.max(VDJ_AMP[b], 1e-3);
      w.alt = Float32Array.from(VDJ_AMP, a => Math.pow(Math.min(1, a / ref), .8));
      Object.assign(w, { cols, n: j.n, passo: j.passo, completa: j.completa, resumo: null });
    }
  } catch (e) { /* sem a onda, o visor fica so com a linha do meio */ }
  w.buscando = false; w.quando = performance.now(); V.sujo = true;
}

/* a posicao do disco do prato agora, no tempo dele: a do ultimo tick andando pelo relogio na velocidade dele (1, ou a do
   plano logo depois de uma passagem), corrigida um quarto do erro a cada tick */
function vdjPos(agora) {
  const s = S.state, tr = s && s.track, id = tr ? tr.id : null, tocando = !!tr && s.status === 'playing';
  if (V.arrasto && V.arrasto.alvo != null) return V.arrasto.alvo;
  const b = V.base;
  if (S.pos !== V.ultPos || !b || b.id !== id || b.tocando !== tocando) {
    const pf = vdjPassagens().feita, velEm = q => pf ? vdjVel(pf, vdjFiInv(pf, q - pf.ini)) : 1;
    let p = S.pos, ajuste = 0;
    if (b && b.id === id && b.tocando && tocando && S.pos !== V.ultPos) {
      // (07/11, pedido do dono) o relogio anda liso: o erro se mede na hora em que o tick chegou (no quadro ele vinha ate
      // 16 ms atrasado), ate 15 ms e ruido (a posicao vem em centesimos, 15 vezes por segundo) e nao corrige; acima disso
      // a velocidade fecha o erro em ~1 s, sem salto (puxar 1/4 do erro a cada tick tirava o passo da tela da cadencia de
      // 2 quadros, e o grafico inteiro dava mexidinhas para o lado); mais de 0,25 s e pulo de verdade
      const em = S.posEmDe === S.pos ? S.posEm : agora, err = S.pos - (b.pos + (em - b.t) / 1000 * b.vel);
      if (Math.abs(err) < .25) {
        p = b.pos + (agora - b.t) / 1000 * b.vel;
        ajuste = Math.abs(err) < .015 ? 0 : clamp(err, -.1, .1);
      }
    } else if (b && b.id === id && S.pos === V.ultPos) p = b.pos + (b.tocando ? (agora - b.t) / 1000 * b.vel : 0);
    V.base = { pos: p, t: agora, id, tocando, vel: velEm(p) * (1 + ajuste) };
    V.ultPos = S.pos;
  }
  return V.base.tocando ? V.base.pos + (agora - V.base.t) / 1000 * V.base.vel : V.base.pos;
}
function vdjPassagens() {
  const s = S.state, id = s && s.track ? s.track.id : null, ps = (s && s.visor && s.visor.passagens) || [];
  return { feita: ps.find(p => p.para === id && p.de !== id) || null, vem: ps.find(p => p.de === id) || null };
}

function vdjPedeQuadro() { if (!V.raf) V.raf = requestAnimationFrame(vdjQuadro); }
function vdjQuadro(ts) {
  V.raf = 0;
  // o tempo do quadro (o da tela, de 16,7 em 16,7 ms) e nao a hora em que o callback rodou: o relogio do visor anda
  // exatamente um quadro por quadro
  if (desenharVisor(ts || performance.now()) && !reduz.matches) vdjPedeQuadro();
}
/* parado (ou com movimento reduzido), o visor so se redesenha quando algo muda: o temporizador olha 15 vezes por segundo,
   e so no computador com a pagina do disco aberta */
setInterval(() => {
  if (!vdjPc.matches || document.hidden || !document.body.classList.contains('com-disco') || V.raf) return;
  if (desenharVisor(performance.now()) && !reduz.matches) vdjPedeQuadro();
}, 66);
document.addEventListener('visibilitychange', () => { V.sujo = true; });
$('#vdj-tela').addEventListener('contextrestored', () => { V.sujo = true; });

/* um quadro: true se o disco esta tocando (o proximo quadro anda) */
function desenharVisor(agora) {
  const box = $('#visor-dj'), cv = $('#vdj-tela');
  if (!box.offsetParent) return false;
  const W = Math.max(8, Math.floor(box.clientWidth / VDJ_CEL)), H = Math.max(12, Math.floor(box.clientHeight / VDJ_CEL));
  if (cv.width !== W || cv.height !== H) {
    cv.width = W; cv.height = H; cv.style.width = W * VDJ_CEL + 'px'; cv.style.height = H * VDJ_CEL + 'px';
    V.img = null; V.sujo = true;
  }
  const s = S.state, tr = s && s.track, dur = (s && (s.duration || (tr && tr.duration))) || 0;
  const tocando = !!tr && s.status === 'playing';
  // o disco do prato mudou (a virada, ou outro disco) e o tick com a posicao do novo ainda nao chegou: o estado e o
  // tick sao eventos separados, e um quadro entre eles punha o novo na posicao do velho
  if (tr && tr.id !== V.idVisto) { V.idVisto = tr.id; V.posTroca = S.pos; V.tTroca = agora; }
  if (tr && V.base && V.base.id !== tr.id && S.pos === V.posTroca && agora - V.tTroca < 250) return tocando;
  const pos = tr ? clamp(vdjPos(agora), 0, dur || Infinity) : 0;
  const { feita, vem } = tr ? vdjPassagens() : { feita: null, vem: null };
  // a onda de cada disco que pode aparecer (pedir antes de saber se esta na tela: a proxima chega a tempo)
  const ondaAtual = tr ? vdjOnda(tr.id) : null;
  const ondaFeita = feita ? vdjOnda(feita.de) : null, ondaVem = vem ? vdjOnda(vem.para) : null;
  const span = W * VDJ_PASSO;

  // quem a tela mostra: a passagem que trouxe este disco (enquanto a sobreposicao e a volta da velocidade dele estao
  // na tela), a dele para a proxima (quando ela chega perto), ou so ele
  let p = null, ondaDe = null, ondaPara = null, agoraU = 0;
  if (feita) {
    // ate a beira esquerda passar do fim do que saiu (e da troca de cor) e da volta da velocidade: dali em diante a tela
    // de um disco so desenha igual
    const u = vdjFiInv(feita, pos - feita.ini), fim = Math.max(feita.sob + feita.rampa, (feita.v - feita.t0) / feita.va + feita.sai + 1.3);
    if (u - Math.floor(W / 2) * VDJ_PASSO < fim) { p = feita; ondaDe = ondaFeita; ondaPara = ondaAtual; agoraU = u; }
  }
  if (!p && vem) {
    const u = (pos - vem.t0) / vem.va;
    if (u > -(span + 2)) { p = vem; ondaDe = ondaAtual; ondaPara = ondaVem; agoraU = u; }
  }
  let agoraX = p ? agoraU : pos;   // o "agora" na coordenada da tela: s de saida desde o t0, ou o tempo do disco
  // (07/11, pedido do dono) tocando, o agora da tela nunca volta por um tiquinho: a posicao chega 15 vezes por segundo,
  // em centesimos, e a correcao de cada tick puxava o agora uns ms para tras; na beira de uma celula a tela inteira voltava
  // 1 coluna e avancava no quadro seguinte (a linha da batida tremia 1 pixel para o lado enquanto passava). Pulo de verdade
  // (mais de 0,25 s, outro disco, outra passagem, arrasto) segue na hora
  const kMono = p ? `${p.de}>${p.para}` : `${tr && tr.id}`, mono = V.mono;
  if (tocando && !V.arrasto && mono && mono.k === kMono && agoraX < mono.x && mono.x - agoraX < .25) agoraX = mono.x;
  V.mono = { k: kMono, x: agoraX };
  // a esquerda da tela, presa na grade das celulas (a tela so muda de celula em celula, 30 vezes por segundo): com o
  // ponto de toque no meio; com movimento reduzido, a pagina fica e o ponto anda
  let esq = (Math.floor(agoraX / VDJ_PASSO) - Math.floor(W / 2)) * VDJ_PASSO;
  if (reduz.matches) {
    const k = p ? `${p.de}>${p.para}` : `${tr && tr.id}`;
    const a = V.ancora;
    if (!a || a.k !== k || agoraX < a.esq + span * .05 || agoraX > a.esq + span * .9)
      V.ancora = { k, esq: Math.floor((agoraX - span * .15) / VDJ_PASSO) * VDJ_PASSO };
    esq = V.ancora.esq;
  }
  const agulha = Math.floor((agoraX - esq) / VDJ_PASSO + 1e-6);
  // a coluna x e a celula iEsq + x, contada em inteiros: somar esq + x * VDJ_PASSO em ponto flutuante caia um tiquinho
  // abaixo da celula em algumas colunas, que liam a coluna vizinha da onda; como esq muda a cada passo, as colunas
  // erradas mudavam junto e a onda piscava (linhas que aparecem e somem, pedido dele, 06/11)
  const iEsq = Math.round(esq / VDJ_PASSO);
  V.mapa = { esq, p, dur };

  const ambar = vdjPaleta(VDJ_AMBAR);   // o mapa de baixo
  // a que entra vira ambar quando o que saiu sai da tela pela esquerda (com movimento reduzido, de uma vez)
  let fCor = 0;
  if (p && p === feita) {
    const fimSai = (p.v - p.t0) / p.va + p.sai, f = (esq - fimSai) / 1.2;
    fCor = reduz.matches ? (f > 0 ? 1 : 0) : Math.round(clamp(f, 0, 1) * 12) / 12;   // em degraus: as cores ficam guardadas
  }
  // o quadro so se refaz quando muda o que ele mostra: a celula do ponto de toque, o disco, a passagem, a onda que chegou
  const chave = [W, H, Math.round(esq / VDJ_PASSO), agulha, fCor, s && s.status, tr && tr.id, Math.floor(pos),
                 JSON.stringify(s && s.visor && s.visor.passagens), V.arrasto ? 'a' : ''].join('|');
  if (!V.sujo && chave === V.chave) return tocando || !!V.arrasto;
  V.sujo = false; V.chave = chave;
  if (!V.img) { V.img = cv.getContext('2d').createImageData(W, H); V.px = new Uint32Array(V.img.data.buffer); }
  const px = V.px;
  px.fill(vdjRgb(...VDJ_FUNDO));
  // a faixa da onda (linhas impares, o eixo no meio) e o mapa do disco inteiro em 3 linhas embaixo
  const hw = (H - 4) % 2 ? H - 4 : H - 5, c = (hw - 1) / 2, meia = c;
  const cEntra = VDJ_AMBAR.map((cc, i) => vdjMistura(VDJ_CIANO[i], cc, fCor));
  const e = p ? (p.v - p.t0) / p.va : 0, fimSai = p ? e + p.sai : 0;
  const troca = u => !p || !p.grave ? 1 : clamp((u - e - p.grave[0]) / Math.max(1e-3, p.grave[1] - p.grave[0]), 0, 1);

  // uma metade de uma coluna: o disco no tempo t, no volume g (a cor acende com ele, a altura so um pouco) e com o grave
  // gr (a troca de grave tira o grave de um e poe no outro), do eixo para fora (dir = -1 sobe, 1 desce). Devolve o tom
  // de dentro, para o eixo
  const metade = (x, onda, t, g, gr, base, foi, dir) => {
    if (!onda) return null;
    const i = Math.floor(t / onda.passo + 1e-6);
    if (i < 0 || i >= onda.n) return null;
    const pal = vdjPaleta(base, g), cor = foi ? pal.foi : pal.vem, a = onda.alt, alt = (.7 + .3 * g) * meia;
    const hg = Math.round(a[onda.cols[3 * i]] * gr * alt), hm = Math.round(a[onda.cols[3 * i + 1]] * alt);
    const ha = Math.round(a[onda.cols[3 * i + 2]] * alt), top = Math.max(hg, hm, ha);
    for (let k = 1; k <= top; k++) px[(c + dir * k) * W + x] = k <= ha ? cor[2] : k <= hm ? cor[1] : cor[0];
    return ha ? cor[2] : hm ? cor[1] : top ? cor[0] : null;
  };
  for (let x = 0; x < W; x++) {
    const xu = (iEsq + x) * VDJ_PASSO, foi = xu < agoraX;
    let sobe = null, desce = null;   // [onda, t, g, gr, paleta]
    if (!p) {
      if (tr) sobe = desce = [ondaAtual, xu, 1, 1, VDJ_AMBAR];
    } else {
      // o que sai segue cheio ate a troca (p.segura, a passagem de DJ do motor) e cai no cosseno ate p.sai
      const seg = p.segura || 0;
      const sai = [ondaDe, p.t0 + p.va * xu, xu < e + seg ? 1 : Math.cos(clamp((xu - e - seg) / Math.max(1e-3, p.sai - seg), 0, 1) * Math.PI / 2), p.grave ? 1 - troca(xu) : 1, VDJ_AMBAR];
      // a que entra sobe em seno ate p.nivel em p.entra e dali reto ate cheia em p.cheia (a passagem de DJ do motor)
      const nv = p.nivel == null ? 1 : p.nivel;
      const gEntra = nv * Math.sin(clamp((xu - e) / Math.max(1e-3, p.entra), 0, 1) * Math.PI / 2) + (nv < 1 ? (1 - nv) * clamp((xu - e - p.entra) / Math.max(1e-3, (p.cheia || p.entra) - p.entra), 0, 1) : 0);
      const entra = xu >= 0 ? [ondaPara, p.ini + vdjFi(p, xu), gEntra, troca(xu), cEntra] : null;
      if (!entra) sobe = desce = sai;
      else if (xu > fimSai) sobe = desce = entra;
      else { sobe = sai; desce = entra; }
    }
    if (sobe !== desce) for (let y = c + 1; y < hw; y++) px[y * W + x] = VDJ_JUNTAS;   // o trecho das duas juntas
    const t1 = sobe ? metade(x, sobe[0], sobe[1], sobe[2], sobe[3], sobe[4], foi, -1) : null;
    const t2 = desce ? metade(x, desce[0], desce[1], desce[2], desce[3], desce[4], foi, 1) : null;
    // o eixo: a onda continua quando e um disco so; no trecho das duas, a linha que separa
    px[c * W + x] = sobe === desce && (t1 || t2) ? t1 || t2 : VDJ_EIXO;
  }

  // as batidas: cada grade no trecho em que o motor mediu, so na metade em que o disco dela esta desenhado
  const batida = (x, y0, y1, cor) => {
    if (x < 0 || x >= W) return;
    for (let y = y0; y <= y1; y++) {
      const i = y * W + x, q = px[i], borda = y === 0 || y === hw - 1;
      const f = borda ? 1 : .3, r = q & 255, g = q >> 8 & 255, b = q >> 16 & 255;
      px[i] = vdjRgb(Math.round(r + (cor[0] - r) * f), Math.round(g + (cor[1] - g) * f), Math.round(b + (cor[2] - b) * f));
    }
  };
  const grade = (gd, paraX, lados, cor) => {
    if (!gd) return;
    for (let n = Math.ceil((gd.de - gd.fase) / gd.periodo); ; n++) {
      const t = gd.fase + n * gd.periodo;
      if (t > gd.ate) break;
      const xu = paraX(t), x = Math.round((xu - esq) / VDJ_PASSO);
      if (x > W) break;
      if (x < 0) continue;
      const l = lados(xu);
      if (l === 'tudo') batida(x, 0, hw - 1, cor); else if (l === 'cima') batida(x, 0, c - 1, cor); else if (l === 'baixo') batida(x, c + 1, hw - 1, cor);
    }
  };
  const corEntra = vdjMistura(VDJ_BATIDA_C, VDJ_BATIDA, fCor);
  if (p) {
    if (p.no_tempo) {
      grade(p.grade_de, t => (t - p.t0) / p.va, xu => xu < 0 ? 'tudo' : xu <= fimSai ? 'cima' : null, VDJ_BATIDA);
      grade(p.grade_para, t => vdjFiInv(p, t - p.ini), xu => xu < 0 ? null : xu <= fimSai ? 'baixo' : 'tudo', corEntra);
    }
  } else if (tr) {
    // so o disco do prato: a grade dele do comeco (a passagem que o trouxe) e a do fim (a medida para a proxima)
    if (feita && feita.no_tempo) grade(feita.grade_para, t => t, () => 'tudo', VDJ_BATIDA);
    if (vem && vem.no_tempo) grade(vem.grade_de, t => t, () => 'tudo', VDJ_BATIDA);
  }

  // o ponto de toque: a linha clara com o T de pixel em cima e embaixo
  if (agulha >= 0 && agulha < W) {
    for (let y = 0; y < hw; y++) px[y * W + agulha] = VDJ_AGULHA;
    for (const y of [0, hw - 1]) for (const x of [agulha - 1, agulha + 1]) if (x >= 0 && x < W) px[y * W + x] = VDJ_AGULHA;
  }

  // o mapa do disco inteiro: a onda resumida (o maior de cada pedaco), o que ja tocou aceso, o ponto de toque e onde a
  // proxima entra
  if (tr && dur) {
    const y0 = H - 3;
    const w = ondaAtual;
    if (w && (!w.resumo || w.resumo.length !== W || w.resumoN !== w.n)) {
      const r = new Float32Array(W);
      for (let x = 0; x < W; x++) {
        let m = 0;
        let i = Math.floor(x * dur / W / w.passo), q = 0;
        for (const f = Math.min(w.n, Math.ceil((x + 1) * dur / W / w.passo)); i < f; i++, q++)
          m += Math.max(w.alt[w.cols[3 * i]], w.alt[w.cols[3 * i + 1]], w.alt[w.cols[3 * i + 2]]);
        r[x] = q ? m / q : 0;   // a media do pedaco: o maior enchia o mapa inteiro
      }
      w.resumo = r; w.resumoN = w.n;
    }
    const xp = Math.min(W - 1, Math.floor(pos / dur * W));
    for (let x = 0; x < W; x++) {
      const alto = w ? Math.max(1, Math.round(w.resumo[x] * 3.4)) : 1, cor = x < xp ? ambar.vem[1] : ambar.foi[0];
      for (let k = 0; k < alto; k++) px[(H - 1 - k) * W + x] = cor;
    }
    if (vem && vem.t0 < dur) { const xv = Math.min(W - 1, Math.floor(vem.t0 / dur * W)); for (let y = y0; y < H; y++) px[y * W + xv] = vdjPaleta(VDJ_CIANO).vem[1]; }
    for (let y = y0 - 1; y < H; y++) px[y * W + xp] = VDJ_AGULHA;
  }
  cv.getContext('2d').putImageData(V.img, 0, 0);

  // o tempo, e a etiqueta da passagem que esta na tela
  mudar($('#vdj-pos'), 'textContent', fmt(pos));
  mudar($('#vdj-resta'), 'textContent', tr && dur ? '-' + fmt(Math.ceil(dur - pos)) : fmt(dur));
  const selo = $('#vdj-selo'), naTela = p && fimSai >= esq && 0 <= esq + span;
  let txt = '', dica = '';
  if (naTela && p.no_tempo) {
    const pct = (p.vb - 1) * 100;
    txt = I18N.t('tv.badge.inTime') + (Math.abs(pct) >= .05 ? ` ${pct > 0 ? '+' : '-'}${I18N.num(Math.abs(pct), 1)}%` : '');
    const bpm = g => g ? Math.round(g.bpm) : null, a = bpm(p.grade_de), b = bpm(p.grade_para);
    const k = Math.abs(pct) >= .05 ? (a && b ? 'tv.hint.inTimeBpmPitch' : 'tv.hint.inTimePitch') : a && b ? 'tv.hint.inTimeBpm' : 'tv.inTime';
           dica = I18N.t(k, { bpmOut: a, bpmIn: b, pct: `${pct > 0 ? '+' : '-'}${I18N.num(Math.abs(pct), 1)}` });
  } else if (naTela) { txt = I18N.t('tv.badge.fade'); dica = I18N.t('tv.hint.volumeOnly'); }
  if (selo.hidden !== !txt) selo.hidden = !txt;
  mudar(selo, 'textContent', txt);
  selo.classList.toggle('fade', !!naTela && !p.no_tempo);
  mudar(box, 'title', dica);
  return tocando || (!!V.arrasto) || fCor > 0 && fCor < 1;
}

/* o tempo do disco do prato na coluna x do visor (o clique e o arrasto pulam para la) */
function vdjTempoNaColuna(x) {
  const m = V.mapa; if (!m) return 0;
  const xu = m.esq + x * VDJ_PASSO, p = m.p;
  let t = xu;
  if (p && S.state && S.state.track && p.para === S.state.track.id) t = xu < 0 ? 0 : p.ini + vdjFi(p, xu);
  else if (p) t = p.t0 + p.va * xu;
  return clamp(t, 0, Math.max(0, m.dur - .5));
}
/* clicar na onda pula para o ponto clicado; arrastar puxa a onda como o disco na mao (solta, pula); no mapa de baixo,
   clicar ou arrastar pula para aquele ponto do disco inteiro, como a barra fazia */
function vdjPula(t) {
  S.pos = t; V.base = null; V.sujo = true; desenharTempo();
  api('POST', '/api/seek', { t }).catch(err => avisar(err.message, true));
}
const vdjBox = $('#visor-dj');
vdjBox.addEventListener('pointerdown', e => {
  const s = S.state, dur = s && (s.duration || (s.track && s.track.duration));
  if (!s || !s.track || !dur || e.button !== 0 || !V.mapa) return;
  e.preventDefault();
  try { vdjBox.setPointerCapture(e.pointerId); } catch (err) { /* o ponteiro ja saiu: o arrasto segue so dentro do visor */ }
  const r = $('#vdj-tela').getBoundingClientRect();
  const noMapa = e.clientY - r.top >= r.height - 5 * VDJ_CEL;
  V.arrasto = { id: e.pointerId, x0: e.clientX, pos0: vdjPos(performance.now()), noMapa, mexeu: noMapa, alvo: null, r, dur };
  if (noMapa) V.arrasto.alvo = clamp((e.clientX - r.left) / r.width, 0, 1) * Math.max(0, dur - .5);
  vdjBox.classList.add('arrastando'); V.sujo = true; vdjPedeQuadro();
});
vdjBox.addEventListener('pointermove', e => {
  const a = V.arrasto; if (!a || a.id !== e.pointerId) return;
  const dx = e.clientX - a.x0;
  if (a.noMapa) a.alvo = clamp((e.clientX - a.r.left) / a.r.width, 0, 1) * Math.max(0, a.dur - .5);
  else if (a.mexeu || Math.abs(dx) > 3) { a.mexeu = true; a.alvo = clamp(a.pos0 - dx / VDJ_CEL * VDJ_PASSO, 0, Math.max(0, a.dur - .5)); }
  V.sujo = true; vdjPedeQuadro();
});
const vdjSolta = e => {
  const a = V.arrasto; if (!a || a.id !== e.pointerId) return;
  V.arrasto = null; vdjBox.classList.remove('arrastando');
  if (e.type === 'pointercancel') { V.sujo = true; return; }
  vdjPula(a.mexeu ? a.alvo : vdjTempoNaColuna(Math.floor((e.clientX - a.r.left) / VDJ_CEL)));
};
vdjBox.addEventListener('pointerup', vdjSolta);
vdjBox.addEventListener('pointercancel', vdjSolta);

/* ---------- receptor ---------- */
/* o volume do disco anda numa escala perceptiva: o ganho e a posicao ao cubo. Linear, 2% era -34 dB e 3% -30 dB, e
   no volume de lobby cada passo pulava 2,5 a 3,5 dB; ao cubo, do silencio ate 10% do ganho cabem 46 dos 100 passos, e
   perto de 2% cada passo muda ~1 dB. O motor, a API e o config.json seguem com o ganho linear de 0 a 1. A voz fica
   linear: e o nivel do microfone no Windows, com o numero que ele mostra */
const FADERS = [['#f-vol', '#o-vol', 'vol', true], ['#f-mon', '#o-mon', 'mon_vol', true], ['#f-mic', '#o-mic', 'mic_vol', false]];
const ganhoDaPos = p => (p / 100) ** 3;
const posDoGanho = g => Math.round(Math.cbrt(Math.max(0, Math.min(1, g))) * 100);
// o ganho do fader para o leitor de tela, na lingua (a virgula ou o ponto do I18N.num, com o sinal de menos de verdade)
function dbDoGanho(g) { return g > 0 ? I18N.t('mixer.gainDb', { db: I18N.num(20 * Math.log10(g), 1).replace('-', '−') }) : I18N.t('mixer.gainMuted'); }
function rotularFader(f, o, curva, g) {   // g: o ganho que o motor tem (o leitor de tela diz em dB)
  o.textContent = f.value + '%';
  if (curva) f.setAttribute('aria-valuetext', `${f.value}%, ${dbDoGanho(g)}`);
}
function desenharReceptor() {
  const s = S.state; if (!s) return;
  const agora = Date.now();
  for (const [fi, oi, k, curva] of FADERS) {
    if (agora - (S.segurando[k] || 0) < 900) continue;
    // sem a chave "Fone ligado", o fone desligado aparece como volume zero
    const f = $(fi), g = k === 'mon_vol' && !s.monitor_on ? 0 : s[k] || 0;
    f.value = curva ? posDoGanho(g) : Math.round(g * 100); pintarFader(f); rotularFader(f, $(oi), curva, g);
  }
  // fone "Nenhum" no dialogo: o volume do fone nao tem efeito, entao apaga e diz por que
  const semFone = !!s.active_devices && !s.active_devices.monitor;
  $('#f-mon').disabled = semFone;
  $('#f-mon').closest('.fader').title = semFone ? I18N.t('mixer.noHeadphones') : '';
  $('label[for="f-mon"] small').textContent = semFone ? I18N.t('mixer.noHeadphonesShort') : '';
  ligarChave($('#b-cortar'), s.mic_mute);
  // o volume automatico (no Microfone e fone): ligado, a alta desce e a baixa sobe ate o mesmo volume; diz quanto nesta
  $('#b-nivelar').closest('.nivelar').hidden = !('volume_auto' in s);   // servidor antigo: sem a chave
  ligarChave($('#b-nivelar'), !!s.volume_auto);
  const gdb = s.ganho_db || 0;
  $('#dd-nivelar').textContent = !s.volume_auto ? I18N.t('devices.autoVolumeOff')
    : I18N.t('devices.autoVolumeOn') + (Math.abs(gdb) < 0.05 ? ''
      : ' ' + I18N.t(gdb > 0 ? 'devices.autoVolumeUp' : 'devices.autoVolumeDown', { db: I18N.num(Math.abs(gdb), 1) }));
  for (const mc of [$('#mini-cortar'), $('#palco-cortar')]) {   // o da barra e o do cabecalho do palco
    if (mc._cortada === !!s.mic_mute) continue;
    mc._cortada = !!s.mic_mute;
    mc.setAttribute('aria-pressed', s.mic_mute ? 'true' : 'false');
    mc.classList.toggle('cortada', !!s.mic_mute);
    mc.title = s.mic_mute ? I18N.t('voice.mutedTap') : I18N.t('voice.mute');
    mc.innerHTML = s.mic_mute ? IC_MIC_CORTADO : IC_MIC;
  }
  const mt = $('#b-mudo-topo');   // o do topo na pagina do disco (computador): o icone e o nome dizem o estado
  if (mt._cortada !== !!s.mic_mute) {
    mt._cortada = !!s.mic_mute;
    mt.setAttribute('aria-pressed', s.mic_mute ? 'true' : 'false');
    mt.classList.toggle('cortada', !!s.mic_mute);
    mt.title = s.mic_mute ? I18N.t('voice.mutedClick') : I18N.t('voice.mute');
    mt.querySelector('.ic-mic').innerHTML = s.mic_mute ? IC_MIC_CORTADO : IC_MIC;
    mt.querySelector('.rot').textContent = s.mic_mute ? I18N.t('voice.muted') : I18N.t('voice.mute');
  }
  const mic = document.querySelector('.mostrador[data-k="mic"]');
  mic.classList.toggle('apagado', !!s.mic_mute);
  mic.querySelector('.nome-m').textContent = s.mic_mute ? I18N.t('mixer.meter.voiceMuted') : I18N.t('mixer.meter.voice');
  desenharEfeito();
}
function pintarFader(f) { f.style.setProperty('--p', (f.value / f.max * 100).toFixed(1) + '%'); f.style.setProperty('--f', (f.value / f.max).toFixed(4)); }

/* ---------- efeitos de voz: seletor no receptor e gaveta de teclas ---------- */
const celular = () => matchMedia('(max-width: 899.98px)').matches;
const toque = () => matchMedia('(pointer: coarse)').matches;
const angDial = (i, n) => n > 1 ? -135 + i * 270 / (n - 1) : 0;

async function carregarEfeitos() {
  try {
    const r = await api('GET', '/api/effects');
    S.efeitos = Array.isArray(r) ? r : [];
    S.erroEfeitos = null;
  } catch (e) { S.erroEfeitos = e.message; }
  montarGaveta();
  desenharEfeito();
}


/* pedaleira do celular: a cara de cada pedal mini, em esmalte vintage do tema
   (alguns com pintura martelada). Os knobs sao pintura: o pedal inteiro e o botao, e os efeitos
   nao tem parametro para girar */
const PEDAIS = {

  'megafone': { cor: '#C9922C', letra: '#261710', tipo: 'LO-FI', fonte: 'larga' },

  'eco': { cor: '#3B563B', letra: '#EAE0C8', tipo: 'DELAY', fonte: 'larga', acabamento: 'martelado' },
  'banheiro': { cor: '#769688', letra: '#1B2823', tipo: 'REVERB', fonte: 'normal' },
  'catedral': { cor: '#4B2835', letra: '#E4C07A', tipo: 'REVERB', fonte: 'italica' },

  'voz-grossa': { cor: '#2E201B', letra: '#E89B42', tipo: 'OCTAVE', fonte: 'larga' },
  'esquilo': { cor: '#B85328', letra: '#F5EAD6', tipo: 'OCTAVE', fonte: 'larga' },
  'demonio': { cor: '#541B20', letra: '#F07A5B', tipo: 'PITCH', fonte: 'estreita' },
  'alien': { cor: '#7D8C3C', letra: '#1D220E', tipo: 'MOD', fonte: 'italica' },
  'estourado': { cor: '#983228', letra: '#F3E6D0', tipo: 'FUZZ', fonte: 'estreita', acabamento: 'martelado' },
  'mina': { cor: '#983228', letra: '#F3E6D0', tipo: 'MINA', fonte: 'estreita', acabamento: 'martelado' },
  'pistavoz': { cor: '#4B2245', letra: '#EBCB7A', tipo: 'VOX', fonte: 'larga' },
};
/* knobs e footswitch de niquel em pixel art na grade de 1 px css, gerados pelo dev/pecas.py no gerado/pecas.js (em KNOBS, cada knob e o
   SVG com um dos seus 11 ponteiros no lugar de PONTEIRO; no chicken-head o ponteiro e o knob inteiro, que gira; e
   PE_SVG); a pedaleira do celular mostra as pecas, e a mesa do PC so o PE_SVG (o footswitch, por cima do canvas de
   cada pedal, no PEDAL-JS). O knob de cada familia pela silhueta, do mock E1: chicken-head no Radio e alto-falante, baquelite escuro no Ambiente, o creme no resto */
const KNOB_DO_GRUPO = { radio: 'frango', ambiente: 'baquelite' };
/* o nome, o que faz e o grupo de um efeito: o /api/effects so manda os ids, e os textos sao do tema (effect.<id>.name,
   effect.<id>.desc, effect.group.<grupo>); efeito novo que o tema ainda nao conhece aparece pelo id */
const textoEf = (chave, reserva) => (I18N.tem(chave) ? I18N.t(chave) : reserva);
// o nome no pedal pode trazer o hifen opcional (­: onde a palavra comprida quebra, no caberNomes); fora dele, sai
const nomePedal = ef => textoEf(`effect.${ef.id}.name`, ef.id);
const nomeEf = ef => nomePedal(ef).replace(/­/g, '');
const descEf = ef => textoEf(`effect.${ef.id}.desc`, '');
const nomeGrupo = g => textoEf(`effect.group.${g}`, g);
$('#b-parecidas .ch').innerHTML = CHAVE_PARECIDAS;
$('#b-guardar').innerHTML = SALVAR_PIXEL;
const hashTxt = t => { let h = 7; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
function vestirPedal(b, ef) {
  const p = PEDAIS[ef.id] || { cor: ['#56677A', '#7A4B5C', '#4B7A5E'][hashTxt(ef.id) % 3], letra: '#F3EFE6', tipo: I18N.t('effects.pedalType'), fonte: 'normal' };
  b.style.setProperty('--cor', p.cor); b.style.setProperty('--letra', p.letra);
  b.dataset.fonte = p.fonte;

  g.innerHTML = knob.replace('PONTEIRO', ponteiros[Math.round((hashTxt(ef.id) % 240 - 120) / 27.3) + 5]);

function tecla(ef) {

  b.setAttribute('aria-pressed', 'false');

  n.dataset.nome = nomeEf(ef);

    n.dataset.quebra = nomePedal(ef);

  // vozes no pedal so existem la, e fora dela o leitor de tela e a dica diriam para clicar no que nao ha (revisao da r08)
  const desc = descEf(ef) + (ef.id === 'pistavoz' && MESA.montada ? ' ' + I18N.t('effects.voicePedal.howTo') : '');
  if (desc) b.append(el('span', 't-desc', desc));

}

function montarGaveta() {
  const banco = $('#banco');
  const foco = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.ef : null;
  banco.replaceChildren();
  $('#banco-dir').replaceChildren();
  if (!S.efeitos) {
    banco.append(el('p', 'aviso-gav', S.erroEfeitos
      ? I18N.t('effects.loadFailed')
      : I18N.t('effects.loading')));
    montarMarcas();
    return;
  }
  const grupos = new Map();
  for (const ef of S.efeitos) {
    if (!ef.grupo) continue;   // grupo vazio = Sem efeito: nao tem pedal
    if (!grupos.has(ef.grupo)) grupos.set(ef.grupo, []);
    grupos.get(ef.grupo).push(tecla(ef));
  }
  for (const [g, teclas] of grupos) {
    const sec = el('div', 'grupo-ef');
    const h = el('h3', 'suporte', nomeGrupo(g));

    t.append(...teclas);

    banco.append(sec);
  }
  if (!S.efeitos.length) banco.append(el('p', 'aviso-gav', I18N.t('effects.noneSent')));
  repartirPedais();
  montarMarcas();
  caberNomes();

}

/* os pedais mini do celular: o nome cabe inteiro no pedal, em ate 2 linhas, nas duas letras. No celular de teste (360 px
   de largura) "Megafone" e "Alienigena" saiam cortados e o Locutor e o Alto-falante perdiam o fim; com a letra de pixel
   (19/10) a letra so desce da maior para a menor, os dois tamanhos dela sem pixel borrado. Na mesa o nome e pintado no
   canvas do pedal (PEDAL-JS) e o do DOM fica transparente, so para o leitor de tela: nada a medir */
const linhasDoTexto = e => { const r = document.createRange(); r.selectNodeContents(e); return new Set([...r.getClientRects()].map(q => Math.round(q.top))).size; };
function caberNomes() {
  if (document.body.classList.contains('mesa-dj')) return;
  for (const n of document.querySelectorAll('.banco .tecla .t-nome')) {
    // desfaz a quebra no hifen opcional da medida anterior
    if (n.dataset.nome && n.textContent !== n.dataset.nome) n.textContent = n.dataset.nome;
    n.classList.remove('miuda', 'na-margem');
    if (!n.clientWidth) continue;   // gaveta fora da tela de verdade (sem caixa): mede quando aparecer
    // a letra de pixel so tem dois tamanhos sem borrar (1 e 2/3 de px por pixel): a maior em ate duas linhas,
    // desde que nenhuma palavra passe da largura (com o pisador 9 px abaixo o nome grande
    // pode ocupar duas linhas, e alienigena e uma palavra so: a palavra que nao cabe grande fica numa
    // linha, na menor); as linhas se contam pelos retangulos do texto: a altura da caixa vem presa pelo max-height
    // (tres linhas passavam por duas e a terceira sumia) e a caixa de desenho da letra passa da linha (o scrollHeight)
    const cabe = () => linhasDoTexto(n) <= 2 && n.scrollWidth <= n.clientWidth + 0.5;
    if (cabe()) continue;
    n.classList.add('na-margem');   // a grande ainda pode usar a margem do pedal (o MEGAFONE na tela de 360)
    if (cabe()) continue;
    // (r16) a palavra que nao cabe grande quebra no hifen opcional do nome (MEGA-PHONE, CATHE-DRAL), em duas linhas
    // como os nomes de duas palavras, antes de descer para a letra menor
    if (n.dataset.quebra) {
      n.classList.remove('na-margem'); n.textContent = n.dataset.quebra;
      if (cabe()) continue;
      n.classList.add('na-margem');
      if (cabe()) continue;
      n.textContent = n.dataset.nome;
    }
    n.classList.replace('na-margem', 'miuda');
  }
}
document.fonts.ready.then(caberNomes);
/* fios RCA em pixel no celular, como no mock p1: cada pedaco e um canvas de
   celulas de 4/3 px (4 px de tela no celular de teste, a grade do braco) que o CSS amplia sem suavizar.
   O fio e uma faixa de 6 celulas pela distancia ao traco (contorno, brilho do lado da luz de cima a
   esquerda, corpo, sombra clara, sombra escura, contorno), com as cores amostradas do mock; o plugue e o retangulo girado
   de antes (13 x 9 e a ponta), em celulas, com o anel da cor do fio. Desenha so quando a medida muda */
const CEL = 4 / 3, CONTORNO_FIO = [16, 14, 14];
const COR_FIO = {   // brilho, corpo, sombra clara, sombra escura
  branco: [[255, 252, 245], [240, 234, 226], [205, 201, 188], [130, 132, 126]],
  vermelho: [[250, 90, 88], [246, 50, 50], [214, 16, 18], [128, 0, 0]],

function bezier(a, c1, c2, b, n = 20) {
  const out = [];

    const t = i / n, u = 1 - t;
    out.push([0, 1].map(k => u * u * u * a[k] + 3 * u * u * t * c1[k] + 3 * u * t * t * c2[k] + t * t * t * b[k]));

}
/* os fios do celular e da calha, na rampa deles (COR_FIO) e com o contorno deles; os cabos da mesa de DJ sao do telaPixel

function fiosPixel(cv, larg, alt, fios, plugues, cel = CEL) {

  // de o Uint8ClampedArray de tamanho negativo derrubar o desenho

  const pinta = (i, [r, g, b], a = 255) => { px.set([r, g, b, a], i * 4); };
  const faixas = pts => {   // celula -> distancia com sinal ao traco, em celulas (+ do lado da luz)
    const d = new Map();
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1, L = Math.sqrt(L2);
      let nx = -dy / L, ny = dx / L;
      if (nx + ny > 0) { nx = -nx; ny = -ny; }

      for (let j = Math.max(0, Math.floor((Math.min(ay, by) - r) / cel)); j <= Math.min(H - 1, Math.floor((Math.max(ay, by) + r) / cel)); j++)
        for (let k = Math.max(0, Math.floor((Math.min(ax, bx) - r) / cel)); k <= Math.min(W - 1, Math.floor((Math.max(ax, bx) + r) / cel)); k++) {
          const cx = (k + .5) * cel, cy = (j + .5) * cel, t = Math.max(0, Math.min(1, ((cx - ax) * dx + (cy - ay) * dy) / L2));

  // celula a mais embaixo (ou em cima); quando as duas vizinhas concordam entre si, a coluna copia a da esquerda
  for (const [d] of tracos) {

    for (const i of d.keys()) { const k = i % W, j = (i / W) | 0, c = col.get(k); if (c) { c.t = Math.min(c.t, j); c.b = Math.max(c.b, j); } else col.set(k, { t: j, b: j }); }
    for (const [k, c] of col) {
      const e = col.get(k - 1), f = col.get(k + 1);
      if (!e || !f || e.t !== f.t || e.b !== f.b || (c.t === e.t && c.b === e.b) || Math.abs(c.t - e.t) > 1 || Math.abs(c.b - e.b) > 1) continue;
      for (let j = Math.min(c.t, e.t); j <= Math.max(c.b, e.b); j++) {
        const i = j * W + k, v = d.get(i - 1);
        if (v === undefined) d.delete(i); else d.set(i, v);
      }
    }
  }
  for (const [d] of tracos) for (const i of d.keys()) {   // a sombra dura: 1 celula para baixo e a direita
    const k = i + W + 1;
    if (k < W * H && px[k * 4 + 3] === 0) pinta(k, [12, 5, 2], 115);
  }
  for (const [d, [brilho, corpo, sombra, escuro]] of tracos)
    for (const [i, s] of d) pinta(i, Math.abs(s) > 2 ? cont : s > 1 ? brilho : s > 0 ? corpo : s > -1 ? sombra : escuro);
  for (const { t: [tx, ty], ang, cor } of plugues) {   // o plugue: corpo de metal, anel e capa da cor do fio (como no mock)
    const a = ang * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a), lado = Math.sign(sn - cs) || 1, dentro = new Map();
    for (let j = Math.max(0, Math.floor((ty - 22) / cel)); j <= Math.min(H - 1, Math.floor((ty + 22) / cel)); j++)
      for (let k = Math.max(0, Math.floor((tx - 22) / cel)); k <= Math.min(W - 1, Math.floor((tx + 22) / cel)); k++) {
        const ex = (k + .5) * cel - tx, ey = (j + .5) * cel - ty, lx = ex * cs + ey * sn, ly = -ex * sn + ey * cs;
        let c = null;
        if (lx >= 0 && lx <= 13 && ly >= 0 && ly <= 9) {
          const u = (ly - 4.5) * lado;
          c = lx >= 3 && lx <= 5.4 ? pal[cor][1] : u > 1.5 ? [238, 236, 230] : u < -1.5 ? [140, 138, 132] : [200, 198, 192];
        } else if (lx > 13 && lx <= 19 && Math.abs(ly - 4.5) <= 3.1 - (lx - 13) * .15) c = pal[cor][2];
        if (c) dentro.set(j * W + k, c);
      }
    for (const i of dentro.keys())
      for (const v of [i - 1, i + 1, i - W, i + W]) if (v >= 0 && v < W * H && !dentro.has(v)) pinta(v, cont);
    for (const [i, c] of dentro) pinta(i, c);
  }

  cv.style.width = W * cel + 'px'; cv.style.height = H * cel + 'px';

}
/* os pedacos parados (os plugues do toca-discos e do receiver e a alca do receiver ao FX-12), nas
   medidas dos svg de antes; o canvas sai 4 px para fora de cada lado, onde os plugues passam da caixa */
const PEDACOS_FIOS = {
  '.cabo-mesa': [68, 48, [], [{ t: [19, -2], ang: 72, cor: 'branco' }, { t: [35, -2], ang: 74, cor: 'vermelho' }]],
  '.cabo-rec': [68, 50, [], [{ t: [11, 50], ang: -78, cor: 'branco' }, { t: [27, 50], ang: -76, cor: 'vermelho' }]],
  '.cabo-gav': [116, 48, [{ pts: bezier([24.5, 10], [27, 20], [39, 22], [38, 34]), cor: 'branco' }, { pts: bezier([41, 10], [44, 21], [53, 22], [51, 34]), cor: 'vermelho' }],
    [{ t: [27, -2], ang: 72, cor: 'branco' }, { t: [43, -2], ang: 70, cor: 'vermelho' }]],
};
function pedacosFios(repinta) {   // repinta: os que ja existem tambem (o canvas voltou em branco)
  for (const [sel, [w, h, fios, plugues]] of Object.entries(PEDACOS_FIOS)) {
    const caixa = document.querySelector('.palco ' + sel);
    let cv = caixa && caixa.querySelector('.fios-pixel');
    if (!caixa || (cv && !repinta)) continue;
    if (!cv) { cv = document.createElement('canvas'); cv.className = 'fios-pixel'; caixa.append(cv); }
    const mais = ([x, y]) => [x + 4, y + 4];
    fiosPixel(cv, w + 8, h + 8, fios.map(f => ({ ...f, pts: f.pts.map(mais) })), plugues.map(p => ({ ...p, t: mais(p.t) })));
  }
}
/* cabos RCA no celular: o par desce pela calha da direita, do toca-discos ate o receiver, num traco
   so por cor (o pedaco que esticava era uma faixa chapada e a emenda aparecia). As
   curvas das pontas sao as do mock, ligadas por uma reta na calha; o vao entre os aparelhos
   (titulo, fila, erro) vem do layout */
function medirCabos() {
  if (!celular()) { cabosDoComputador(); return; }
  const cv = $('#cabo-calha'), p = $('#palco');
  const m = p.querySelector('.mesa'), r = p.querySelector('.receptor');
  if (!m.offsetParent) return;
  pedacosFios();
  const pr = p.getBoundingClientRect(), mr = m.getBoundingClientRect(), rr = r.getBoundingClientRect();
  const R = p.clientWidth - 1;   // a calha e os plugues do toca-discos se alinham por aqui (a 1 px da tela)
  // os do receiver, pela beira dele: o .cabo-rec passa 15 px dela, e no celular grande o receiver nao chega na calha
  const Rr = Math.min(R, Math.round(rr.right - pr.left) + 15);
  const mb = mr.bottom - pr.top + p.scrollTop, rt = rr.top - pr.top + p.scrollTop;
  // o canto do canvas num terco de px: a celula de 4/3 px cai em 4 px de tela no celular de densidade 3
  const x0 = Rr - 72, y0 = Math.round((mb - 30) * 3) / 3, alt = Math.max(60, rt + 20 - y0);
  const pt = (x, y) => [x - x0, y - y0];

  // a textura do palco cobre o conteudo inteiro (ate o fim da gaveta), nao so a tela
  const g = p.querySelector('.gaveta');
  mudar(p, '--alto-palco', Math.max(p.clientHeight, g.offsetTop + g.offsetHeight + parseFloat(getComputedStyle(p).paddingBottom)) + 'px');
  const geo = `${x0}|${y0.toFixed(1)}|${alt.toFixed(1)}`;
  if (cv._geo === geo) return;
  cv._geo = geo;
  cv.style.left = x0 + 'px'; cv.style.top = y0 + 'px';
  fiosPixel(cv, R - x0, alt, [
    // o par a 5 celulas um do outro na calha (o contorno do meio e dos dois), cada um no meio de uma celula
    { pts: fio([R - 55, mb - 20], [R - 47, mb + 4], [R - 18, mb - 4], [R - 14, mb + 24], [R - 14, rt - 31], [R - 17, rt - 7], [Rr - 46, rt - 15], [Rr - 54, rt + 11]), cor: 'branco' },
    { pts: fio([R - 39, mb - 20], [R - 33, mb - 2], [R - 9.33, mb - 8], [R - 7.33, mb + 24], [R - 7.33, rt - 31], [R - 9.33, rt - 1], [Rr - 31, rt - 11], [Rr - 38, rt + 11]), cor: 'vermelho' },

/* cabos RCA no computador: o par sai de tras do toca-discos, pende no vao e entra de lado no receiver, com os fios e
   os plugues num canvas so, atras dos dois aparelhos. As curvas sao proporcoes do vao, para o par sempre chegar nos
   dois lados; com o vao estreito o plugue entra mais, e sobra fio. A celula e o pixel inteiro de tela mais perto dos
   4/3 px do celular, e o canto do canvas cai na grade da tela */
function cabosDoComputador() {
  if (MESA.montada) { cabosDaMesa(); return; }
  pedacosFios();
  const cv = $('#cabo-calha'), t = $('.tampo').getBoundingClientRect(), r = $('.receptor').getBoundingClientRect();
  const d = devicePixelRatio || 1, cel = Math.max(1, Math.round(d * 4 / 3)) / d;
  const geo = ['pc', t.right, t.top, t.height, r.left, r.top, cel].join('|');
  if (cv._geo === geo) return;
  cv._geo = geo;
  const x0 = Math.round((t.right - 32) * d) / d, y0 = Math.round((Math.min(t.top, r.top) + 20) * d) / d;
  const fundo = Math.max(t.top + 60, Math.min(t.bottom - 40, t.top + clamp(t.height * .3, 120, 190)));   // o ponto mais baixo do fio branco
  const entra = Math.max(3, (78 - (r.left - t.right)) / 2);

    const a = ang * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);

  };
  const fio = (a, b, f, [k1, k2, k3, k4, k5], cor) => {   // da ponta a ao fundo f e dali a b, em proporcoes do vao
    const x = k => a.rabo[0] + k * (b.rabo[0] - a.rabo[0]), [xa, ya] = a.rabo, [xb, yb] = b.rabo;
    return { pts: [...bezier([xa, ya], [x(k1), ya + 1], [x(k2), f], [x(k3), f]), ...bezier([x(k3), f], [x(k4), f], [x(k5), yb + 2], [xb, yb])], cor };
  };
  const pb = plugue(t.right - entra, t.top + 40, 8, 'branco'), pv = plugue(t.right - entra, t.top + 58, 8, 'vermelho');
  const qb = plugue(r.left + entra, r.top + 44, 172, 'branco'), qv = plugue(r.left + entra, r.top + 61, 170, 'vermelho');
  cv.style.left = x0 + 'px'; cv.style.top = y0 + 'px';
  fiosPixel(cv, r.left + 32 - x0, fundo + 32 - y0, [
    fio(pb, qb, fundo - y0, [.37, .29, .58, .81, .76], 'branco'),
    fio(pv, qv, fundo + 18 - y0, [.26, .18, .52, .82, .79], 'vermelho'),

}
/* onde os cabos entram no mixer, em px do palco e em celulas pares (as do mixer e as dos canvas dos cabos caem juntas):

   recebe de volta (do Radio, pelo chao); no lado direito, embaixo dos pads, onde ha chao livre, o par dos Sons rapidos,
   a que recebe a pedaleira da direita (do Robo) e a que manda para ela (no Alto-falante, pelo chao). O desenhaMx poe as
   tomadas de aco nos mesmos lugares */
function jacksMesa() {
  const par = v => Math.round(v / 2) * 2, G = rectP($('#gaveta')), P = rectP($('#pads')), M = rectP($('.palco .receptor'));
  const fim = par(M.bottom - 24), v = Math.min(par(P.bottom + 22), fim - 60), b = v + 18, p2 = Math.min(b + 42, fim), p = Math.min(b + 22, p2 - 18);

}
/* o par vermelho e branco dos Sons rapidos ao mixer, no canvas da calha (atras dos aparelhos), em celulas de 2 px como os
   da pedaleira, com o jeito do par da main: os plugues no pe dos pads, os cabos caem com folga e entram de lado no mixer,
   o vermelho por cima do branco sem cruzar; o branco com mais sobra, a barriga mais funda */
function cabosDaMesa() {
  const cv = $('#cabo-calha'), P = rectP($('#pads')), M = rectP($('.palco .receptor')), J = jacksMesa();
  const par = v => Math.round(v / 2) * 2;
  const geo = ['mesa-c1', P.left, P.width, P.bottom, M.right, M.bottom, J.v, J.b].map(v => typeof v === 'number' ? Math.round(v) : v).join('|');
  if (!P.width || cv._geo === geo) return;
  const x0 = par(M.right - 6), x1 = par(P.left + P.width * .5), y0 = par(Math.min(P.bottom, J.v - 10) - 6), y1 = PALCO_H;
  const W = (x1 - x0) / 2, H = Math.ceil((y1 - y0) / 2);
  if (W < 1 || H < 1) return;   // (#43) o layout no meio de uma troca (saindo da mesa): sem cabo ate a medida seguinte
  cv._geo = geo;
  const T = telaPixel(W, H);
  const cx = v => Math.floor((v - x0) / 2), cy = v => Math.floor((v - y0) / 2);
  [[.15, J.v, 'vermelho', 6], [.29, J.b, 'branco', 8]].forEach(([f, yj, cor, fundo]) => {
    const a = plugueMesa(T, cx(P.left + P.width * f), cy(P.bottom), 1), b = plugueMesa(T, cx(M.right), cy(yj), 2), yb = b.y + fundo;
    const c = T.peca(T.cabo(curvaB([[a.x, a.y], [a.x, a.y + 4], [a.x - 1, yb - 3], [a.x - 6, yb], [b.x + 9, yb - 1], [b.x + 3, b.y + 1], [b.x, b.y]]),
      PAL_CABO[cor], new Map(), 1.5));

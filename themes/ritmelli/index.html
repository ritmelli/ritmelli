<!-- i18n -->
<script>
/* I18N: os textos da interface na lingua de quem usa (o plano esta no I18N.md do ritmelli-server). Os textos moram em
   i18n/i18n_<lingua>.properties, e o servidor (i18n.py) poe no lugar do comentario i18n acima os da lingua escolhida e
   os do ingles, a reserva para chave que falte. Na marcacao: data-i18n="chave" (o texto) e data-i18n-title,
   data-i18n-aria-label e data-i18n-placeholder (os atributos), aplicados no comeco do script principal. No JS:
   I18N.t('chave', { param }) e, com plural, I18N.tp('chave', n) (as chaves chave.one e chave.other). O nome curto t
   nao serve: ele ja e variavel local em mais de cem funcoes daqui. O texto com negrito ou codigo dentro da frase
   (<b>...</b>, <code>...</code>) vai pelo data-i18n ou pelo I18N.rico(elemento, 'chave', { param }); na marcacao, o
   filho com data-i18n-lugar="nome" entra no {nome} da frase (a URL do celular, que o JS preenche depois) */
const I18N = (() => {
  const d = window.I18N_DADOS || { lingua: 'pt_BR', textos: {}, reserva: {} };
  const lang = d.lingua.replace('_', '-');
  const tem = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const existe = k => tem(d.textos, k) || tem(d.reserva, k);
  const avisadas = new Set();
  function bruto(chave) {
    if (tem(d.textos, chave)) return d.textos[chave];
    if (tem(d.reserva, chave)) return d.reserva[chave];
    // a chave que falta nas duas linguas aparece na tela como a propria chave: o erro fica a vista
    if (!avisadas.has(chave)) { avisadas.add(chave); console.warn(`i18n: missing key "${chave}"`); }
    return chave;
  }
  function t(chave, params) {
    const s = bruto(chave);
    return params ? s.replace(/\{(\w+)\}/g, (m, k) => (tem(params, k) ? String(params[k]) : m)) : s;
  }
  // o singular so para 1, nas duas linguas que temos: o Intl.PluralRules poe o 0 no singular em portugues, e o Ritmelli
  // sempre escreveu "0 discos". Uma lingua com outras regras pede o plural.select aqui
  function tp(chave, n, params) {
    const k = `${chave}.${n === 1 ? 'one' : 'other'}`;
    return t(existe(k) ? k : `${chave}.other`, { n: n.toLocaleString(lang), ...params });
  }
  // numero com as casas e a virgula (ou o ponto) da lingua
  const num = (v, casas) => v.toLocaleString(lang, { minimumFractionDigits: casas, maximumFractionDigits: casas });
  // so <b> e <code> viram elemento, e sempre com textContent: nada dos arquivos passa por innerHTML. Um param que e
  // um elemento (Node) entra inteiro no lugar do {param}
  function rico(e, chave, params = {}) {
    const troca = s => s.replace(/\{(\w+)\}/g, (m, k) => (tem(params, k) && !(params[k] instanceof Node) ? String(params[k]) : m));
    e.replaceChildren(...bruto(chave).split(/(<(?:b|code)>[\s\S]*?<\/(?:b|code)>|\{\w+\})/).filter(Boolean).map(p => {
      const tag = p.match(/^<(b|code)>([\s\S]*)<\/\1>$/);
      if (tag) { const x = document.createElement(tag[1]); x.textContent = troca(tag[2]); return x; }
      const k = (p.match(/^\{(\w+)\}$/) || [])[1];
      return k && tem(params, k) && params[k] instanceof Node ? params[k] : document.createTextNode(troca(p));
    }));
  }
  const ATRIBUTOS = ['title', 'aria-label', 'placeholder'];
  function aplica(raiz = document) {
    for (const e of raiz.querySelectorAll('[data-i18n]')) {
      const lugares = {};
      for (const f of e.querySelectorAll('[data-i18n-lugar]')) lugares[f.dataset.i18nLugar] = f;
      rico(e, e.dataset.i18n, lugares);
    }
    for (const a of ATRIBUTOS) {
      for (const e of raiz.querySelectorAll(`[data-i18n-${a}]`)) e.setAttribute(a, t(e.getAttribute(`data-i18n-${a}`)));
    }
  }
  document.documentElement.lang = lang;
  // o texto da lingua de reserva (o ingles): a reserva do que tem um desenho por palavra (os botoes do Locutor)
  const reserva = k => (tem(d.reserva, k) ? d.reserva[k] : undefined);
  return { lingua: d.lingua, lang, tem: existe, t, tp, num, rico, aplica, reserva };
})();
</script>

<script>
'use strict';
// os textos da marcacao na lingua de quem usa (o I18N, no <head>), antes de qualquer coisa ler ou medir a tela; a
// pagina so aparece depois, e aparece mesmo se der erro aqui
try { I18N.aplica(); } finally { document.documentElement.classList.add('i18n-ok'); }
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduz = matchMedia('(prefers-reduced-motion: reduce)');
/* o palco da mesa (pedido dele, 06/11): a mesa monta sempre num tamanho fixo, PALCO_W x PALCO_H (a proporcao do mock
   B), e a pagina escala tudo para caber na janela, centrado; o que a janela tem de outra proporcao vira faixa de parede.
   Quando da, a escala cai num numero inteiro de pixels da tela por celula de 2 px (no notebook dele, 3x3), para o
   pixel art ficar nitido e sem costura (o ajustarPalco diz quanto pode passar ou perder). O getBoundingClientRect vem escalado; o rectP devolve a
   caixa no tamanho do palco, com a origem no canto dele */
const PALCO_W = 1920, PALCO_H = 1026, PALCO_PE = 14, PALCO = { k: 1, w: 0, h: 0, x: 0, y: 0 };
// PALCO_PE: a madeira embaixo do pe do feltro (a barra de cima tem 15 no palco; o mock ~22 em 1080). So no encaixe e
// no centramento: a caixa do palco (layout, --palco-h, fonte, cabos com y1 = PALCO_H) segue com PALCO_H
function ajustarPalco() {
  const st = document.documentElement.style;
  if (!document.body.classList.contains('mesa-dj')) {
    PALCO.k = 1; PALCO.x = PALCO.y = 0;
    for (const p of ['--palco-k', '--palco-w', '--palco-h', '--palco-x', '--palco-y']) st.removeProperty(p);
    return;
  }
  const W = innerWidth, H = innerHeight, d = devicePixelRatio || 1, enc = Math.min(W / PALCO_W, H / PALCO_H);
  const encPe = Math.min(W / PALCO_W, H / (PALCO_H + PALCO_PE));
  // a celula num numero inteiro de pixels da tela: o inteiro de cima, se o palco passa no maximo 1,2% da janela (corta
  // so a folga da beira; a janela do notebook dele tem 768 de altura, e 0,7485 punha 2 costuras na onda, pedido dele);
  // senao o de baixo, perdendo no maximo 10% do tamanho; senao o encaixe exato. O de baixo e o encaixe contam a folga
  // do pe (PALCO_PE): na janela maximizada a pedaleira colava no pe da janela (revisao da r12)
  const x2 = 2 * enc * d, cima = Math.ceil(x2 - 1e-6), x2p = 2 * encPe * d, baixo = Math.floor(x2p + 1e-6);
  const k = cima >= 1 && cima / x2 <= 1.012 ? cima / (2 * d) : baixo >= 1 && baixo / x2p >= .9 ? baixo / (2 * d) : encPe;
  // centrado, com a origem num pixel inteiro da tela; (r16) 1 celula para a esquerda: a sombra de 2 celulas das pecas
  // cai a direita e a madeira visivel da beira direita ficava 3 css menor que a da esquerda (a madeira anda junto)
  const px_ = v => Math.round(v * d) / d;
  const pe = Math.max(0, Math.min(PALCO_PE, H / k - PALCO_H));
  PALCO.k = k; PALCO.w = PALCO_W; PALCO.h = PALCO_H; PALCO.x = px_((W - PALCO_W * k) / 2 - 2 * k); PALCO.y = px_((H - (PALCO_H + pe) * k) / 2);
  st.setProperty('--palco-k', String(k)); st.setProperty('--palco-w', PALCO_W + 'px'); st.setProperty('--palco-h', PALCO_H + 'px');
  st.setProperty('--palco-x', PALCO.x + 'px'); st.setProperty('--palco-y', PALCO.y + 'px');
}
addEventListener('resize', ajustarPalco);
function rectP(e) {
  const r = e.getBoundingClientRect(), k = PALCO.k;
  if (k === 1 && !PALCO.x && !PALCO.y) return r;
  const left = (r.left - PALCO.x) / k, top = (r.top - PALCO.y) / k, width = r.width / k, height = r.height / k;
  return { left, top, width, height, right: left + width, bottom: top + height, x: left, y: top };
}
// a largura do palco (ou da janela, sem a mesa), para prender o que abre por cima dentro dele
const larguraPalco = () => PALCO.k === 1 ? innerWidth : PALCO.w;

const S = {
  state: null, lib: [], jobs: [], pos: 0, levels: { mic: 0, track: 0, out: 0 },
  online: null, jaConectou: false, desligado: false,
  pareando: false,        // celular sem pareamento: o #tela-parear pede o codigo do PC
  caps: null,             // o que esta pagina pode, pelo servidor ({papel, rotas}); null ate ele dizer
  atualizando: null,      // a versao que o instalador esta pondo: a pagina recarrega quando o Ritmelli voltar
  busca: null,            // null = prateleira; {q, link, itens, carregando, erro}
  buscaSeq: 0,
  jobAlvo: {},            // id do job -> youtube_id
  jobCorpo: {},           // id do job -> corpo do POST, para tentar de novo
  vistoFora: new Set(),   // (#53) os discos (id do YouTube ou link) que o prato ou a fila mostrou fora da prateleira
  libOk: false,           // (#53) a prateleira ja chegou do servidor
  chegou: new Map(),      // (#53) o que cada download desta pagina trouxe: alvo -> id do item na prateleira
  segurando: {},          // slider sendo mexido: chave -> instante
  arrastandoSeek: false,
  rotuloId: undefined,
  efeitos: null,          // lista de /api/effects, na ordem de exibicao
  erroEfeitos: null,
  gaveta: false,          // gaveta de efeitos aberta (so conta no computador)
  palco: false,           // toca-discos aberto por cima da prateleira (so no celular)
};
const SEM_EFEITO = 'nenhum';
/* a mesa de DJ (computador largo): lado = onde esta o deck no ar ('a' na esquerda, 'b' na direita); o deck da deixa
   fica com a proxima da fila; antes = o disco que saiu na ultima troca de lado (ele segue no deck dele enquanto soa
   na passagem); bpm = o andamento medido de cada disco que passou pela fila */
const MESA = { montada: null, lado: 'a', idAr: null, trAr: null, antes: null, deixa: null, bpm: new Map(), trocaT: 0 };

const SITUACAO = { idle: I18N.t('deck.status.idle'), buffering: I18N.t('deck.status.buffering'), playing: I18N.t('deck.status.playing'),
                   paused: I18N.t('deck.status.paused'), ended: I18N.t('deck.status.ended') };
function semCaminho(t) { return String(t || '').replace(/[A-Za-z]:\\(?:[^\\\s]+\\)+([^\\\s]+)/g, '$1'); }
/* a mensagem do servidor ({key, params, text}, o formato no API.md) na lingua de quem usa: a chave pelos arquivos do
   tema, com os params (o param que e outra mensagem tambem se traduz); sem a chave, ou com uma que o tema nao tem, o
   texto em ingles dela. O caminho do Windows sai: o nome do arquivo basta */
function textoMsg(m) {
  if (!m) return '';
  if (typeof m === 'string') return semCaminho(m);
  if (!m.key || !I18N.tem(m.key)) return semCaminho(m.text);
  const p = {};
  for (const [k, v] of Object.entries(m.params || {})) p[k] = v && typeof v === 'object' ? textoMsg(v) : typeof v === 'string' ? semCaminho(v) : v;
  return I18N.t(m.key, p);
}
/* o detalhe tecnico de uma mensagem (o motivo do yt-dlp, na busca e no download), para a letra pequena */
function detalheMsg(m) {
  const r = m && m.params && m.params.reason;
  return r ? textoMsg(r) : '';
}
function fmt(s) {
  if (s == null || !isFinite(s)) return '0:00';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`;
}

// sobe a cada pareamento aceito: o 401 de um pedido feito antes dele (que chega atrasado) nao volta a tela do codigo
let geracaoPareamento = 0;
async function api(method, path, data) {
  const geracao = geracaoPareamento;
  let r;
  try {
    r = await TRANSPORTE.pedir(method, path, data);
  } catch (e) {
    // status 0: nenhuma resposta (a busca testa o status, e nao o texto)
    const x = new Error(I18N.t('error.noResponse')); x.status = 0;
    throw x;
  }
  const j = r.json;
  if (!r.ok || (j && j.ok === false)) {
    // o 401 do pareamento traz o caps de antes de parear: a tela do codigo, sem os controles do PC
    if (r.status === 401 && j && j.parear && geracao === geracaoPareamento) pedirPareamento(j.desconectado, j.caps);
    // a mensagem do servidor ja traduzida; ela mesma segue no erro, para quem decide pelo tipo (a busca)
    const m = j && j.error;
    const e = new Error(m ? textoMsg(m) : I18N.t('error.generic', { status: r.status }));
    e.status = r.status; e.msg = m || null;
    throw e;
  }
  return j;
}

/* ---------- capas ---------- */
const PALETAS = [
  ['#F3A73C', '#2A1812', '#23382E'],
  ['#23382E', '#EEE3CF', '#F3A73C'],
  ['#5E1C25', '#EEE3CF', '#F3A73C'],
  ['#CFC7B8', '#2A1812', '#5E1C25'],
  ['#1E4A52', '#EEE3CF', '#F3A73C'],
];
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function capaGerada(it, curta) {
  const h = hash(it.id || it.title);
  const [bg, fg, dot] = PALETAS[h % PALETAS.length];
  const d = el('div', 'capa-gerada');
  d.style.setProperty('--bg', bg); d.style.setProperty('--fg', fg); d.style.setProperty('--dot', dot);
  const titulo = (it.title || I18N.t('shelf.untitled')).trim();
  if (!curta) {
    // bolas no alto da capa: uma cheia grande, um aro e uma pequena, em posicoes que variam por som
    const g = 28 + (h >> 4) % 10;
    const gx = 50 + (h >> 8) % (92 - 50 - g + 1), gy = 8 + (h >> 12) % 8;
    const b1 = el('span', 'bola'); b1.style.cssText = `width:${g}cqw;height:${g}cqw;left:${gx}cqw;top:${gy}cqw`;
    // o aro cruza a bola cheia, como um disco saindo da capa
    const a = Math.round(g * .82);
    const ax = gx - a * .55, ay = gy + g * .38;
    const b2 = el('span', 'bola aro'); b2.style.cssText = `width:${a}cqw;height:${a}cqw;left:${ax}cqw;top:${ay}cqw`;
    d.append(b1, b2);
  }
  d.append(el('span', 't', curta ? titulo.charAt(0).toUpperCase() : titulo));
  return d;
}
function arte(it, curta) {
  if (!it.thumb) return capaGerada(it, curta);
  const img = new Image();
  img.alt = ''; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.src = it.thumb;
  img.addEventListener('error', () => img.replaceWith(capaGerada(it, curta)), { once: true });
  return img;
}

/* ---------- braco: o angulo segue o raio do sulco ---------- */
// o prato e 4% menor que o lugar dele, em volta do mesmo centro (a moldura grossa do toca-discos, 19/10): o sulco tambem.
// (#50) A agulha e a ponta da cabeca, e nao um ponto no eixo do tubo: no dev/pecas.py a cabeca (8,8 cqw) dobra 24 graus
// a 53,5 cqw do pivo, entao a ponta fica a 61,6 cqw dele (L) e 3,3 graus a frente do tubo (desvio). Com o ponto no eixo,
// a 62 cqw, a agulha comecava a faixa em 84% do raio, para dentro do disco
const CABECA = { dobra: 53.5, comp: 8.8, ang: 24 * Math.PI / 180 };
const G = { cx: 40, cy: 40, R: (36 - 2.6) * .96, px: 88, py: 12,
            L: Math.hypot(CABECA.comp * Math.sin(CABECA.ang), CABECA.dobra + CABECA.comp * Math.cos(CABECA.ang)),
            desvio: Math.atan2(CABECA.comp * Math.sin(CABECA.ang), CABECA.dobra + CABECA.comp * Math.cos(CABECA.ang)) };
// onde a ponta esta no disco com o braco no angulo th (radianos), em fracao do raio
const pontaNoDisco = th => Math.hypot(G.px - G.L * Math.sin(th + G.desvio) - G.cx, G.py + G.L * Math.cos(th + G.desvio) - G.cy) / G.R;
// (#50) a faixa comeca com a agulha na borda, onde ela entra num disco de verdade (a ponta a 95% do raio: com a largura
// da cabeca, rente a borda)
const BRACO_INICIO = 0.95;
// o ponto no eixo do tubo, a 62 cqw do pivo: a conta do sulco ate o #50. O fim do curso segue nela
const EIXO_L = 62;
const eixoNoDisco = th => Math.hypot(G.px - EIXO_L * Math.sin(th) - G.cx, G.py + EIXO_L * Math.cos(th) - G.cy) / G.R;
// (07/11, pedido do dono) o fim do curso na ultima ranhura: o angulo em que o ponto no eixo fica a 50% do raio (com 41% a
// cabeca do braco parava em cima do selo). (#50) O mesmo angulo de antes, pela mesma busca: so o comeco mudou
function anguloDoEixo(f) {
  const alvo = G.R * f;
  let a = 10, b = 70;
  for (let i = 0; i < 26; i++) {
    const m = (a + b) / 2, r = m * Math.PI / 180;
    if (Math.hypot(G.px - EIXO_L * Math.sin(r) - G.cx, G.py + EIXO_L * Math.cos(r) - G.cy) > alvo) a = m; else b = m;
  }
  return (a + b) / 2;
}
const BRACO_FIM_ANG = anguloDoEixo(0.50);
const BRACO_FIM = pontaNoDisco(BRACO_FIM_ANG * Math.PI / 180);   // a ponta, no fim, a uns 40% do raio
function anguloPara(p) {
  if (p >= 1) return BRACO_FIM_ANG;
  const alvo = BRACO_INICIO - p * (BRACO_INICIO - BRACO_FIM);
  // ate 55 graus a ponta so entra no disco (ela passa mais perto do centro a uns 57 e sai de novo)
  let a = 10, b = 55;
  for (let i = 0; i < 26; i++) {
    const m = (a + b) / 2;
    if (pontaNoDisco(m * Math.PI / 180) > alvo) a = m; else b = m;
  }
  return (a + b) / 2;
}
const BRACO_INICIO_ANG = anguloPara(0);
// o desenho do braco para o angulo (as ANGULOS do dev/pecas.py): o descanso e seis no curso do disco, de 28 a 48 graus,
// de 4 em 4, e o tema gira no maximo 2 graus em cima do desenho. O de 28 (#50) e o do comeco da faixa, a uns 27 graus
const desenhoDoBraco = ang => ang < 15 ? 'repouso' : ang < 30 ? 'inicio' : ang < 34 ? 'a' : ang < 38 ? 'b' : ang < 42 ? 'c' : ang < 46 ? 'd' : 'e';
function posAtual() { return S.pos; }
function moverBraco() {
  const s = S.state;
  // o braco de pixel descansa reto: a 3 graus o degrau do tubo vira dente solto (o descanso anda junto)
  let ang = 0;
  if (s && s.track && s.status !== 'ended' && s.status !== 'idle') {
    const dur = s.duration || s.track.duration;
    const p = dur ? clamp(posAtual() / dur, 0, 1) : 0;
    ang = anguloPara(p);
  }
  mudar($('#braco'), '--ang', ang.toFixed(1) + 'deg');
  desenhoBraco(ang);
}
/* o braco e um desenho em pixel ja inclinado (dev/pecas.py), um por faixa de angulo (o desenhoDoBraco()). Na troca de
   faixa o braco esta andando (o tema gira em 1 s): o desenho novo espera ele cobrir uns 45% do caminho, para nenhum dos
   dois girar longe do seu angulo */
let faixaBraco = null, trocaBraco = 0;
function desenhoBraco(ang) {
  const f = desenhoDoBraco(ang);
  if (f === faixaBraco) return;
  const imediato = faixaBraco === null || matchMedia('(prefers-reduced-motion: reduce)').matches;
  faixaBraco = f;
  clearTimeout(trocaBraco);
  if (imediato) $('#braco').dataset.desenho = f;
  else trocaBraco = setTimeout(() => { $('#braco').dataset.desenho = f; }, 200);
}

/* ---------- prato e faixa ---------- */
const IC_TOCAR = '<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>';
const IC_PAUSAR = '<rect x="6" y="5" width="4.2" height="14" rx="1" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1" fill="currentColor"/>';
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>';
const IC_MIC = MIC_SVG + '</svg>';
const IC_MIC_CORTADO = MIC_SVG + '<path d="M4 4l16 16" stroke-width="2.2"/></svg>';

function desenharFaixa() {
  const s = S.state; if (!s) return;
  const tr = s.track, st = s.status;
  document.body.dataset.status = st;
  $('#prato').classList.toggle('com-disco', !!tr);
  const id = tr ? tr.id + '|' + (tr.thumb || '') : null;
  if (id !== S.rotuloId) {
    S.rotuloId = id;
    $('#rotulo').replaceChildren(tr ? arte(tr, true) : '');
    $('#mini-rotulo').replaceChildren(tr ? arte(tr, true) : '');
  }
  porTitulo(tr ? tr.title : I18N.t('deck.noDisc'), !!tr);
  $('#canal-faixa').textContent = tr ? (tr.channel || I18N.t('deck.noChannel')) : dicaPrato();
  // com error o leitor para e o servidor marca ended: nao e "chegou ao fim"
  $('#situacao').textContent = s.error && st !== 'playing' ? I18N.t('deck.status.error') : (SITUACAO[st] || st);
  const lf = $('#lamp-faixa');
  lf.className = 'lampada' + (s.error && st !== 'playing' ? ' alerta' : st === 'playing' ? ' acesa' : st === 'buffering' ? ' acesa piscando' : '');

  const dur = s.duration || (tr && tr.duration) || 0;
  const sk = $('#seek');
  sk.disabled = !tr || !dur;
  sk.max = dur || 0;
  $('#t-dur').textContent = fmt(dur);

  // som rapido tocando por cima: o botao e Pausar mesmo sem disco no prato ou com ele parado, e cala os sons
  // (sem disco no prato o pausar ficava apagado e nao dava para parar o som rapido)
  const sobre = !!(s.por_cima && s.por_cima.length);

  else if (st === 'ended') rot = I18N.t('deck.playAgain');

  }

  rotularMini();

  desenharMesa();
}

    mudar($('#t-pos'), 'textContent', fmt(p));

    mudar(sk, '--f', dur ? (p / dur).toFixed(4) : '0');   // a fracao: o ambar ate o centro do cursor de pixel
    mudar(sk, 'aria-valuetext', I18N.t('deck.timeOf', { pos: fmt(p), total: fmt(dur) }));

<script>
'use strict';

/* ---------- receptor ---------- */
/* o volume do disco anda numa escala perceptiva: o ganho e a posicao ao cubo. Linear, 2% era -34 dB e 3% -30 dB, e
   no volume de lobby cada passo pulava 2,5 a 3,5 dB; ao cubo, do silencio ate 10% do ganho cabem 46 dos 100 passos, e
   perto de 2% cada passo muda ~1 dB. O motor, a API e o config.json seguem com o ganho linear de 0 a 1. A voz fica
   linear: e o nivel do microfone no Windows, com o numero que ele mostra */
const FADERS = [['#f-vol', '#o-vol', 'vol', true], ['#f-mon', '#o-mon', 'mon_vol', true], ['#f-mic', '#o-mic', 'mic_vol', false]];
const ganhoDaPos = p => (p / 100) ** 3;
const posDoGanho = g => Math.round(Math.cbrt(Math.max(0, Math.min(1, g))) * 100);

function dbDoGanho(g) { return g > 0 ? I18N.t('mixer.gainDb', { db: I18N.num(20 * Math.log10(g), 1).replace('-', '−') }) : I18N.t('mixer.gainMuted'); }
function rotularFader(f, o, curva, g) {   // g: o ganho que o motor tem (o leitor de tela diz em dB)
  o.textContent = f.value + '%';
  if (curva) f.setAttribute('aria-valuetext', `${f.value}%, ${dbDoGanho(g)}`);
}
function desenharReceptor() {
  const s = S.state; if (!s) return;
  const agora = Date.now();
  for (const [fi, oi, k, curva] of FADERS) {
    if (agora - (S.segurando[k] || 0) < 900) continue;
    // sem a chave "Fone ligado", o fone desligado aparece como volume zero
    const f = $(fi), g = k === 'mon_vol' && !s.monitor_on ? 0 : s[k] || 0;
    f.value = curva ? posDoGanho(g) : Math.round(g * 100); pintarFader(f); rotularFader(f, $(oi), curva, g);
  }
  // fone "Nenhum" no dialogo: o volume do fone nao tem efeito, entao apaga e diz por que
  const semFone = !!s.active_devices && !s.active_devices.monitor;
  $('#f-mon').disabled = semFone;
  $('#f-mon').closest('.fader').title = semFone ? I18N.t('mixer.noHeadphones') : '';
  $('label[for="f-mon"] small').textContent = semFone ? I18N.t('mixer.noHeadphonesShort') : '';
  ligarChave($('#b-cortar'), s.mic_mute);
  // o volume automatico (no Microfone e fone): ligado, a alta desce e a baixa sobe ate o mesmo volume; diz quanto nesta
  $('#b-nivelar').closest('.nivelar').hidden = !('volume_auto' in s);   // servidor antigo: sem a chave
  ligarChave($('#b-nivelar'), !!s.volume_auto);
  const gdb = s.ganho_db || 0;
  $('#dd-nivelar').textContent = !s.volume_auto ? I18N.t('devices.autoVolumeOff')
    : I18N.t('devices.autoVolumeOn') + (Math.abs(gdb) < 0.05 ? ''
      : ' ' + I18N.t(gdb > 0 ? 'devices.autoVolumeUp' : 'devices.autoVolumeDown', { db: I18N.num(Math.abs(gdb), 1) }));
  for (const mc of [$('#mini-cortar'), $('#palco-cortar')]) {   // o da barra e o do cabecalho do palco
    if (mc._cortada === !!s.mic_mute) continue;
    mc._cortada = !!s.mic_mute;
    mc.setAttribute('aria-pressed', s.mic_mute ? 'true' : 'false');
    mc.classList.toggle('cortada', !!s.mic_mute);
    mc.title = s.mic_mute ? I18N.t('voice.mutedTap') : I18N.t('voice.mute');
    mc.innerHTML = s.mic_mute ? IC_MIC_CORTADO : IC_MIC;
  }
  const mt = $('#b-mudo-topo');   // o do topo na pagina do disco (computador): o icone e o nome dizem o estado
  if (mt._cortada !== !!s.mic_mute) {
    mt._cortada = !!s.mic_mute;
    mt.setAttribute('aria-pressed', s.mic_mute ? 'true' : 'false');
    mt.classList.toggle('cortada', !!s.mic_mute);
    mt.title = s.mic_mute ? I18N.t('voice.mutedClick') : I18N.t('voice.mute');
    mt.querySelector('.ic-mic').innerHTML = s.mic_mute ? IC_MIC_CORTADO : IC_MIC;
    mt.querySelector('.rot').textContent = s.mic_mute ? I18N.t('voice.muted') : I18N.t('voice.mute');
  }
  const mic = document.querySelector('.mostrador[data-k="mic"]');
  mic.classList.toggle('apagado', !!s.mic_mute);
  mic.querySelector('.nome-m').textContent = s.mic_mute ? I18N.t('mixer.meter.voiceMuted') : I18N.t('mixer.meter.voice');
  desenharEfeito();
}

<script>
'use strict';

/* ---------- palco (celular): o toca-discos abre por cima da prateleira pela barra de baixo;
   o voltar do Android fecha ele em vez de sair da pagina ---------- */
/* cada carga da pagina marca as entradas que poe na historia: o Chrome recarrega a aba que
   descartou em segundo plano (e o puxar para atualizar recarrega) com as entradas de antes
   ainda na pilha, que dizem aberto o que a pagina nova nao abriu */
const VIDA = Math.random().toString(36).slice(2);
const nossa = st => !!(st && (st.busca || st.palco || st.folha));
history.replaceState({ vida: VIDA }, '');
let palcoNaHistoria = false;
let animaPalco = 0, inertDepois = 0;
function animarPalco() {
  const p = $('#palco');
  p.classList.add('anima');
  clearTimeout(animaPalco);
  animaPalco = setTimeout(() => p.classList.remove('anima'), 450);
}
function abrirPalco(on) {
  on = !!on && celular();
  if (on === S.palco) return;
  S.palco = on;
  animarPalco();
  document.body.classList.toggle('com-palco', on);
  const p = $('#palco');
  if (on) { p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); p.setAttribute('aria-label', I18N.t('nav.deck')); }
  else { p.removeAttribute('role'); p.removeAttribute('aria-modal'); p.removeAttribute('aria-label'); }
  p.classList.remove('puxando'); p.style.transform = ''; $('#mini').style.opacity = '';
  for (const x of [$('.topo'), $('#mini')]) x.inert = on;
  // o que fica a vista quando a animacao para destrava ja no toque: a parte de cima do palco ao abrir,
  // a prateleira ao fechar. Com a troca so no fim, o primeiro toque logo depois de abrir caia no fundo
  // do palco e nao apertava nada (19/10). Sao uns 350 e 560 elementos (3 a 5 ms com a CPU 4x
  // mais lenta); a gaveta de pedais (1850, abaixo da dobra) e o que sai de vista trocam so com a
  // animacao terminada: o inert recalcula o estilo de cada descendente, e no quadro do toque os 2900
  // juntos davam 20 a 40 ms no celular de teste segurando o comeco da subida e da descida (medido, 18/10)
  if (on) inertPalco(x => x.id !== 'gaveta'); else $('.parede').inert = false;
  clearTimeout(inertDepois);
  inertDepois = setTimeout(() => { $('.parede').inert = S.palco; inertPalco(); }, 460);
  $('#mini-abrir').setAttribute('aria-expanded', on ? 'true' : 'false');
  // o foco entra no palco (sem anel; o Tab segue para o fechar) e volta para a barra ao sair
  if (on) p.focus({ preventScroll: true });
  else if (!toque()) $('#mini-abrir').focus();
}
function fecharPalco() {
  // desce ja, de onde estiver; o resto (foco, inert) vem no popstate
  animarPalco();
  document.body.classList.remove('com-palco');
  $('#palco').classList.remove('puxando'); $('#palco').style.transform = ''; $('#mini').style.opacity = '';
  if (palcoNaHistoria) history.back(); else abrirPalco(false);
}
/* recolhido no celular, so a barra do palco responde (o resto esta fora da tela); `so` escolhe os filhos */
function inertPalco(so = () => true) {
  const fora = celular() && !S.palco;
  for (const x of $('#palco').children) if (x.id !== 'mini' && so(x)) x.inert = fora;
}
function abrirPalcoComHistoria() {
  if (!S.palco) $('#palco').scrollTop = 0;
  abrirPalco(true);
  if (S.palco && !palcoNaHistoria) { history.pushState({ palco: true, vida: VIDA }, ''); palcoNaHistoria = true; }
}
/* ---------- pagina do disco (computador): a seta da barra de baixo troca a parede pelo toca-discos, o receiver e a
   maleta do A seguir, como a pagina do player do YouTube Music. A seta de novo, o Esc ou uma busca voltam ---------- */
/* pagina unica (computador largo): tudo numa tela so, a do toca-discos, que nao fecha */
const mqUnica = matchMedia('(min-width: 1400px) and (min-aspect-ratio: 20/19)');
function paginaUnica() { return mqUnica.matches; }
function abrirDisco(on) {
  on = !!on && !celular();
  if (!on && paginaUnica()) return;
  if (on === !!S.disco) return;
  S.disco = on;
  document.body.classList.toggle('com-disco', on);
  if (on) { fecharMenu(false); abrirMaleta(true); }
  else if (S.gaveta) abrirGaveta(false);
  const rot = on ? I18N.t('nav.backToShelf') : I18N.t('nav.openDeck'), seta = $('#mini-seta');
  $('#b-pagina').title = rot;
  seta.setAttribute('aria-expanded', on ? 'true' : 'false'); seta.setAttribute('aria-label', rot); seta.title = rot;
  rotularMini();
}

  capa.append(tag);
  const borda = el('div', 'borda'); borda.setAttribute('aria-hidden', 'true');

  nome.append(document.createTextNode(it.title));
  const acoes = el('div', 'acoes');

  mais.innerHTML = svgMais();
  acoes.append(mais);

               el('span', 'prat-s', [pt.artista, it.duration ? fmt(it.duration) : null].filter(Boolean).join(' · ') || ' '), acoes);

  li._chave = chaveItem(it, i);

}

function jobsVisiveis() {
  const ids = new Set(S.lib.map(x => x.id));
  return S.jobs.filter(j => j.status === 'running' || j.status === 'error' || (j.status === 'done' && !ids.has(j.item_id)));
}

function liJob(j) {
  const li = el('li', 'disco-item chegando'); li.dataset.job = j.id;
  const capa = el('div', 'capa'); const papel = el('div', 'papel'); const furo = el('div', 'furo');
  papel.append(furo); capa.append(papel);
  const borda = el('div', 'borda'); borda.setAttribute('aria-hidden', 'true');

  li.append(capa, borda, ficha);
  atualizarJob(li, j);
  return li;
}
function atualizarJob(li, j) {
  const pr = Math.round((j.progress || 0) * 100);
  li.querySelector('.furo').style.setProperty('--pr', pr + '%');
  li.classList.toggle('falhou', j.status === 'error');
  li.querySelector('.nome').textContent = j.label;
  const acoes = li.querySelector('.acoes');
  const sig = j.status + '|' + JSON.stringify(j.error || null);
  if (li._sig === sig) return;
  li._sig = sig;
  acoes.replaceChildren();
  if (j.status === 'error') {
    const pe = el('p', 'erro-job', motivoDownload(detalheMsg(j.error)));
    if (j.error) { pe.append(el('small', null, detalheMsg(j.error))); pe.title = detalheMsg(j.error); }
    acoes.append(pe);
    if (S.jobCorpo[j.id]) {
      const b = el('button', 'btn-texto', I18N.t('shelf.retry')); b.type = 'button'; b.dataset.role = 'retentar'; b.dataset.job = j.id;
      acoes.append(b);
    }
  }
}

function desenharPrateleira() {
  const ul = $('#estante');
  const ativo = document.activeElement;
  const foco = ativo && ul.contains(ativo) ? { li: ativo.closest('li'), role: ativo.dataset.role } : null;
  const focoChave = foco && foco.li ? (foco.li.dataset.id || 'job:' + foco.li.dataset.job) : null;

  const queridos = [];
  S.lib.forEach((it, i) => {
    const k = 'i:' + it.id;
    let li = nos.get(k);
    if (!li || li._chave !== chaveItem(it, i)) {
      const novo = liDisco(it, i);
      if (li) li.replaceWith(novo);   // troca no lugar: o no velho nao fica pendurado na estante
      li = novo; nos.set(k, li);
    }
    queridos.push([k, li]);
  });
  for (const j of jobsVisiveis()) {
    const k = 'j:' + j.id;
    let li = nos.get(k);
    if (!li) { li = liJob(j); nos.set(k, li); } else atualizarJob(li, j);
    queridos.push([k, li]);
  }
  const vivos = new Set(queridos.map(q => q[0]));
  for (const [k, li] of nos) if (!vivos.has(k)) { li.remove(); nos.delete(k); }
  const vazio = ul.querySelector('.vazio');
  if (queridos.length) { if (vazio) vazio.remove(); }
  else if (!vazio) {
    const v = el('li', 'vazio');
    v.append(el('strong', null, I18N.t('shelf.empty')), document.createTextNode(I18N.t('shelf.emptyHint')));
    ul.append(v);
  }
  queridos.forEach(([, li], i) => { if (ul.children[i] !== li) ul.insertBefore(li, ul.children[i] || null); });
  // celular: 9 capas por pagina, lidas em fileiras de 3 (so o celular usa a posicao)
  queridos.forEach(([, li], i) => {
    mudar(li, '--c', String(Math.floor(i / 9) * 3 + i % 3 + 1)); mudar(li, '--r', String(Math.floor(i % 9 / 3) + 1));
    li.classList.toggle('pagina', i % 9 === 0);
  });
  const desejados = new Set(queridos.map(q => q[1]));
  [...ul.children].forEach(c => { if (!desejados.has(c) && !c.classList.contains('vazio')) c.remove(); });

  if (foco && !ul.contains(ativo)) {
    const alvo = focoChave && [...ul.children].find(x => (x.dataset.id || 'job:' + x.dataset.job) === focoChave);
    const b = alvo && (alvo.querySelector(`[data-role="${foco.role}"]`) || alvo.querySelector('button'));
    if (b) b.focus();
  }
  const n = S.lib.length;
  $('#conta').textContent = I18N.tp('shelf.count', n);
  if (S.state && !S.state.track) {
    $('#canal-faixa').textContent = dicaPrato();
    $('#mini-sub').textContent = dicaMini(); rotularMini();
  }
  marcarPrateleira();
  desenharRapidos();
  desenharContinuar();
  desenharPontos(queridos.length);
}

/* prateleira: as mais escutadas primeiro e as novas por ultimo (18/10; a escuta o
   servidor conta em `plays`). A ordem se faz quando a pagina abre: disco novo entra no fim, e
   ouvir um disco nao o tira do lugar com a pagina aberta (nada pula debaixo do dedo) */
const lugarLib = new Map();
function ordenarLib(lib) {
  if (!lugarLib.size) {
    [...lib].sort((a, b) => (b.plays || 0) - (a.plays || 0) || String(a.added || '').localeCompare(String(b.added || '')))
      .forEach((it, i) => lugarLib.set(it.id, i));
  }
  for (const it of lib) if (!lugarLib.has(it.id)) lugarLib.set(it.id, lugarLib.size);
  return [...lib].sort((a, b) => lugarLib.get(a.id) - lugarLib.get(b.id));
}

/* pontos da pagina da prateleira (celular), como no Jukebox digital do YouTube Music */
function desenharPontos(n) {
  const box = $('#pontos'), paginas = Math.ceil(n / 9);
  box.hidden = paginas < 2;
  if (box.childElementCount !== paginas) box.replaceChildren(...Array.from({ length: paginas }, () => el('span')));
  marcarPonto();
}
function marcarPonto() {
  const ul = $('#estante'), box = $('#pontos');
  if (box.hidden || !box.childElementCount) return;
  const i = Math.round(ul.scrollLeft / Math.max(1, ul.scrollWidth / box.childElementCount));
  [...box.children].forEach((p, k) => p.classList.toggle('aqui', k === i));
}

/* continuar ouvindo: os discos que pararam no meio, do jeito que estao na prateleira */
function desenharContinuar() {
  const its = S.lib.filter(it => (it.last_pos || 0) > 5 && it.duration - it.last_pos > 10).slice(0, 12);
  const ul = $('#cartoes');
  $('#continuar').hidden = !its.length;
  const chave = its.map(it => `${it.id}|${Math.round(it.last_pos)}|${it.title}`).join('/');
  if (ul._chave === chave) return;
  ul._chave = chave;
  ul.replaceChildren(...its.map(it => {
    const li = el('li', 'cartao'); li.dataset.id = it.id;
    const b = el('button', 'cartao-b'); b.type = 'button';
    b.setAttribute('aria-label', I18N.t('shelf.resumeFromItem', { time: fmt(it.last_pos), title: it.title }));
    const capa = el('span', 'cartao-capa'); capa.append(arte(it, false));
    const pr = el('span', 'cartao-prog'); pr.style.setProperty('--p', (it.last_pos / it.duration).toFixed(3));
    capa.append(pr);
    b.append(capa, el('span', 'cartao-tit', it.title), el('span', 'cartao-sub', I18N.t('shelf.resumeFrom', { time: fmt(it.last_pos) })));
    li.append(b);
    return li;
  }));
}

/* sons rapidos: os de ate 15 s, que o servidor toca por cima da musica, e os discos postos pelo
   menu de segurar (25/10), que tocam por cima inteiros, ate 2 min (RAPIDO_MAX_S do motor); a lampada acende
   enquanto o som esta tocando */
const CURTO_S = 15, RAPIDO_MAX_S = 120;
const curto = it => !!it.duration && it.duration <= CURTO_S;
function desenharRapidos() {
  const curtos = S.lib.filter(it => curto(it) || it.rapido);
  const chips = $('#chips');
  $('#rapidos').hidden = !curtos.length;
  $('#conta-rap').textContent = I18N.tp('pads.count', curtos.length);
  const chave = curtos.map(it => it.id + '|' + it.title).join('/');
  if (chips._chave !== chave) {
    chips._chave = chave;
    chips.replaceChildren(...curtos.map(it => {
      const b = el('button', 'compacto'); b.type = 'button'; b.dataset.id = it.id;
      b.setAttribute('aria-label', I18N.t('pads.playOver', { title: it.title }));
      // compacto de 7 polegadas: selo de papel na cor do som, como as capas geradas
      const [bg, fg] = PALETAS[hash(it.id || it.title) % PALETAS.length];
      const sete = el('span', 'sete'), gira = el('span', 'sete-gira'), rot = el('span', 'sete-rot');
      rot.style.setProperty('--bg', bg); rot.style.setProperty('--fg', fg);
      gira.append(rot); sete.append(gira); sete.setAttribute('aria-hidden', 'true');
      b.append(sete, el('span', 'lampada'), el('span', 't', it.title), el('span', 'd', fmt(Math.min(it.duration || 0, it.rapido ? RAPIDO_MAX_S : CURTO_S))));
      return b;
    }));
  }
  const tocando = new Set(((S.state && S.state.por_cima) || []).map(x => x.id));
  chips.querySelectorAll('.compacto').forEach(b => {
    const on = tocando.has(b.dataset.id);
    mudar(b.querySelector('.lampada'), 'class', 'lampada' + (on ? ' acesa' : ''));
    mudar(b, 'class', 'compacto' + (on ? ' tocando' : ''));
  });
  desenharPads(curtos);
}

function marcarPrateleira() {
  const tr = S.state && S.state.track;
  document.querySelectorAll('#estante .disco-item[data-id]').forEach(li => {
    li.classList.toggle('no-prato', !!tr && li.dataset.id === tr.id);
  });
}

/* ---------- comandos ---------- */
async function tocar(id, extra) {
  try { await api('POST', '/api/play', { id, ...(extra || {}) }); return true; }
  catch (e) { avisar(e.message, true); return false; }
}
async function cmd(path, okTxt) {
  try { await api('POST', path); if (okTxt) avisar(okTxt); }
  catch (e) { avisar(e.message, true); }
}
function alternar() {
  const s = S.state;
  // sons por cima com o disco parado (ou sem disco): o Pausar so cala os sons, o disco fica como esta
  const tocando = s && s.track && (s.status === 'playing' || s.status === 'buffering');
  if (s && s.por_cima && s.por_cima.length && !tocando) { cmd('/api/pause'); return; }
  if (!s || !s.track) {
    avisar(!S.lib.length ? I18N.t('shelf.emptyToast')
      : celular() ? I18N.t('deck.pickFirstPhone')
      : I18N.t('deck.pickFirstPc'));
    return;
  }
  if (s.status === 'ended') cmd('/api/resume');
  else cmd('/api/toggle');
}

const enviando = {}, ultimoEnvio = {};
function ajustar(k, v) {
  S.segurando[k] = Date.now();
  if (S.state) S.state[k] = v;
  clearTimeout(enviando[k]);
  const manda = () => {
    ultimoEnvio[k] = Date.now();
    api('POST', '/api/settings', { [k]: v }).catch(e => avisar(e.message, true));
  };
  if (Date.now() - (ultimoEnvio[k] || 0) > 110) manda(); else enviando[k] = setTimeout(manda, 110);
}

/* ---------- busca ---------- */
function ehLink(q) { return /^https?:\/\//i.test(q) || /(youtu\.be\/|youtube\.com\/)/i.test(q); }
function idDoLink(q) { const m = q.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }

async function buscar(q) {
  q = q.trim();
  if (!q) { $('#q').focus(); return; }
  abrirGaveta(false);   // os resultados aparecem na parede, onde a gaveta estava
  if (!celular() && !MESA.montada) abrirMaleta(false);   // a maleta aberta na prateleira nao entra na frente deles (na mesa a busca cai por cima de tudo)
  const seq = ++S.buscaSeq;
  if (ehLink(q)) {
    S.busca = { q, link: true, itens: [{ link: q, youtube_id: idDoLink(q) }], carregando: false, erro: null };
    $('#rolo-busca').scrollTop = 0;
    desenharBusca(); mostrarResultados(); return;
  }
  // buscando enquanto digita: os resultados da busca anterior ficam ate os novos chegarem
  S.busca = { q, link: false, itens: S.busca && !S.busca.link ? S.busca.itens : [], carregando: true, erro: null };
  $('#rolo-busca').scrollTop = 0;
  desenharBusca();
  mostrarResultados();
  try {
    const r = await api('GET', `/api/search?q=${encodeURIComponent(q)}&n=${POR_LEVA}`);
    if (seq !== S.buscaSeq || !S.busca) return;
    S.busca.itens = Array.isArray(r) ? r : [];
    S.busca.pedidos = POR_LEVA; S.busca.fim = !S.busca.itens.length;
  } catch (e) {
    if (seq !== S.buscaSeq || !S.busca) return;
    S.busca.erro = e.message; S.busca.semResposta = e.status === 0; S.busca.erroMsg = e.msg;
  }
  S.busca.carregando = false;
  desenharBusca();
  talvezMais();
}

/* carregar mais: chegando no fim da lista, pede a leva seguinte; o que ja
   esta na lista nao se repete. Servidor antigo devolve a primeira leva de novo: nada novo, fim */
const POR_LEVA = 20;
async function maisResultados() {
  const b = S.busca;
  if (!b || b.link || b.carregando || b.mais || b.fim || b.erro || !b.itens.length) return;
  b.mais = true; b.erroMais = null; desenharMais();
  try {
    const r = await api('GET', `/api/search?q=${encodeURIComponent(b.q)}&n=${POR_LEVA}&start=${b.pedidos || POR_LEVA}`);
    if (S.busca !== b) return;
    // o YouTube reordena as paginas a cada busca: a leva seguinte repete parte do que ja veio.
    // Acaba quando ele nao tem mais nada, em 200, ou depois de duas levas sem nada novo
    const lista = Array.isArray(r) ? r : [];
    const vistos = new Set(b.itens.map(x => x.youtube_id));
    const novos = lista.filter(x => x.youtube_id && !vistos.has(x.youtube_id));
    b.pedidos = (b.pedidos || POR_LEVA) + POR_LEVA;
    b.secas = novos.length ? 0 : (b.secas || 0) + 1;
    if (novos.length) b.itens = b.itens.concat(novos);
    if (!lista.length || b.secas >= 2 || b.pedidos >= 200) b.fim = true;
  } catch (e) {
    if (S.busca !== b) return;

/* o fim da lista ainda esta perto da tela depois da leva (lista curta, tela alta): pede mais */
function talvezMais() {

  const r = p.getBoundingClientRect(), c = $('#rolo-busca').getBoundingClientRect();
  const fundo = celular() ? innerHeight + 600 : Math.min(innerHeight, c.bottom) + 200;
  if (r.top < fundo) maisResultados();
}
function desenharMais() {

new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) maisResultados(); }, { rootMargin: '0px 0px 600px 0px' })
  .observe($('#mais-res'));

/* no celular a busca entra na historia, como o palco: o voltar do Android fecha os resultados
   em vez de sair da pagina (review) */
let buscaNaHistoria = false;
function mostrarResultados() {
  if (matchMedia('(max-width: 899.98px)').matches) {
    // os resultados vem logo abaixo do campo: o topo mostra os dois, com a seta de voltar
    scrollTo({ top: 0, behavior: reduz.matches ? 'auto' : 'smooth' });

/* o motivo do download que falhou, pelo detalhe tecnico (o do yt-dlp, em ingles) */
function motivoDownload(t) {
  t = String(t || '');
  if (/unavailable|private/i.test(t)) return I18N.t('download.reason.unavailable');
  if (/429|too many/i.test(t)) return I18N.t('download.reason.rateLimit');
  if (/getaddrinfo|network|timed out|connection|resolve/i.test(t)) return I18N.t('download.reason.network');
  // o "not a bot" tambem diz "sign in", mas e o YouTube desconfiando dos pedidos, nao o video: vem antes
  if (/not a bot/i.test(t)) return I18N.t('download.reason.bot');
  if (/confirm your age|age[- ]restricted|inappropriate/i.test(t)) return I18N.t('download.reason.age');
  if (/sign in|members[- ]only|login/i.test(t)) return I18N.t('download.reason.login');
  return I18N.t('download.reason.generic');
}
function fecharBusca() {
  S.busca = null; S.buscaSeq++;
  desenharBusca();
  // fechou pelo botao ou tocando um resultado: tira a entrada, senao o voltar seguinte nao faria
  // nada; com o palco por cima (download que terminou tocando) o popstate pula ela depois
  if (buscaNaHistoria && !palcoNaHistoria) { buscaNaHistoria = false; history.back(); }
}
function naPrateleira(yid) { return yid ? S.lib.find(x => x.youtube_id === yid) : null; }
function jobDe(alvo) {
  if (!alvo) return null;
  // o servidor novo diz o alvo de cada download (inclusive os que a fila comecou); o antigo, so o mapa daqui
  return S.jobs.find(j => (S.jobAlvo[j.id] === alvo || j.alvo === alvo) && (j.status === 'running' || j.status === 'error'));
}
/* (#53) o salvar na prateleira do disco no prato e das linhas do A seguir: no que nao esta na prateleira (o do
   Automatico, que so toca pelo stream, e o da busca ou da fila ainda baixando, ou que falhou) e, com o visto que tira de
   novo, como na busca, no que chegou nela enquanto a pagina o mostrava. O que ja estava na prateleira fica sem: a fila
   inteira com o visto so repetiria o que ela e.
   O disco e o que o servidor baixa: o id do YouTube ou o link colado (de outro site, sem id do YouTube). O link que
   chegou se acha pelo item que o download dele trouxe: o servidor tira o download terminado da lista em 20 s, e a pagina
   guarda o que cada um trouxe (S.chegou) */
const alvoDisco = x => (x && (x.youtube_id || x.url || x.alvo)) || null;
function lembrarChegadas() {
  for (const j of S.jobs) {   // na ordem do servidor: o download mais novo do mesmo disco (baixado de novo) vale
    const a = S.jobAlvo[j.id] || j.alvo;
    if (j.status !== 'done' || !j.item_id || !a) continue;
    S.chegou.set(a, j.item_id);
    // o disco do prato passa para o item da prateleira quando o arquivo chega (o id dele, do YouTube ou do site): o
    // visto segue nele
    if (S.vistoFora.has(a)) S.vistoFora.add(j.item_id);
  }
}
function discoNaPrateleira(x) {
  const a = alvoDisco(x), id = a && S.chegou.get(a);
  return naPrateleira(x && x.youtube_id) || (id && S.lib.find(it => it.id === id)) || null;
}
function mostraSalvar(x) {
  const a = alvoDisco(x);
  if (!a) return false;
  // so com a prateleira ja carregada: antes dela, todo disco parece fora (e ficaria com o visto ao chegar a lista)
  if (!discoNaPrateleira(x)) { if (S.libOk) S.vistoFora.add(a); return true; }
  return !!x.auto || S.vistoFora.has(a);
}
// o estado do salvar do disco (o do estadoSalvar, com o link colado e o que chegou pelo download dele)
const estadoDisco = x => discoNaPrateleira(x) ? ['salvo', 0] : estadoSalvar(x.youtube_id, x.url || x.alvo);
// o clique: como o da busca, e o que chegou sai da prateleira pelo item que o download trouxe
function salvarDisco(x) {
  const r = { youtube_id: x.youtube_id, link: x.youtube_id ? undefined : (x.url || x.alvo), title: x.title, channel: x.channel,
              thumb: x.thumb, duration: x.duration };
  const ja = discoNaPrateleira(x);
  if (ja) tirarDaPrateleira(ja, r); else salvarResultado(r);
}
/* servidor com fila e stream (o 8799 antigo nao tem ate reiniciar): sem ele, nada de fila na tela */
const temFila = () => !!(S.state && Array.isArray(S.state.queue));

function desenharBusca() {
  const vb = $('#vista-busca'), vp = $('#vista-prateleira');
  const b = S.busca;
  vb.hidden = !b; vp.hidden = !!b;
  document.body.classList.toggle('com-busca', !!b);   // a seta de voltar dentro do campo, no celular
  vigiarGavetaDaBusca();   // (#113) o toque fora da gaveta, na mesa
  if (!b) return;
  medirBusca();   // na mesa a busca cai debaixo do campo
  $('#titulo-busca').textContent = b.link ? I18N.t('search.pastedLink') : I18N.t('search.resultsFor', { query: b.q });
  $('#titulo-busca').title = $('#titulo-busca').textContent;
  const av = $('#aviso-busca'); av.className = 'aviso-busca'; av.replaceChildren();
  if (b.carregando) av.append(el('span', 'lampada acesa piscando'), document.createTextNode(I18N.t('search.searching')));
  else if (b.erro) {
    av.classList.add('erro');
    // pelo tipo, e nao pelo texto: sem resposta e o status 0 do api(), a busca do YouTube e a chave da mensagem, e o
    // limite e o motivo tecnico dela (o do yt-dlp, em ingles). O YouTube que demorou ("o YouTube não respondeu a
    // tempo") e erro do YouTube, e nao do Ritmelli fora do ar
    const fora = b.semResposta;
    const doYoutube = !!b.erroMsg && b.erroMsg.key === 'server.search.failed';
    const limite = /429|too many/i.test(detalheMsg(b.erroMsg));
    // o espaco depois do negrito fica dentro dele, como sempre foi
    if (fora) {
      av.append(el('strong', null, I18N.t('search.error.offline') + ' '), document.createTextNode(I18N.t('search.error.offlineHint')));
    } else if (doYoutube || limite) {
      const dica = I18N.t(limite ? 'search.error.rateLimitHint' : 'search.error.youtubeHint');
      av.append(el('strong', null, I18N.t('search.error.youtube') + ' '), document.createTextNode(dica));
      av.append(el('small', 'detalhe', I18N.t('search.error.detail', { detail: detalheMsg(b.erroMsg) })));
    } else {
      // outra recusa do servidor, ja traduzida pelo api() (ex.: a server.search.empty)
      av.append(el('strong', null, b.erro));
    }
  } else if (!b.link && !b.itens.length) av.textContent = I18N.t('search.noResults');
  else av.textContent = b.link ? I18N.t('search.linkHint') : '';
  av.hidden = !av.textContent;

  // a lista so se monta quando chegam resultados novos; o resto (anel, ✓, tocando) muda no lugar,
  // senao o progresso do download (15 vezes por segundo) trocaria a linha embaixo do dedo
  desenharMais();
  const ul = $('#resultados');
  if (ul._itens !== b.itens) {
    if (S.puxandoRes) { S.buscaPendente = true; return; }
    // a leva seguinte entra no fim, sem remontar o que ja esta na tela
    const antes = ul._itens, mais = antes && antes.length < b.itens.length && antes.every((x, i) => b.itens[i] === x);
    ul._itens = b.itens;
    if (mais) ul.append(...b.itens.slice(antes.length).map(liResultado));
    else ul.replaceChildren(...b.itens.map(liResultado));
  }
  atualizarResultados();
}

const tituloRes = r => r.link || r.title || I18N.t('shelf.untitled');

/* estado de cada linha: tocando agora, ⊕ livre, anel baixando, ✓ na prateleira ou erro */
function atualizarResultados() {
  const tr = S.state && S.state.track, st = S.state && S.state.status;
  for (const li of $('#resultados').children) {
    const r = li._r; if (!r) continue;
    const yid = r.youtube_id, t = tituloRes(r);
    const [est, pr] = estadoSalvar(yid, r.link);
    const tocando = !!tr && !!yid && tr.youtube_id === yid && st !== 'ended';
    const sig = [est, pr, tocando && st].join('|');
    if (li._sig === sig) continue;
    li._sig = sig;
    li.classList.toggle('no-prato', tocando);
    // uma linha so: a lampada quando esta no prato, o canal (ou o erro) e, no celular, a duracao;
    // o progresso do download fica no anel do ⊕
    const sub = li.querySelector('.sub'); sub.replaceChildren();
    if (tocando) sub.append(el('span', 'lampada acesa' + (st === 'buffering' ? ' piscando' : '')));
    sub.append(est === 'erro' ? el('span', 'canal erro-t', I18N.t('search.result.downloadFailed'))
      : el('span', 'canal', r.link ? I18N.t('search.pastedLink') : (r.channel || I18N.t('deck.noChannel'))));
    if (r.duration) sub.append(el('span', 'dur-s', `· ${fmt(r.duration)}`));
    li.querySelector('.linha').setAttribute('aria-label', I18N.t(tocando ? 'search.result.playOnPlatter' : 'search.result.play', { title: t }));
    pintarSalvar(li.querySelector('.salvar'), est, pr, t);
  }
}
/* o ⊕ de salvar na prateleira, o da busca e o da parecida no prato: livre, baixando (pr %), salvo ou erro */
function estadoSalvar(yid, link) {
  const jb = jobDe(yid) || (link && jobDe(link));
  const est = naPrateleira(yid) ? 'salvo' : jb && jb.status === 'running' ? 'baixando' : jb && jb.status === 'error' ? 'erro' : 'livre';
  return [est, jb ? Math.round((jb.progress || 0) * 100) : 0];
}
function pintarSalvar(s, est, pr, t) {
  const pixel = s.classList.contains('pixel');   // o da parecida no prato, desenhado pelo dev/pecas.py
  s.className = `acao-res salvar ${pixel ? 'pixel ' : ''}${est}`;
  s.setAttribute('aria-label', est === 'salvo' ? I18N.t('search.result.saved', { title: t })
    : est === 'baixando' ? I18N.t('search.result.downloading', { pct: pr, title: t })
    : I18N.t(est === 'erro' ? 'search.result.retry' : 'search.result.save', { title: t }));
  if (pixel) {   // baixando, o aro acende celula a celula no sentido do relogio (os rect ja vem nessa ordem)
    const aro = s.querySelectorAll('.sv-aro rect'), k = est === 'baixando' ? Math.round(aro.length * pr / 100) : 0;
    aro.forEach((r, i) => r.classList.toggle('on', i < k));
  }
  s.style.setProperty('--pr', pr + '%');
  if (!pixel) s.innerHTML = est === 'salvo' ? IC.salvo : est === 'baixando' ? '<span class="anel" aria-hidden="true"></span>' : IC.salvar;
}

const corpoDe = r => r.link ? { url: r.link } : { youtube_id: r.youtube_id, title: r.title, channel: r.channel, thumb: r.thumb, duration: r.duration };
/* tocar na linha: da prateleira se ja esta la; senao o servidor toca pelo stream na hora e baixa
   por tras (o antigo, sem stream, toca quando o download chega). A busca fica aberta, como no Spotify */
function tocarResultado(r) {
  const ja = naPrateleira(r.youtube_id);
  if (ja) tocar(ja.id);
  else baixar({ ...corpoDe(r), play: true }, r.link || r.youtube_id);
}
function salvarResultado(r) {
  const ja = naPrateleira(r.youtube_id);
  if (ja) { tirarDaPrateleira(ja, r); return; }
  const jb = jobDe(r.youtube_id) || jobDe(r.link);
  if (jb && jb.status === 'running') { avisar(I18N.t('download.already')); return; }
  baixar({ ...corpoDe(r), play: false }, r.link || r.youtube_id);
}

/* o ✓ da busca tira da prateleira, como no YouTube Music: sai na hora, com
   Desfazer no aviso (baixa de novo). Tocando agora, tambem sem perguntar: o disco segue no prato e o
   servidor apaga o arquivo quando ele sair */
async function tirarDaPrateleira(it, r) {
  try {
    await api('DELETE', `/api/library/${encodeURIComponent(it.id)}`);
    avisar(I18N.t('download.removed'), false, { rotulo: I18N.t('app.undo'), fn: () => baixar({ ...corpoDe(r), play: false }, r.link || r.youtube_id) });
  } catch (e) { avisar(e.message, true); }
}

async function baixar(corpo, alvo) {
  try {
    const r = await api('POST', '/api/library', corpo);
    if (r.job) {
      S.jobAlvo[r.job.id] = alvo; S.jobCorpo[r.job.id] = corpo;
      if (!S.jobs.some(j => j.id === r.job.id)) S.jobs = S.jobs.concat(r.job);
      if (!corpo.play) avisar(I18N.t('download.started'));
      else if (!r.streaming) avisar(I18N.t('download.startedPlay'));
    } else if (r.item && !corpo.play) avisar(I18N.t('download.alreadySaved'));
    if (S.busca) desenharBusca();
    desenharPrateleira();
  } catch (e) { avisar(e.message, true); }
}

/* ---------- opcoes de um disco ou resultado (o ...) ---------- */
/* ctx = {tipo: 'disco', id} da prateleira ou {tipo: 'resultado', r} da busca; no computador abre
   ao lado do botao, no celular sobe de baixo com o disco no alto */
let menuCtx = null, menuBotao = null, folhaNaHistoria = false, larguraMenu = 0;
function itensMenu(ctx) {
  const fila = temFila(), out = [];
  if (fila) out.push(['seguir', I18N.t('menu.playNext'), IC.aSeguir], ['fila', I18N.t('menu.addToQueue'), IC.fila]);
  if (ctx.tipo === 'disco') {
    const it = ctx.it;
    if ((it.last_pos || 0) > 5) out.unshift(['continuar', I18N.t('shelf.resumeFrom', { time: fmt(it.last_pos) }), IC.continuar]);
    // os de ate 15 s ja estao nos Sons rapidos sozinhos
    if (!curto(it)) {
      out.push(it.rapido ? ['semRapido', I18N.t('menu.removeQuick'), IC.semRapido]
        : ['rapido', I18N.t('menu.addQuick'), IC.rapido]);
    }
    out.push(['renomear', I18N.t('menu.rename'), IC.renomear]);
    if (it.youtube_id) out.push(['youtube', I18N.t('menu.openYoutube'), IC.youtube]);
    out.push(['apagar', I18N.t('menu.delete'), IC.apagar, 'perigo']);
  } else {
    const r = ctx.r, jb = jobDe(r.youtube_id) || jobDe(r.link);
    if (!naPrateleira(r.youtube_id) && !(jb && jb.status === 'running')) out.push(['salvar', I18N.t('shelf.save'), IC.salvar]);
    out.push(['youtube', I18N.t('menu.openYoutube'), IC.youtube]);
  }
  return out;
}
function abrirMenu(botao, ctx) {
  if (ctx.tipo === 'disco') { ctx.it = S.lib.find(x => x.id === ctx.id); if (!ctx.it) return; }
  menuCtx = ctx; menuBotao = botao;
  $('#aviso').hidden = true;   // o aviso de antes nao fica por cima das opcoes
  const m = $('#menu'), info = ctx.tipo === 'disco' ? ctx.it : ctx.r;
  const titulo = ctx.tipo === 'disco' ? info.title : tituloRes(info);
  const capa = el('span', 'capinha');
  capa.append(arte({ thumb: info.thumb || (info.youtube_id ? `https://i.ytimg.com/vi/${info.youtube_id}/mqdefault.jpg` : null), id: info.id || info.youtube_id || titulo, title: titulo }, true));
  const txt = el('span'); txt.append(el('span', 't', titulo), el('span', 's', [info.channel, info.duration ? fmt(info.duration) : null].filter(Boolean).join(' · ')));
  $('#menu-cab').replaceChildren(capa, txt);
  const lista = $('#menu-itens');
  lista.setAttribute('aria-label', I18N.t('menu.options', { title: titulo }));
  // na folha do celular a contracapa do LP: o LADO A antes da primeira faixa e o Apagar sozinho no LADO B (os dois
  // letreiros so desenho: o leitor de tela le as acoes)
  const folha = celular();
  const lado = (txt, cls) => { const x = el('div', cls, txt); x.setAttribute('aria-hidden', 'true'); return x; };
  lista.replaceChildren(...itensMenu(ctx).flatMap(([acao, rot, ic, cls], i) => {
    const b = el('button', cls); b.type = 'button'; b.setAttribute('role', 'menuitem'); b.dataset.acao = acao;
    b.innerHTML = IC_PX[acao] || ic; b.append(el('span', null, rot));
    if (!folha) return [b];
    if (cls === 'perigo') return [lado(I18N.t('menu.sideB'), 'lado lado-b'), b];
    return i === 0 ? [lado(I18N.t('menu.sideA'), 'lado'), b] : [b];
  }));
  m.hidden = false;
  larguraMenu = innerWidth;
  if (celular()) {
    m.classList.add('folha'); m.style.left = m.style.top = '';
    $('#menu-fundo').hidden = false;
    // o voltar do Android fecha as opcoes (a entrada leva junto o estado de baixo: busca, palco)
    if (!folhaNaHistoria) { history.pushState({ ...(history.state || {}), folha: true }, ''); folhaNaHistoria = true; }
  } else {
    m.classList.remove('folha');
    const r = botao.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    let x = r.right - mw, y = r.bottom + 6;
    if (y + mh > innerHeight - 8) y = r.top - mh - 6;
    m.style.left = clamp(x, 8, innerWidth - mw - 8) + 'px';

}
function fecharMenu(voltarFoco) {
  const m = $('#menu'); if (m.hidden) return;
  m.hidden = true; $('#menu-fundo').hidden = true;
  if (menuBotao) { menuBotao.setAttribute('aria-expanded', 'false'); if (voltarFoco && document.contains(menuBotao)) menuBotao.focus(); }
  menuBotao = null;

}
function executar(acao, ctx) {
  if (ctx.tipo === 'disco') {
    const it = ctx.it;
    if (acao === 'continuar') tocar(it.id, { resume: true });
    else if (acao === 'renomear') renomear(it);
    else if (acao === 'rapido' || acao === 'semRapido') marcarRapido(it, acao === 'rapido');
    else if (acao === 'apagar') apagar(it);
    else if (acao === 'seguir' || acao === 'fila') enfileirar({ id: it.id }, acao === 'seguir', it.title, null);
    else if (acao === 'youtube') abrirYoutube(it.youtube_id);
    return;
  }
  const r = ctx.r;
  if (acao === 'seguir' || acao === 'fila') enfileirar(corpoDe(r), acao === 'seguir', tituloRes(r), r.link || r.youtube_id);
  else if (acao === 'salvar') salvarResultado(r);
  else if (acao === 'youtube') abrirYoutube(r.youtube_id, r.link);
}
function abrirYoutube(yid, link) {
  const url = link || (yid ? `https://www.youtube.com/watch?v=${yid}` : null);

  let g = null, arrastouEm = 0;
  m.addEventListener('pointerdown', e => {
    noTopo();

    g = { id: e.pointerId, y0: e.clientY, x0: e.clientX, d: 0, v: 0, yAnt: e.clientY, tAnt: e.timeStamp, ativo: false };
  });
  m.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;

    if (!g.ativo) {

      if (d <= 0 || Math.abs(dx) > Math.abs(d)) { g = null; return; }
      g.ativo = true; m.classList.add('puxando');

    if (e.timeStamp > g.tAnt) { g.v = (e.clientY - g.yAnt) / (e.timeStamp - g.tAnt); g.yAnt = e.clientY; g.tAnt = e.timeStamp; }

  m.addEventListener('touchmove', e => { if (g && g.ativo && e.cancelable) e.preventDefault(); }, { passive: false });

      if (ant && dy < -tam(ant) / 2) { li.after(ant); y0 -= tam(ant); dy += tam(ant); }
      else if (prox && dy > tam(prox) / 2) { ul.insertBefore(prox, li); y0 += tam(prox); dy -= tam(prox); }
      numerarFila(sec);
      li.style.transform = deLado ? `translateX(${dy}px)` : `translateY(${dy}px)`;
    };
    const soltar = () => {
      a.removeEventListener('pointermove', mover); a.removeEventListener('pointerup', soltar); a.removeEventListener('pointercancel', soltar);
      li.style.transform = ''; li.classList.remove('arrastando');
      S.arrastandoFila = false;
      const para = [...ul.children].indexOf(li);
      if (para !== de) moverNaFila(li.dataset.qid, para);
      else { S.filaSig = null; desenharFila(); }
    };
    a.addEventListener('pointermove', mover); a.addEventListener('pointerup', soltar); a.addEventListener('pointercancel', soltar);
  });
}

/* busca: tocar na linha toca, o ⊕ salva, o ... abre as opcoes */
$('#resultados').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const li = b.closest('.resultado'); if (!li || !li._r || li._semClique) return;
  if (b.dataset.role === 'tocar') tocarResultado(li._r);
  else if (b.dataset.role === 'salvar') salvarResultado(li._r);
  else if (b.dataset.role === 'mais') { if (menuBotao === b) fecharMenu(true); else { fecharMenu(false); abrirMenu(b, { tipo: 'resultado', r: li._r }); } }
});
/* puxar a linha para a direita poe na fila, como no Spotify: a faixa ambar
   aparece por baixo, o celular vibra quando passa do ponto e a linha volta sozinha ao soltar. So
   no dedo e so com o servidor novo; o pan-y deixa a pagina rolar na vertical */
(() => {
  const ul = $('#resultados'), PONTO = 88;
  let g = null;
  ul.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || !temFila()) return;
    const li = e.target.closest('.resultado');
    if (!li || !li._r || e.target.closest('[data-role="mais"], [data-role="salvar"]')) return;
    g = { li, id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, passou: false };
  });
  ul.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if (!g.ativo) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (dx <= 0 || Math.abs(dy) >= Math.abs(dx)) { g = null; return; }   // rolagem, ou para a esquerda
      g.ativo = true; S.puxandoRes = true;
      g.li.classList.remove('voltando'); g.li.classList.add('puxando');
    }
    const x = dx <= PONTO ? Math.max(0, dx) : PONTO + (dx - PONTO) * .3;
    g.li.querySelector('.corpo').style.transform = `translateX(${x}px)`;
    const passou = dx >= PONTO;
    if (passou !== g.passou) {
      g.passou = passou; g.li.classList.toggle('vai', passou);
      if (passou && navigator.vibrate) navigator.vibrate(12);
    }
  });
  function soltar(e, cancelou) {
    if (!g || e.pointerId !== g.id) return;
    const { li, ativo, passou } = g;
    g = null;
    if (!ativo) return;
    S.puxandoRes = false;
    li._semClique = true; setTimeout(() => { li._semClique = false; }, 400);   // o toque que puxou nao toca a linha
    li.classList.remove('puxando'); li.classList.add('voltando');
    li.querySelector('.corpo').style.transform = '';
    setTimeout(() => li.classList.remove('voltando', 'vai'), 260);
    if (passou && !cancelou) executar('fila', { tipo: 'resultado', r: li._r });
    if (S.buscaPendente) { S.buscaPendente = false; desenharBusca(); }
  }
  ul.addEventListener('pointerup', e => soltar(e, false));
  ul.addEventListener('pointercancel', e => soltar(e, true));
})();

/* rolos da parede (so no computador): esmaecem a borda de cima quando ainda ha disco escondido la */
function sombrear(r) {

/* a escolha gravada que esta desligada nao entra na lista (08/11): fica marcado o que esta em uso, e a escolha volta

function opcoes(sel, lista, atual, emUso) {

  for (const [v, t] of lista) { const o = el('option', null, t); o.value = v; sel.append(o); }
  const tem = v => v != null && [...sel.options].some(o => o.value === v);

}
function preencherDispositivos(r) {

/* ---------- celular (no PC): o QR, o codigo e os conectados. Aberto, confere a cada 2 s: o celular que acabou de
   parear aparece na lista, e o codigo vencido ou usado da lugar a outro ---------- */
let celT = 0, celQR = '', celIds = null, celLista = '';
async function abrirCelular() {
  const msg = $('#dcel-msg');
  celIds = null;
  msg.className = 'msg-dlg'; msg.textContent = I18N.t('phone.generating');
  $('#dlg-cel').showModal();

/* a proxima conferencia so sai depois da resposta: com o setInterval, uma resposta lenta podia chegar depois da
   seguinte e mostrar o codigo de antes */
function conferirCelular() {
  clearTimeout(celT);
  if ($('#dlg-cel').open) celT = setTimeout(async () => { await atualizarCelular(); conferirCelular(); }, 2000);
}
$('#dlg-cel').addEventListener('close', () => { clearTimeout(celT); celQR = ''; });
async function atualizarCelular() {
  const msg = $('#dcel-msg');
  let r;
  try { r = await api('GET', `/api/pareamento?caminho=${encodeURIComponent(location.pathname)}`); }
  catch (e) { msg.className = 'msg-dlg erro'; msg.textContent = e.message; return false; }
  $('#dcel-semrede').hidden = !!r.url;
  $('#dcel-par').hidden = !r.url;
  $('#dcel-par').classList.toggle('queimado', r.queimado);
  $('#dcel-url').textContent = r.url || '';
  $('#dcel-cod').textContent = r.codigo ? r.codigo.replace(/^(\d{3})(\d{3})$/, '$1 $2') : '';
  const vale = $('#dcel-vale');
  vale.classList.toggle('erro', r.queimado);
  vale.textContent = r.queimado
    ? I18N.t('phone.blocked')
    : I18N.t('phone.valid', { n: Math.max(1, Math.ceil(r.vale_s / 60)) });
  const chaveQR = r.qr ? r.qr.join('') : '';
  if (chaveQR !== celQR) {
    celQR = chaveQR; $('#dcel-qr').innerHTML = r.qr ? desenharQR(r.qr) : '';
    const svg = $('#dcel-qr svg'); if (svg) svg.setAttribute('aria-label', I18N.t('phone.qrLabel'));   // texto fora do innerHTML
  }
  desenharCelulares(r.celulares || []);
  return true;
}
/* o QR em pixels inteiros da tela (com a escala do Windows tambem): modulo borrado a camera le pior */
function desenharQR(linhas) {
  const n = linhas.length, borda = 4, lado = n + 2 * borda;
  const dpr = devicePixelRatio || 1, px = Math.max(3, Math.floor(220 * dpr / lado)) / dpr;
  let d = '';
  linhas.forEach((l, y) => {
    for (let x = 0; x < n;) {
      if (l[x] !== '1') { x++; continue; }
      let f = x; while (f < n && l[f] === '1') f++;
      d += `M${x + borda} ${y + borda}h${f - x}v1h${x - f}z`;
      x = f;
    }
  });
  return `<svg width="${lado * px}" height="${lado * px}" viewBox="0 0 ${lado} ${lado}" shape-rendering="crispEdges" role="img"><rect width="${lado}" height="${lado}" fill="#F4EFE6"/><path fill="#2A1812" d="${d}"/></svg>`;
}
function quando(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  if (d.toDateString() === new Date().toDateString()) return I18N.t('phone.today', { time: d.toLocaleTimeString(I18N.lang, { hour: '2-digit', minute: '2-digit' }) });
  return I18N.t('phone.onDate', { date: d.toLocaleDateString(I18N.lang, { day: '2-digit', month: '2-digit' }) });
}
function desenharCelulares(lista) {
  const ids = lista.map(c => c.id);
  const novo = celIds && lista.find(c => !celIds.includes(c.id));
  if (novo) { const m = $('#dcel-msg'); m.className = 'msg-dlg'; m.textContent = I18N.t('phone.connectedOk', { name: novo.nome }); }
  celIds = ids;
  const ul = $('#dcel-lista'), v = JSON.stringify(lista);
  if (v === celLista) return;   // a cada 2 s: so redesenha quando muda (o foco num Desconectar nao pula)
  celLista = v;
  ul.replaceChildren();
  if (!lista.length) { ul.append(el('li', 'cel-vazio', I18N.t('phone.noDevices'))); return; }
  for (const c of lista) {
    const li = el('li'), quem = el('span', 'cel-quem');
    quem.append(el('span', 'cel-nome', c.nome), el('span', 'cel-quando', I18N.t('phone.since', { when: quando(c.desde), seen: quando(c.visto) })));
    const b = el('button', 'btn', I18N.t('phone.disconnect')); b.type = 'button'; b.dataset.id = c.id;
    b.setAttribute('aria-label', I18N.t('phone.disconnectLabel', { name: c.nome, when: quando(c.desde) }));
    li.append(quem, b);
    ul.append(li);
  }
}

/* ---------- o que esta pagina pode: o caps que o servidor manda (no /api/state, no 401 do pareamento e no comeco do
   SSE), e nao o endereco dela. Ate ele chegar, nenhum controle do PC aparece ---------- */
const pode = rota => !!(S.caps && S.caps.rotas && S.caps.rotas.includes(rota));
function definirCaps(c) {
  const metricasAntes = pode('GET /api/metricas');
  S.caps = c && Array.isArray(c.rotas) ? c : null;
  $('#b-cel').hidden = !pode('GET /api/pareamento');
  desenharAtualizacao();
  if (!pode('GET /api/metricas')) $('#dd-met').hidden = true;
  else if (!metricasAntes && $('#dlg-disp').open) lerMetricas();   // o Microfone e fone aberto antes do caps chegar
}

/* ---------- conexao ---------- */
let es = null, foraT = null, reconT = null;
// o transporte.js que nao carregou (o servidor fora quando a pagina abriu): a conexao tenta carregar de novo, uma
// carga por vez e a cada 3 s, e com ele de volta a pagina segue a carga normal
let buscandoTransporte = false;
function carregarTransporte() {
  if (buscandoTransporte) return;
  buscandoTransporte = true;
  const s = document.createElement('script');
  s.src = 'transporte.js';
  s.onload = () => {
    buscandoTransporte = false;
    // carregou sem definir o TRANSPORTE (o portal do Wi-Fi respondendo com uma pagina, o script cortado): o mesmo
    // prazo do erro, sem laco
    if (typeof TRANSPORTE === 'undefined') { s.remove(); reconT = setTimeout(conectar, 3000); return; }
    carregar();
  };
  s.onerror = () => { buscandoTransporte = false; s.remove(); reconT = setTimeout(conectar, 3000); };
  document.head.append(s);
}
function conectar() {
  clearTimeout(reconT);
  if (typeof TRANSPORTE === 'undefined') { carregarTransporte(); return; }
  if (es) es.fechar();
  try { es = TRANSPORTE.eventos('/api/events'); } catch (e) { reconT = setTimeout(conectar, 3000); return; }
  const fonte = es;
  es.ao('open', () => online(true));
  // o primeiro evento: o que esta conexao pode (o papel nao muda nela; a revogacao a encerra)
  es.ao('caps', c => definirCaps(c));
  es.ao('desconectado', () => {
    // o PC desconectou este celular: a tela do codigo, e o caps de antes de parear vem no 401 do /api/state
    pedirPareamento(true);
    api('GET', '/api/state').catch(() => {});
  });
  es.ao('state', st => {
    online(true); S.state = st;
    desenharFaixa(); desenharReceptor(); desenharFila(); if (S.busca) atualizarResultados();
    desenharAtualizacao();
  });
  es.ao('library', lib => { S.lib = ordenarLib(lib); S.libOk = true; desenharPrateleira(); desenharFila(); if (S.busca) atualizarResultados(); });
  es.ao('jobs', jobs => {
    const antes = new Map(S.jobs.map(j => [j.id, j.status]));
    S.jobs = jobs;
    for (const j of S.jobs) if (j.status === 'error' && antes.get(j.id) === 'running') avisar(I18N.t('download.failed', { label: j.label, reason: motivoDownload(detalheMsg(j.error)) }), true);
    desenharPrateleira(); desenharFila(); if (S.busca) atualizarResultados();
  });
  es.ao('tick', t => {
    S.pos = t.pos; S.levels = t.levels || S.levels;
    S.posEm = performance.now(); S.posEmDe = t.pos;   // quando a posicao chegou: o relogio do visor mede o erro ali
    desenharTempo(); agulhasPixel();
  });
  es.aoFalhar(() => {
    if (S.pareando) return;
    online(false);
    if (!fonte.fechada()) return;
    fonte.fechar();
    // recusada de cara: o servidor fora, ou o 401 do celular desconectado no PC (o fluxo de eventos nao diz o status;
    // o /api/state diz, e o api() ja abre o pedido do codigo)
    api('GET', '/api/state').then(() => true, e => e.status !== 401)
      .then(volta => { if (volta && !S.pareando) reconT = setTimeout(conectar, 3000); });
  });
}
/* o aviso de fora do ar so conta o tempo com a pagina na tela (ao desbloquear o celular o aviso
   aparecia por uns 0,8 s): com o celular bloqueado a conexao cai e o prazo vencia escondido. Escondida, a pagina
   nunca arma o aviso; ao voltar, reconecta na hora (a conexao do tempo bloqueado pode estar morta sem ter avisado,
   e a nova traz o estado) e o prazo comeca dali */
function armarFora() {
  clearTimeout(foraT);
  if (document.hidden || S.pareando) return;
  foraT = setTimeout(() => { if (!S.online && !document.hidden) mostrarFora(); }, S.desligado ? 0 : 2500);
}
// (#107) o celular que muda de rede com o cartao aberto (sai dos dados moveis, liga o Wi-Fi): o texto acompanha
const redeMudou = () => { if (!$('#fora').hidden && !S.online && !S.desligado && !S.atualizando) mostrarFora(); };
addEventListener('online', redeMudou); addEventListener('offline', redeMudou);
if (navigator.connection) navigator.connection.addEventListener('change', redeMudou);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(foraT); return; }
  if (S.desligado || S.pareando) return;
  conectar();
  if (!S.online) armarFora();
});
function online(on) {
  if (on === S.online) return;
  S.online = on; agulhasPixel();
  const lamp = $('#lamp'), cx = $('#conexao');
  if (on) {
    S.jaConectou = true; S.desligado = false;
    if (S.atualizando) { location.reload(); return; }   // a versao nova abriu: a pagina passa a ser a dela
    clearTimeout(foraT); $('#fora').hidden = true;
    if (!S.efeitos && S.erroEfeitos) carregarEfeitos();
    lamp.className = 'lampada acesa'; cx.textContent = I18N.t('app.connected');
  } else {
    lamp.className = 'lampada alerta piscando'; cx.textContent = I18N.t('app.reconnecting');
    armarFora();
  }
  cx.classList.toggle('sr', on);   // conectado, a lampada acesa ja diz: o "ligado" fica so para o leitor de tela
}
function mostrarFora() {
  const f = $('#fora');
  fecharMenu(false);

  } else if (!(S.caps ? S.caps.papel === 'pc' : typeof TRANSPORTE === 'undefined' || TRANSPORTE.local)) {
    // (#107) no celular, o que mais cai e o caminho ate o computador (o celular nos dados moveis, sem Wi-Fi, numa rede
    // de convidados), e nao o Ritmelli: o cartao diz so o que se sabe, e o que o navegador conta da conexao (sem
    // nenhuma; nos dados moveis, o Chrome do Android pela Network Information API)
    const c = navigator.connection;

    $('#fora-p').textContent = I18N.t(navigator.onLine === false ? 'offline.phone.noConnection'

  } else {

    I18N.rico($('#fora-p'), 'offline.downText', { folder: '%LOCALAPPDATA%\\Ritmelli\\logs' });
  }
  $('#lamp').className = 'lampada'; $('#conexao').textContent = S.desligado ? I18N.t('app.off') : I18N.t('app.offline');
  $('#conexao').classList.remove('sr');

/* ---------- pareamento (no celular): a API responde 401 ate o celular mandar o codigo que o PC mostra. O QR ja

let codigoQR = new URLSearchParams(location.search).get('parear');

/* ---------- boas-vindas (so no PC): o passo a passo da primeira vez, quando o GET /api/boas-vindas diz. Fechar de
   qualquer jeito marca como vistas, e elas nao voltam. Abertas, conferem os dispositivos a cada 3 s: o microfone

   ouvinte so existe com a mesa montada (montarMesa): o wheel que bloqueia a rolagem, preso na pedaleira em toda tela,

/* gestos do Spotify, com o palco preso ao dedo: a barra e a beirada do palco recolhido;
   puxar a barra para cima sobe o palco inteiro, e a barra se apaga no primeiro terco da
   subida (a madeira do palco aparece por baixo); puxar o palco aberto para baixo (com ele no
   topo) faz o caminho de volta. No topo os aparelhos tem touch-action pan-down, entao o dedo
   descendo nao vira rolagem e o ponteiro chega a cada quadro */
(() => {
  const p = $('#palco'), mini = $('#mini');
  /* o touchmove cancelado diz ao Chrome que o gesto e da pagina: sem ele, a puxada rapida vira um fling
     mesmo sem nada para rolar, e o primeiro toque do 1 a 2 s seguintes so freia o fling, sem virar
     clique (19/10, medido no celular de teste: abrindo pela barra e fechando pelo palco). O
     ouvinte que bloqueia fica so onde o gesto comeca: a barra (inert com o palco aberto, fora do toque)
     e os aparelhos do topo enquanto o palco esta no topo; rolando, a rolagem nao espera por ele */
  const engolir = e => { if (g && g.ativo && e.cancelable) e.preventDefault(); };
  mini.addEventListener('touchmove', engolir, { passive: false });
  const doTopo = [...p.querySelectorAll('.palco-topo, .deck, .receptor')];
  let ouvindo = false;
  const noTopo = () => {
    const topo = p.scrollTop <= 0;
    p.classList.toggle('no-topo', topo);
    if (topo === ouvindo) return;
    ouvindo = topo;
    for (const x of doTopo) x[topo ? 'addEventListener' : 'removeEventListener']('touchmove', engolir, { passive: false });
  };
  p.addEventListener('scroll', noTopo, { passive: true });
  // posicao do palco: 0 = aberto, curso() = recolhido (so a barra aparece)
  const curso = () => p.offsetHeight - mini.offsetHeight;
  const cabeca = [...p.querySelector('.palco-topo').children];
  function por(y) {
    const c = curso(), yy = clamp(y, 0, c), o = clamp(3 * yy / c - 2, 0, 1);
    p.style.transform = `translateY(${yy}px)`;
    mini.style.opacity = String(o);
    for (const x of cabeca) x.style.opacity = String(clamp(1 - 2 * o, 0, 1));
  }
  const limpar = () => { p.style.transform = ''; mini.style.opacity = ''; for (const x of cabeca) x.style.opacity = ''; };
  let g = null;   // gesto em curso
  noTopo();
  function comecar(e, de) {
    if (e.pointerType !== 'touch' || !celular()) return;
    g = { de, id: e.pointerId, y0: e.clientY, x0: e.clientX, d: 0, v: 0, yAnt: e.clientY, tAnt: e.timeStamp, ativo: false };
  }
  function andar(e) {
    if (!g || e.pointerId !== g.id) return;
    const d = e.clientY - g.y0, dx = e.clientX - g.x0;
    if (!g.ativo) {
      if (Math.abs(d) < 6 && Math.abs(dx) < 6) return;   // ainda nao da para saber o gesto
      const certo = g.de === 'palco' ? d > 0 && p.scrollTop <= 0 : d < 0;
      if (!certo || Math.abs(dx) > Math.abs(d)) { g = null; return; }   // rolagem ou gesto de lado
      g.ativo = true;
      p.classList.add('puxando');
      if (g.de === 'barra') { p.scrollTop = 0; noTopo(); }   // recolhido, o pulo nao aparece
    }
    if (e.timeStamp > g.tAnt) { g.v = (e.clientY - g.yAnt) / (e.timeStamp - g.tAnt); g.yAnt = e.clientY; g.tAnt = e.timeStamp; }
    g.d = d;
    por(g.de === 'palco' ? d : curso() + d);
  }
  function soltar(e) {
    if (!g || e.pointerId !== g.id) return;
    const { ativo, de, d, v } = g;
    g = null;

  const b = e.target.closest('.pad[data-id]'); if (!b) return;
  e.preventDefault(); seguradaEm = Date.now();
  fecharMenu(false); abrirMenu(b, { tipo: 'disco', id: b.dataset.id });
});
for (const [b, lado] of [[$('#prat-esq'), -1], [$('#prat-dir'), 1]]) b.addEventListener('click', () => {
  const ul = $('#estante'), fim = ul.scrollWidth - ul.clientWidth, comp = reduz.matches ? 'auto' : 'smooth';
  if (lado > 0 ? ul.scrollLeft >= fim - 2 : ul.scrollLeft <= 2) ul.scrollTo({ left: lado > 0 ? 0 : fim, behavior: comp });
  else ul.scrollBy({ left: lado * Math.max(120, ul.clientWidth * .8), behavior: comp });
});
$('#estante').addEventListener('scroll', () => requestAnimationFrame(setasPrateleira), { passive: true });
new ResizeObserver(setasPrateleira).observe($('#estante'));
mqUnica.addEventListener('change', montarMesa);
montarMesa();

/* ---------- inicio ---------- */
montarMostradores();
new ResizeObserver(desenharVUs).observe($('.janela'));
$('#mini-cortar').innerHTML = $('#palco-cortar').innerHTML = IC_MIC;
inertPalco();
FADERS.forEach(([fi]) => pintarFader($(fi)));
carregarEfeitos();
if (location.hash === '#efeitos' && !celular()) abrirGaveta(true);
function carregar() {
  const geracao = geracaoPareamento;
  Promise.all([api('GET', '/api/state'), api('GET', '/api/library'), api('GET', '/api/jobs')])
    .then(([st, lib, jobs]) => {
      // o celular desconectado (ou pareado de novo) enquanto esta carga corria: ela nao vale mais
      if (S.pareando || geracao !== geracaoPareamento) return;
      S.state = st; S.pos = st.pos || 0; S.levels = st.levels || S.levels; S.lib = ordenarLib(lib); S.libOk = true; S.jobs = jobs;
      definirCaps(st.caps);
      online(true); desenharFaixa(); desenharReceptor(); desenharPrateleira(); desenharFila();
      boasVindasSePrecisar();
    })
    .catch(e => {
      if (geracao !== geracaoPareamento) return;   // a carga de antes do pareamento de agora: o erro dela nao vale mais
      if (e.status !== 401) { online(false); return; }
      // o codigo do QR so se usa sem pareamento: ja pareado (ou no proprio PC), ele segue valendo para outro celular
      if (codigoQR) { const c = codigoQR; codigoQR = null; parear(c); }
    })
    .finally(() => { if (!S.pareando && geracao === geracaoPareamento) conectar(); });
}
carregar();
</script>

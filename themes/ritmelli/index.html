<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritmelli</title>
<!-- i18n -->
<script src="i18n.js"></script>
<script src="browser-check.js"></script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="buttons.css">
<link rel="stylesheet" href="grid.css">
<link rel="stylesheet" href="top-bar.css">
<link rel="stylesheet" href="turntable.css">
<link rel="stylesheet" href="receiver.css">
<link rel="stylesheet" href="devices.css">
<link rel="stylesheet" href="wall.css">
<link rel="stylesheet" href="dialogs.css">
<link rel="stylesheet" href="phone.css">
<link rel="stylesheet" href="pedalboard.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="skin-vars.css">
<link rel="stylesheet" href="gerado/molduras.css">
<link rel="stylesheet" href="gerado/compactos.css">
<link rel="stylesheet" href="gerado/pecas.css">
<link rel="stylesheet" href="skin-top.css">
<link rel="stylesheet" href="skin-library.css">
<link rel="stylesheet" href="skin-feet.css">
<link rel="stylesheet" href="skin-track-display.css">
<link rel="stylesheet" href="skin-case.css">
<link rel="stylesheet" href="skin-transport.css">
<link rel="stylesheet" href="skin-turntable.css">
<link rel="stylesheet" href="skin-receiver.css">
<link rel="stylesheet" href="skin-cables.css">
<link rel="stylesheet" href="desktop-wall.css">
<link rel="stylesheet" href="dj-visor.css">
<link rel="stylesheet" href="screen-shape.css">
<link rel="stylesheet" href="desktop-library.css">
<link rel="stylesheet" href="dj-desk.css">
<link rel="stylesheet" href="maleta-b.css">
<link rel="stylesheet" href="dj-desk-empty-shelf.css">
<link rel="stylesheet" href="prateleira.css">
<link rel="stylesheet" href="prateleira-cartao.css">
<link rel="stylesheet" href="dj-desk-search-drag.css">
<link rel="stylesheet" href="low-screen.css">
<link rel="stylesheet" href="reduced-motion.css">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="mix.css">
<link rel="stylesheet" href="pedal.css">
<script src="shared.js"></script>
<script src="gerado/pecas.js"></script>
</head>
<body data-status="idle">
<div class="app">

  <header class="topo">
    <div class="marca">
      <span class="lampada" id="lamp" aria-hidden="true"></span>
      <h1 class="nome-marca">ritmelli</h1>
      <span class="conexao" id="conexao" role="status" data-i18n="app.connecting"></span>
    </div>
    <form class="busca" id="form-busca" role="search" inert>
      <label class="sr" for="q" data-i18n="search.prompt"></label>
      <span class="campo-q">
        <!-- o placeholder vem do textoBusca: mais curto no celular -->
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <button class="sair-busca" id="b-sair-busca" type="button" data-i18n-aria-label="nav.backToShelf" data-i18n-title="nav.backToShelf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12h-15"/><path d="M11 5.5L4.5 12l6.5 6.5"/></svg>
        </button>
        <button class="limpar-q" id="b-limpar-q" type="button" data-i18n-aria-label="search.clear" data-i18n-title="search.clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><mask id="x-vazado"><rect width="24" height="24" fill="#fff"/><path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></mask><circle cx="12" cy="12" r="11" fill="currentColor" mask="url(#x-vazado)"/></svg>
        </button>
      </span>
      <button class="btn" type="submit"><svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span class="rot-busca" data-i18n="search.submit"></span></button>
    </form>
    <div class="botoes-topo">
      <!-- so no computador: a troca entre a prateleira e o toca-discos (a pagina do disco nao tem a barra de baixo) e,
           na pagina do disco, o mutar da voz -->
      <button class="btn-madeira so-pc" id="b-pagina" type="button" data-i18n-title="nav.openDeck">
        <svg class="vai-disco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4"/></svg>
        <svg class="vai-prat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="4.2" height="13.5" rx=".8"/><rect x="9.5" y="5" width="4.2" height="13.5" rx=".8"/><rect x="15.6" y="5.6" width="4.2" height="13" rx=".8" transform="rotate(14 17.7 12.1)"/><path d="M2.5 21h19"/></svg>
        <span class="rot"><span class="vai-disco" data-i18n="nav.deck"></span><span class="vai-prat" data-i18n="nav.shelf"></span></span>
      </button>
      <button class="btn-madeira so-pc" id="b-mudo-topo" type="button" aria-pressed="false" data-i18n-title="voice.mute"><span class="ic-mic"></span><span class="rot" data-i18n="voice.mute"></span></button>
      <!-- so no PC, quando ha versao nova (atualizacao.py) -->
      <button class="btn-madeira" id="b-atualizar" type="button" data-i18n-title="top.newVersion" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11"/><path d="M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 16.5v3h15v-3"/></svg>
        <span class="rot" data-i18n="top.newVersion"></span>
      </button>
      <button class="btn-madeira" id="b-cel" type="button" data-i18n-title="top.connectPhone" hidden data-pode="GET /api/pareamento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M10.5 18.5h3"/></svg>
        <span class="rot" data-i18n="top.phone"></span>
      </button>
      <button class="btn-madeira" id="b-disp" type="button" data-i18n-title="top.devices">
        <!-- engrenagem: o microfone fica so no mutar, eram dois iguais na mesma tela -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(12 12) scale(.82) translate(-12 -12)"><circle cx="12" cy="12" r="3" vector-effect="non-scaling-stroke"/><path vector-effect="non-scaling-stroke" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg>
        <span class="rot" data-i18n="top.devices"></span>
      </button>
      <button class="btn-madeira" id="b-desligar" type="button" data-i18n-title="top.shutdownTitle" hidden data-pode="POST /api/shutdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></svg>
        <span class="rot" data-i18n="top.shutdown"></span>
      </button>
    </div>
  </header>

  <div class="palco" id="palco" tabindex="-1">
  <div class="mini" id="mini">
    <button class="mini-abrir" id="mini-abrir" type="button" aria-controls="palco" aria-expanded="false" data-i18n-aria-label="nav.openDeck"></button>
    <span class="mini-disco" aria-hidden="true"><span class="mini-gira"><span class="mini-rotulo" id="mini-rotulo"></span></span></span>
    <span class="mini-tit" id="mini-tit" aria-hidden="true" data-i18n="deck.noDisc"></span>
    <span class="mini-sub" id="mini-sub" aria-hidden="true" data-i18n="deck.hintMini"></span>
    <button class="mini-ef" id="mini-ef" type="button" hidden><span id="mini-ef-nome"></span><svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h2v1h-2zM6 0h2v1h-2zM0 1h3v1h-3zM5 1h3v1h-3zM1 2h6v1h-6zM2 3h4v2h-4zM1 5h6v1h-6zM0 6h3v1h-3zM5 6h3v1h-3zM0 7h2v1h-2zM6 7h2v1h-2z"/></svg></button>
    <button class="mini-btn" id="mini-cortar" type="button" aria-pressed="false" data-i18n-aria-label="voice.mute" data-i18n-title="voice.mute"></button>
    <button class="mini-btn mini-pc" id="mini-ant" type="button" data-i18n-aria-label="deck.previous" data-i18n-title="deck.previous" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5.5" width="2.4" height="13" rx="1" fill="currentColor"/><path d="M19 6.3v11.4a.9.9 0 0 1-1.4.73l-8-5.7a.9.9 0 0 1 0-1.46l8-5.7a.9.9 0 0 1 1.4.73z" fill="currentColor"/></svg></button>
    <button class="mini-btn mini-tocar" id="mini-tocar" type="button" data-i18n-aria-label="deck.play" disabled>
      <svg id="ic-mini" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
    </button>
    <button class="mini-btn mini-pc" id="mini-prox" type="button" data-i18n-aria-label="deck.next" data-i18n-title="deck.nextHint" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.6" y="5.5" width="2.4" height="13" rx="1" fill="currentColor"/><path d="M5 6.3v11.4a.9.9 0 0 0 1.4.73l8-5.7a.9.9 0 0 0 0-1.46l-8-5.7A.9.9 0 0 0 5 6.3z" fill="currentColor"/></svg></button>
    <span class="mini-tempo mini-pc" id="mini-tempo" aria-hidden="true">0:00 / 0:00</span>
    <button class="mini-btn mini-pc mini-seta" id="mini-seta" type="button" aria-expanded="false" data-i18n-aria-label="nav.openDeck" data-i18n-title="nav.openDeck"><svg viewBox="0 0 5 3" width="15" height="9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h1v1h-1zM1 1h3v1h-3zM0 2h5v1h-5z"/></svg></button>
    <span class="mini-prog" aria-hidden="true"><span id="mini-prog"></span></span>
  </div>
  <div class="palco-topo">
    <button class="btn-madeira palco-fechar" id="b-fechar-palco" type="button" data-i18n-aria-label="nav.closeDeck" data-i18n-title="nav.close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 9l6.5 6.5L18.5 9"/></svg>
    </button>
    <p class="palco-tit"><span class="sr" data-i18n="nav.deck"></span><span class="palco-chapa" aria-hidden="true"><span class="palco-luz"></span><span class="palco-marca">RITMELLI</span></span></p>
    <button class="mini-btn palco-cortar" id="palco-cortar" type="button" aria-pressed="false" data-i18n-aria-label="voice.mute" data-i18n-title="voice.mute"></button>
  </div>
  <canvas class="cabo-calha" id="cabo-calha" aria-hidden="true"></canvas>
  <section class="deck" data-i18n-aria-label="nav.deck">
    <div class="mesa"><div class="tampo">
      <div class="placa">
        <span class="selo-placa" aria-hidden="true"><b>RITMELLI</b><span>33 / 45 RPM</span></span>
      </div>
      <div class="prato" id="prato">
        <div class="giratorio">
          <div class="aro"></div>
          <div class="feltro"><span>ritmelli</span></div>
          <div class="disco"><div class="rotulo" id="rotulo"></div></div>
        </div>
        <div class="brilho"></div>
        <div class="eixo"></div>
      </div>
      <div class="descanso" aria-hidden="true"></div>
      <div class="base-braco" aria-hidden="true"></div>
      <div class="braco" id="braco" aria-hidden="true">
        <div class="tubo"></div>
      </div>
    </div>
    <span class="pes-mesa" aria-hidden="true"></span>
    <span class="cabo-rca cabo-mesa" aria-hidden="true"></span>
    </div>

    <div class="faixa">
      <p class="situacao"><span class="lampada" id="lamp-faixa" aria-hidden="true"></span><span id="situacao" data-i18n="deck.status.idle"></span></p>
      <h2 class="titulo-faixa" id="titulo-faixa"><span class="letreiro"><span data-i18n="deck.noDisc"></span></span></h2>
      <p class="canal-faixa"><span id="canal-faixa" data-i18n="deck.hint"></span><button class="acao-res salvar pixel livre" id="b-guardar" type="button" data-i18n-aria-label="shelf.save" hidden></button></p>
      <div class="visor-dj" id="visor-dj" aria-hidden="true"><canvas class="vdj-tela" id="vdj-tela"></canvas><span class="vdj-tempo" id="vdj-pos">0:00</span><span class="vdj-tempo vdj-resta" id="vdj-resta">0:00</span><span class="vdj-selo" id="vdj-selo" hidden></span></div>
      <div class="linha-tempo">
        <span class="tempo" id="t-pos">0:00</span>
        <input type="range" id="seek" min="0" max="0" step="0.1" value="0" data-i18n-aria-label="deck.position" disabled>
        <span class="tempo total" id="t-dur">0:00</span>
      </div>
      <div class="comandos">
        <button class="transp" id="b-aleatorio" type="button" aria-pressed="false" data-i18n-aria-label="deck.shuffle" data-i18n-title="deck.shuffleHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h2.6c1.7 0 2.8-.7 3.8-2.1l4.2-5.8C14.6 7.7 15.7 7 17.4 7H21"/><path d="M3 7h2.6c1.7 0 2.8.7 3.8 2.1l.5.7M14.1 14.2l.5.7c1 1.4 2.1 2.1 3.8 2.1H21"/><path d="M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg>
          <span class="lampada" aria-hidden="true"></span>
        </button>
        <button class="transp pulo" id="b-anterior" type="button" data-i18n-aria-label="deck.previous" data-i18n-title="deck.previousHint" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5.5" width="2.4" height="13" rx="1" fill="currentColor"/><path d="M19 6.3v11.4a.9.9 0 0 1-1.4.73l-8-5.7a.9.9 0 0 1 0-1.46l8-5.7a.9.9 0 0 1 1.4.73z" fill="currentColor"/></svg>
        </button>
        <button class="tocar-grande" id="b-tocar" type="button" data-i18n-aria-label="deck.play" disabled>
          <svg id="ic-tocar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
        </button>
        <button class="transp pulo" id="b-proxima" type="button" data-i18n-aria-label="deck.next" data-i18n-title="deck.nextHint" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.6" y="5.5" width="2.4" height="13" rx="1" fill="currentColor"/><path d="M5 6.3v11.4a.9.9 0 0 0 1.4.73l8-5.7a.9.9 0 0 0 0-1.46l-8-5.7A.9.9 0 0 0 5 6.3z" fill="currentColor"/></svg>
        </button>
        <button class="transp" id="b-repetir" type="button" aria-pressed="false" data-i18n-aria-label="deck.repeat" data-i18n-title="deck.repeatHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12V9.8A3.3 3.3 0 0 1 7.3 6.5H19.5"/><path d="M17 4l2.5 2.5L17 9"/><path d="M20 12v2.2a3.3 3.3 0 0 1-3.3 3.3H4.5"/><path d="M7 20l-2.5-2.5L7 15"/></svg>
          <span class="lampada" aria-hidden="true"></span>
        </button>
      </div>
      <button class="fim-disco" id="b-parecidas" type="button" role="switch" aria-checked="false" data-i18n-aria-label="deck.similarSwitch" hidden><span class="op op-so" data-i18n="deck.onlyThis"></span><span class="ch" aria-hidden="true"></span><span class="op op-par" data-i18n="deck.playSimilar"></span></button>
      <p class="erro-faixa" id="erro-faixa" role="alert" hidden><span class="lampada alerta" aria-hidden="true"></span><span id="erro-faixa-txt"></span></p>
      <!-- so na mesa de DJ: a luz do deck (NO AR) e o andamento medido -->
      <p class="deck-cab" hidden><span class="deck-luz"><span class="lampada" id="luz-ar" aria-hidden="true"></span><span class="deck-luz-t" id="luz-ar-t" data-i18n="deck.onAir"></span></span><span class="deck-bpm" id="bpm-ar-caixa"><span class="bpm-r">BPM</span><b id="bpm-ar">--,-</b><span class="bpm-pitch" id="pitch-ar"></span></span></p>
    </div>
    <section class="fila maleta fila-palco" data-i18n-aria-label="queue.title" hidden>
      <div class="cabeca-fila"><h2 data-i18n="queue.title"></h2><p class="conta"></p><button class="abre-fila" type="button" aria-expanded="false" data-i18n-aria-label="queue.open" data-i18n-title="queue.open"><svg viewBox="0 0 5 3" width="10" height="6" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h5v1h-5zM1 1h3v1h-3zM2 2h1v1h-1z"/></svg></button></div>
      <ol class="lista-fila" inert></ol>
      <span class="maleta-pe" aria-hidden="true"></span>
    </section>
    <p class="atalhos"><span><kbd data-i18n="keys.space"></kbd> <span data-i18n="keys.playPause"></span></span><span><kbd>1</kbd> <span data-i18n="keys.to"></span> <kbd>9</kbd> <span data-i18n="keys.playShelf"></span></span><span><kbd>0</kbd> <span data-i18n="keys.noEffect"></span></span><span><kbd>Esc</kbd> <span data-i18n="keys.stop"></span></span></p>
    <span class="deck-letra" aria-hidden="true" hidden></span>
  </section>

  <section class="receptor" data-i18n-aria-label="mixer.label">
    <span class="chassi-rec" aria-hidden="true">
      <span class="marca-ap"><b>RITMELLI</b><span data-i18n="mixer.plate"></span></span>
      <span class="parafusos-rec"></span>
      <span class="pes-ap"></span>
    </span>
    <span class="cabo-rca cabo-rec" aria-hidden="true"></span>
    <div class="medidores">
      <div class="janela" id="janela" role="img" data-i18n-aria-label="mixer.meters">
        <div class="mostrador" data-k="mic"></div>
        <div class="mostrador" data-k="track"></div>
        <div class="mostrador" data-k="out"></div>
      </div>
      <button class="btn seletor" id="b-efeito" type="button" aria-controls="gaveta" aria-expanded="false" data-i18n-title="effects.selectorHint">
        <span class="dial" aria-hidden="true"><svg class="marcas" id="marcas" viewBox="0 0 40 40"></svg><span class="knob"><span class="ponteiro" id="ponteiro"></span></span></span>
        <span class="visor-ef"><span class="sr" data-i18n="effects.currentLabel"></span><span class="sr" id="nome-ef" data-i18n="effects.none"></span><span class="sr" id="atraso-ef-sr"></span><span class="seg-ef" id="seg-ef" aria-hidden="true"></span><span class="atraso-ef" id="atraso-ef" aria-hidden="true"></span></span>
        <svg class="seta-gav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
      </button>
      <div class="chaves">
        <button class="btn chave" id="b-cortar" type="button" aria-pressed="false"><span class="lampada" aria-hidden="true"></span><span data-i18n="voice.mute"></span></button>
      </div>
    </div>
    <div class="controles">
      <div class="fader">
        <label for="f-vol" data-i18n="mixer.recordInGame"></label>
        <input type="range" id="f-vol" min="0" max="100" step="1" value="60" data-k="vol" data-escala="100">
        <output for="f-vol" id="o-vol">60%</output>
      </div>
      <div class="fader">
        <label for="f-mon"><span data-i18n="mixer.recordInHeadphones"></span><small></small></label>
        <input type="range" id="f-mon" min="0" max="100" step="1" value="60" data-k="mon_vol" data-escala="100">
        <output for="f-mon" id="o-mon">60%</output>
      </div>
      <div class="fader fader-voz">
        <label for="f-mic"><span data-i18n="mixer.voice"></span><small data-i18n="mixer.voiceWindows"></small></label>
